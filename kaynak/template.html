<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelime Kampı</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Layout: a study desk — sticky stat bar, then one working column; the game screen replaces the dashboard. Highlighter-pen marks the word being learned. */
:root {
  --paper: #F4F4F4;
  --surface: #FFFFFF;
  --surface-2: #ECECEC;
  --ink: #0A0A0A;
  --muted: #5E5E5E;
  --line: #DADADA;
  --accent: #2547D0;
  --accent-ink: #FFFFFF;
  --hl: #FFE14D;
  --hl-band: #FFE14D;
  --hl-ink: #2E2700;
  --good: #17845A;
  --good-soft: #DDF3E8;
  --bad: #C93C30;
  --bad-soft: #FBE3E0;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.06);
  --f-display: Georgia, "Times New Roman", ui-serif, serif;
  --f-body: "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #000000; --surface: #121212; --surface-2: #1E1E1E; --ink: #EDEDED; --muted: #A0A0A0; --line: #2C2C2C;
    --accent: #8FA6FF; --accent-ink: #000000; --hl: #F2D43A; --hl-band: rgba(242,212,58,.30); --hl-ink: #1E1A00;
    --good: #4FC98F; --good-soft: rgba(79,201,143,.16); --bad: #FF8173; --bad-soft: rgba(255,129,115,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="contrast"] {
  --paper: #000000; --surface: #000000; --surface-2: #1A1A00; --ink: #FFFFFF; --muted: #FFF176; --line: #FFE14D;
  --accent: #FFE14D; --accent-ink: #000000; --hl: #FFE14D; --hl-band: rgba(255,225,77,.34); --hl-ink: #000000;
  --good: #69F0AE; --good-soft: #003300; --bad: #FF8A80; --bad-soft: #3B0000;
  --shadow: none;
  color-scheme: dark;
}
:root[data-theme="dark"] {
  --paper: #000000; --surface: #121212; --surface-2: #1E1E1E; --ink: #EDEDED; --muted: #A0A0A0; --line: #2C2C2C;
  --accent: #8FA6FF; --accent-ink: #000000; --hl: #F2D43A; --hl-band: rgba(242,212,58,.30); --hl-ink: #1E1A00;
  --good: #4FC98F; --good-soft: rgba(79,201,143,.16); --bad: #FF8173; --bad-soft: rgba(255,129,115,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; background: none; border: 0; padding: 0; }
.brand b { font-family: var(--f-display); font-size: 21px; font-weight: 400; letter-spacing: -.01em; }
.brand b span { background-image: linear-gradient(var(--hl-band), var(--hl-band)); background-repeat: no-repeat; background-size: 100% 37%; background-position: 0 90%; padding: 0 2px; animation: hlDraw .7s .2s cubic-bezier(.6,.1,.2,1) both; }
.brand small { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stat { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 8px; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.stat svg { width: 18px; height: 18px; flex: none; }
.stat .lbl { color: var(--muted); font-weight: 600; font-size: 12px; }
.ring { --p: 0; width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(var(--good) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-items: center; flex: none; }
.ring::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); }
.tabs { display: flex; gap: 4px; min-width: 0; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 6px 12px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.tab[aria-current="true"] { background: var(--ink); color: var(--paper); }
@media (max-width: 440px) { .tabs { gap: 2px; } .tab { padding: 6px 9px; font-size: 14px; } }

main { padding-block: 22px 60px; }
.view { display: grid; gap: 22px; }
.eyebrow { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* hero */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
@media (max-width: 720px) { .hero { grid-template-columns: 1fr; } }
.greet { padding: 22px; display: grid; gap: 14px; align-content: start; }
.greet h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 4.4vw, 36px); line-height: 1.1; letter-spacing: -.015em; }
.greet p { margin: 0; color: var(--muted); max-width: 52ch; }
.rank { display: flex; align-items: center; gap: 12px; }
.rank .bar-x { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.rank .bar-x i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s; }
.rank small { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.rank b { font-size: 13.5px; }
.wotd { padding: 20px 22px; display: grid; gap: 8px; align-content: start; position: relative; }
.wotd .w { font-family: var(--f-display); font-size: 30px; line-height: 1.15; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wotd .tr { font-weight: 600; }
.wotd .syn { color: var(--muted); font-size: 13.5px; }
.hlw { background-image: linear-gradient(var(--hl-band), var(--hl-band)); background-repeat: no-repeat; background-size: 100% 38%; background-position: 0 92%; padding: 0 3px; animation: hlDraw .6s .15s cubic-bezier(.6,.1,.2,1) both; }

.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.iconbtn:hover { border-color: var(--accent); }
.iconbtn svg { width: 17px; height: 17px; }

/* level picker */
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
@media (max-width: 720px) { .levels { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 400px) { .levels { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.lvl { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 11px 9px; display: grid; gap: 6px; transition: border-color .15s, transform .15s; min-width: 0; }
.lvl:hover { transform: translateY(-1px); }
.lvl[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.lvl .code { font-family: var(--f-mono); font-weight: 600; font-size: 15px; }
.lvl .name { font-size: 11.5px; color: var(--muted); font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.prog i { display: block; height: 100%; }
.prog .m { background: var(--good); }
.prog .l { background: var(--hl); }
.lvl .num { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* modes */
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-h h2 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13.5px; }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 440px) { .modes { grid-template-columns: 1fr; } }
.mode { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 6px; align-content: start; position: relative; transition: border-color .15s, transform .15s; min-width: 0; }
.mode:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.mode:disabled { opacity: .5; cursor: not-allowed; }
.mode .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); margin-bottom: 4px; }
.mode .ic svg { width: 21px; height: 21px; }
.mode h3 { font-size: 16px; font-weight: 800; }
.mode p { margin: 0; font-size: 13px; color: var(--muted); }
.mode .badge { position: absolute; top: 14px; right: 14px; font-family: var(--f-mono); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.mode .badge.hot { background: var(--hl); color: var(--hl-ink); }
.mode.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mode.primary p { color: color-mix(in srgb, var(--paper) 75%, transparent); }
.mode.primary .ic { background: color-mix(in srgb, var(--paper) 14%, transparent); }

.tips { padding: 18px 20px; display: grid; gap: 10px; }
.tips ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--muted); font-size: 13.5px; }
.tips b { color: var(--ink); }

/* game */
.game { max-width: 640px; margin: 0 auto; width: 100%; display: grid; gap: 16px; }
.ghead { display: flex; align-items: center; gap: 12px; }
.gprog { flex: 1; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.gprog i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .35s; }
.combo { font-family: var(--f-mono); font-weight: 600; font-size: 13px; color: var(--muted); min-width: 64px; text-align: right; }
.combo.on { color: var(--accent); }
.timer { font-family: var(--f-mono); font-weight: 600; font-size: 15px; min-width: 44px; text-align: right; }
.qcard { padding: 26px 22px 22px; display: grid; gap: 18px; text-align: center; }
.qtype { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.qword { font-family: var(--f-display); font-size: clamp(30px, 7vw, 44px); line-height: 1.12; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; word-break: break-word; }
.qtr { font-size: clamp(20px, 4.6vw, 26px); font-weight: 700; line-height: 1.3; }
.qmeta { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.pill.lv { font-family: var(--f-mono); }
.pill.yds { background: var(--hl); color: var(--hl-ink); }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15.5px; transition: border-color .12s, background .12s; min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt kbd { font-family: var(--f-mono); font-size: 12px; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); flex: none; }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.typebox { display: grid; gap: 10px; }
.typebox input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 19px; font-weight: 600; text-align: center; }
.typebox input:focus { border-color: var(--accent); outline: none; }
.hintline { font-family: var(--f-mono); letter-spacing: .25em; color: var(--muted); font-size: 15px; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 800; background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.05); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 8px 12px; font-size: 13.5px; border-radius: 10px; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.feedback { border-radius: var(--r); padding: 16px 18px; display: grid; gap: 8px; text-align: left; animation: rise .25s ease; }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback .fh { font-weight: 800; display: flex; align-items: center; gap: 8px; }
.feedback.ok .fh { color: var(--good); }
.feedback.no .fh { color: var(--bad); }
.feedback .fw { font-family: var(--f-display); font-size: 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.feedback .fs { font-size: 13.5px; color: var(--muted); }
.feedback.unsure { background: color-mix(in srgb, var(--hl) 22%, var(--surface)); }
.feedback.unsure .fh { color: var(--ink); }
.unsure-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.tick { display: inline-flex; align-items: center; gap: 9px; border: 1.5px dashed var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14px; color: var(--muted); }
.tick:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
.tick .box { width: 18px; height: 18px; border-radius: 5px; border: 2px solid currentColor; display: grid; place-items: center; flex: none; }
.tick[aria-pressed="true"] { border-style: solid; border-color: var(--ink); color: var(--ink); background: color-mix(in srgb, var(--hl) 30%, var(--surface)); }
.tick[aria-pressed="true"] .box { background: var(--ink); border-color: var(--ink); }
.tick[aria-pressed="true"] .box::after { content: ""; width: 5px; height: 9px; border: solid var(--paper); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.tick kbd { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); }
.tick:disabled { opacity: .55; cursor: default; }
.unsure-note { flex-basis: 100%; font-size: 12.5px; color: var(--muted); }
.qcard.repeat { border-top: 4px solid var(--hl); }
.mark.un { background: var(--hl); color: var(--hl-ink); }
/* sentence questions + grammar */
.qsent { font-family: var(--f-display); font-size: clamp(19px, 4.2vw, 24px); line-height: 1.5; text-align: left; overflow-wrap: anywhere; }
.qsent .gap, .qstem .gap, .passage .gap { display: inline-block; min-width: 5.5em; border-bottom: 3px solid var(--ink); margin: 0 4px; background: var(--hl-band); border-radius: 4px 4px 0 0; height: 1.05em; vertical-align: -0.12em; }
.fsent { font-family: var(--f-display); font-size: 18px; line-height: 1.45; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; overflow-wrap: anywhere; }
b.fill { font-family: var(--f-body); font-weight: 800; background: var(--hl-band); padding: 0 4px; border-radius: 4px; }
.sentw { font-weight: 400; font-family: var(--f-display); }
.ritem[data-open] { cursor: pointer; }
.topics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .topics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .topics { grid-template-columns: 1fr; } }
.topic { padding: 14px 16px; display: grid; gap: 7px; align-content: start; min-width: 0; }
.topic .tt { display: flex; gap: 6px; flex-wrap: wrap; }
.topic h3 { font-size: 15.5px; font-weight: 800; line-height: 1.3; }
.topic .en { margin: 0; color: var(--muted); font-size: 12.5px; }
.topic .num { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.topicsheet { gap: 12px; }
.topicsheet .ttl { font-family: var(--f-display); font-weight: 400; font-size: 27px; line-height: 1.15; }
.topicsheet p { margin: 0; max-width: 62ch; }
.forms { display: grid; gap: 6px; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.forms code { font-family: var(--f-mono); font-size: 13px; white-space: normal; overflow-wrap: anywhere; }
.exs { display: grid; gap: 8px; }
.exs .ex { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-left: 3px solid var(--hl); padding-left: 10px; }
.exs .ex b { display: block; font-weight: 700; }
.exs .ex i { display: block; font-style: normal; color: var(--muted); font-size: 13.5px; }
/* YDS exam questions */
.passage { text-align: left; background: var(--surface-2); border-radius: 12px; padding: 14px 16px; max-height: 46vh; overflow: auto; font-size: 15px; line-height: 1.65; }
.passage p { margin: 0 0 8px; } .passage p:last-child { margin: 0; }
.pgap { font-weight: 800; padding: 0 5px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line); }
.pgap.cur { background: var(--hl); color: var(--hl-ink); border-color: var(--hl); }
.qstem { text-align: left; font-weight: 700; font-size: 16.5px; line-height: 1.5; overflow-wrap: anywhere; }
.dikte { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
.btn.big { font-size: 18px; padding: 16px 26px; display: inline-flex; align-items: center; gap: 8px; }
.btn.big svg { width: 20px; height: 20px; }
.opt.sel { border-color: var(--ink); background: color-mix(in srgb, var(--hl) 28%, var(--surface)); }
.mprog { flex: 1; font-size: 14px; color: var(--muted); } .mprog b { color: var(--ink); }
.timer.low { color: var(--bad); }
.mapcard { padding: 14px 16px; display: grid; gap: 12px; }
.mmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
.mq { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 0; font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; }
.mq.done { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mq.cur { outline: 2.5px solid var(--accent); outline-offset: 1px; }
.mq.flag { box-shadow: inset 0 -4px 0 var(--hl); }
.bigscore { text-align: center; font-family: var(--f-mono); font-size: 64px; font-weight: 600; line-height: 1; display: grid; gap: 6px; }
.bigscore small { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.secbars { display: grid; gap: 8px; }
.sb { display: grid; grid-template-columns: minmax(0, 11em) 1fr 3.2em; gap: 10px; align-items: center; font-size: 13.5px; }
.sbn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbbar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.sbbar i { display: block; height: 100%; border-radius: 99px; transform-origin: left; animation: grow .9s .2s cubic-bezier(.2,.7,.2,1) both; }
.sbbar i.g { background: var(--good); } .sbbar i.m { background: var(--hl); } .sbbar i.b { background: var(--bad); }
.sbv { font-family: var(--f-mono); text-align: right; }
.mockcard { padding: 20px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
@media (max-width: 720px) { .mockcard { grid-template-columns: 1fr; } }
.mockcard h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 4px 0 8px; }
.mockcard p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.mc-r.empty { display: grid; place-items: center; text-align: center; background: var(--surface-2); border-radius: 12px; padding: 16px; }
.mc-r.empty p { margin: 0; }
.mchart { height: 150px; }
/* plan, own words, weekly summary, badges */
.plan { padding: 18px 20px; display: grid; gap: 12px; }
.plan-h { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
.plan-h h2 { font-family: var(--f-display); font-weight: 400; font-size: 23px; margin-top: 4px; }
.datein { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; }
.datein input, .awform input, .awform select { padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: 14px; color: var(--ink); }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tasks li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.tasks li.done .tl { color: var(--muted); text-decoration: line-through; }
.chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff; }
.tasks li.done .chk { background: var(--good); border-color: var(--good); }
.addw { padding: 0; }
.addw summary { cursor: pointer; padding: 14px 16px; font-weight: 800; list-style-position: inside; }
.awform { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 16px 16px; }
.awform label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; min-width: 0; }
.awform .btnrow, .awform .savep { grid-column: 1 / -1; }
@media (max-width: 520px) { .awform { grid-template-columns: 1fr; } }
.weekcard { padding: 16px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 680px) { .weekcard { grid-template-columns: 1fr; } }
.wk { margin: 6px 0 0; font-size: 15px; }
.badgecard { padding: 16px 18px; display: grid; gap: 10px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.bdg { border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 2px; opacity: .6; }
.bdg.on { opacity: 1; border-style: solid; border-color: var(--hl); background: color-mix(in srgb, var(--hl) 16%, var(--surface)); }
.bdg .bi { font-size: 18px; color: var(--muted); } .bdg.on .bi { color: var(--hl-ink); }
.bdg b { font-size: 13.5px; } .bdg small { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
/* tap a word in a passage */
.passage.taps .tw { cursor: pointer; border-radius: 3px; }
.passage.taps .tw:hover { background: var(--hl-band); }
.taphint { margin: 6px 0 0; font-size: 12px; color: var(--muted); text-align: left; }
.wordpop { position: fixed; z-index: 55; width: min(320px, calc(100vw - 16px)); padding: 12px 14px; display: grid; gap: 6px; text-align: left; animation: rise .15s ease; }
.wordpop .wp-h { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 21px; }
.wordpop .wp-m { font-size: 14.5px; }
/* error analysis */
.trapcard { padding: 16px 18px; display: grid; gap: 12px; }
.trapw { display: grid; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.trapw p { margin: 0; }
.trapall summary { cursor: pointer; font-weight: 700; font-size: 13.5px; margin-bottom: 8px; }
.trapline { margin: 0; font-size: 14px; text-align: center; }
/* my progress */
.kpis.mekpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 600px) { .kpis.mekpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mekpis .kpi { background: var(--surface); border: 1px solid var(--line); }
.chartcard { padding: 16px 18px 12px; display: grid; gap: 12px; }
.chart { position: relative; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; height: 170px; padding-top: 18px; }
.chart .goal { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--muted); opacity: .55; pointer-events: none; }
.chart .col { position: relative; display: grid; grid-template-rows: 1fr 22px; min-width: 0; border-radius: 6px; outline-offset: 1px; }
.chart .col:hover .barv, .chart .col:focus-visible .barv { filter: brightness(1.15); }
.chart .barwrap { position: relative; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--line); }
.chart .barv { width: min(100%, 26px); background: var(--accent); border-radius: 4px 4px 0 0; }
.chart .vlab { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; color: var(--ink); transform: translateY(-2px); }
.chart .xl { font-size: 10.5px; color: var(--muted); text-align: center; align-self: end; white-space: nowrap; overflow: hidden; }
.chart .xl.now { color: var(--ink); font-weight: 800; }
.chart .col[data-tip]:hover::after, .chart .col[data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; bottom: calc(100% - 10px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 700; padding: 5px 8px; border-radius: 8px; white-space: nowrap; z-index: 3; pointer-events: none; }
.chart .col:first-child[data-tip]:hover::after, .chart .col:first-child[data-tip]:focus-visible::after { left: 0; transform: none; }
.chart .col:last-child[data-tip]:hover::after, .chart .col:last-child[data-tip]:focus-visible::after { left: auto; right: 0; transform: none; }
.merow, .hrow { grid-template-columns: 10px minmax(0, 1fr) minmax(0, 1.5fr) auto; }
.hrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) auto; cursor: default; }
.hrow:hover { background: var(--surface); }
.counts { display: grid; justify-items: end; font-family: var(--f-mono); font-size: 12.5px; gap: 1px; white-space: nowrap; }
.counts small { font-family: var(--f-body); color: var(--muted); font-size: 11.5px; }
.c-ok { color: var(--good); } .c-no { color: var(--bad); } .c-un { color: var(--muted); }
@media (max-width: 560px) { .merow { grid-template-columns: 10px minmax(0, 1fr) auto; } .hrow { grid-template-columns: minmax(0, 1fr) auto; } .hrow .t { grid-column: 1 / -1; grid-row: 2; } }
.emptyp { padding: 20px; margin: 0; color: var(--muted); }
.savep { margin: 0; font-size: 13.5px; color: var(--muted); }
.filebtn { position: relative; overflow: hidden; display: inline-flex; align-items: center; cursor: pointer; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.filebtn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* flash intro */
.flash { padding: 30px 22px; display: grid; gap: 14px; text-align: center; }
.flash .big { font-family: var(--f-display); font-size: clamp(34px, 8vw, 50px); line-height: 1.1; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
.flash .mean { font-size: 22px; font-weight: 700; }
.flash .syn { color: var(--muted); }

.dots i.on { background: var(--accent); }

/* match */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcol { display: grid; gap: 10px; align-content: start; }
.mt { padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; text-align: center; min-height: 52px; overflow-wrap: anywhere; transition: all .15s; }
.mt.en { font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.mt.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mt.done { opacity: .35; border-color: var(--good); pointer-events: none; }
.mt.wrong { border-color: var(--bad); background: var(--bad-soft); }

/* results */
.result { padding: 26px 22px; display: grid; gap: 18px; }
.result h2 { font-family: var(--f-display); font-weight: 400; font-size: 30px; text-align: center; }
.result .sub { text-align: center; color: var(--muted); margin: -8px 0 0; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

.kpi b { display: block; font-family: var(--f-mono); font-size: 24px; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-weight: 600; font-size: 12px; }
.rlist { display: grid; gap: 6px; max-height: 340px; overflow: auto; padding-right: 4px; }
.ritem { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.ritem .w { font-weight: 800; }
.ritem .t { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff; }
.mark.ok { background: var(--good); }
.mark.no { background: var(--bad); }

/* dictionary */
.dtools { display: grid; gap: 10px; }
.search { position: relative; }
.search input { width: 100%; padding: 12px 14px 12px 40px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 15px; }
.search input:focus { border-color: var(--accent); outline: none; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 99px; font-size: 13px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dcount { font-size: 13px; color: var(--muted); }
.dlist { display: grid; gap: 0; }
.drow { display: grid; grid-template-columns: 10px minmax(0, 1.1fr) minmax(0, 1.6fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; }
.drow:first-child { border-radius: var(--r) var(--r) 0 0; }
.drow:last-child { border-bottom: 0; border-radius: 0 0 var(--r) var(--r); }
.drow:hover { background: var(--surface-2); }
.drow .w { font-weight: 800; overflow-wrap: anywhere; }
.drow .w em { font-style: normal; font-weight: 600; color: var(--muted); font-size: 12px; margin-left: 6px; }
.drow .t { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.st { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid var(--line); }
.st.l { background: var(--hl); border-color: var(--hl); }
.st.m { background: var(--good); border-color: var(--good); }
.st.h { background: var(--bad); border-color: var(--bad); }
@media (max-width: 560px) { .drow { grid-template-columns: 10px minmax(0, 1fr) auto; } .drow .t { grid-column: 2 / -1; grid-row: 2; } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: grid; place-items: end center; padding: 16px; }
@media (min-width: 640px) { .scrim { place-items: center; } }
.sheet { width: min(560px, 100%); max-height: calc(100% - 20px); overflow: auto; padding: 22px; display: grid; gap: 14px; animation: rise .2s ease; }
.sheet .big { font-family: var(--f-display); font-size: 34px; line-height: 1.1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sheet .mean { font-size: 18px; font-weight: 700; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; }
.ai { background: var(--surface-2); border-radius: 12px; padding: 14px; display: grid; gap: 8px; font-size: 14px; }
.ai p { margin: 0; }
.ai .ex { border-left: 3px solid var(--hl); padding-left: 10px; }
.ai .ex i { color: var(--muted); font-style: normal; display: block; font-size: 13.5px; }
.close { position: sticky; top: 0; justify-self: end; margin-bottom: -40px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 60; box-shadow: var(--shadow); animation: rise .2s ease; max-width: calc(100% - 32px); text-align: center; }
.syncnote { font-size: 12px; color: var(--muted); text-align: center; }
.goalrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* motion */
@keyframes hlDraw { from { background-size: 0% 38%; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes flipIn { from { opacity: 0; transform: perspective(900px) rotateY(-14deg) translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.035); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes barUp { from { transform: scaleY(0); } }
@keyframes shine { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(220%); } }
@keyframes flicker { 0%, 100% { transform: scale(1) rotate(0); } 30% { transform: scale(1.08, .95) rotate(-3deg); } 60% { transform: scale(.96, 1.06) rotate(2deg); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 0) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -8px) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -64px) scale(1); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 60% { transform: rotate(9deg); } }
@keyframes gapPulse { 0%, 100% { border-bottom-color: var(--ink); } 50% { border-bottom-color: var(--accent); } }
@keyframes comboPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 16px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0); } }
.view > * { animation: fadeUp .5s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 70ms); }
.levels > *, .modes > *, .topics > *, .dlist > *, .rlist > *, .kpis > *, .chips > * { animation: cardIn .45s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 35ms + 80ms); }
.qcard, .result { animation: cardIn .4s cubic-bezier(.2,.7,.2,1) both; }
.flash { animation: flipIn .5s cubic-bezier(.2,.7,.2,1) both; }
.flash .mean, .flash .syn { animation: fadeUp .45s .3s both; }
.opt.ok { animation: pop .38s ease; }
.opt.no, .mt.wrong { animation: shake .42s ease; }
.mt.done { animation: pop .3s ease; }
.prog i, .rank .bar-x i { transform-origin: left; animation: grow .9s .25s cubic-bezier(.2,.7,.2,1) both; }
.gprog i { position: relative; overflow: hidden; }
.gprog i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); animation: shine 2.4s ease-in-out infinite; }
.chart .barv { transform-origin: bottom; animation: barUp .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms + 150ms); }
.stat .flame { transform-origin: 50% 90%; animation: flicker 2.6s ease-in-out infinite; }
.stat.bump { animation: bump .45s ease; }
.combo.on { display: inline-block; animation: comboPulse 1s ease-in-out infinite; }
.mode:hover:not(:disabled) .ic svg { animation: wiggle .5s ease; }
.qsent .gap { animation: gapPulse 1.8s ease-in-out infinite; }
.toast { animation: toastIn .3s cubic-bezier(.2,.7,.2,1); }
.xpfloat { position: fixed; z-index: 70; pointer-events: none; font-family: var(--f-mono); font-weight: 600; font-size: 15px; color: var(--good); text-shadow: 0 1px 0 var(--surface); animation: floatUp .95s ease-out forwards; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 65; }
.still .view > *, .still .levels > *, .still .modes > *, .still .topics > *, .still .dlist > *, .still .rlist > *, .still .kpis > *, .still .chips > *, .still .prog i { animation: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.skip { position: absolute; left: 8px; top: 8px; z-index: 80; padding: 8px 12px; background: var(--ink); color: var(--paper); border-radius: 8px; transform: translateY(-120%); }
.skip:focus { transform: none; }
.ipa { font-family: var(--f-mono); color: var(--muted); font-size: 13px; font-weight: 500; }
.ex-local { margin: 0; color: var(--muted); font-size: 13.5px; }
.ex-local i { display: block; font-style: normal; color: var(--ink); margin-top: 2px; }
</style>

<script id="words" type="application/json">__WORDS__</script>
<script id="gram" type="application/json">__GRAM__</script>
<script id="sents" type="application/json">__SENTS__</script>
<script id="exam" type="application/json">__EXAM__</script>
<script id="depth" type="application/json">__DEPTH__</script>
<script>
(() => {
"use strict";
/* ---------- data ---------- */
const RAW = JSON.parse(document.getElementById("words").textContent);
const W = RAW.map((r, i) => ({ i, w: r[0], p: r[1], t: r[2], l: r[3], y: r[4] === 1, s: r[5] || "", ipa: r[6] || "" }));
const BYKEY = new Map(W.map(x => [x.w.toLowerCase(), x]));
// grammar topics: {id, lv, en, tr, p: explanation paragraphs, f: forms, e: [en, tr] examples, q: [sentence, answer, distractors, why]}
const G = JSON.parse(document.getElementById("gram").textContent);
const GQ = []; // flat list of grammar questions
for (const t of G) t.q.forEach((q, n) => { const it = { id: t.id + "-" + n, t, s: q[0], a: q[1], d: q[2], why: q[3] }; t.items = t.items || []; t.items.push(it); GQ.push(it); });
const GBYID = new Map(G.map(t => [t.id, t]));
// vocabulary-in-context sentences: [lemma, answer form, sentence, distractors, Turkish]
const V = JSON.parse(document.getElementById("sents").textContent).map((r, n) => ({ id: "s" + n, w: BYKEY.get(r[0].toLowerCase()), a: r[1], s: r[2], d: r[3], tr: r[4] })).filter(x => x.w);
// YDS question bank: groups {id, type, lv, topic, p: passage, qs: [{s, a, x, w}]}; each question becomes an item
const EX = JSON.parse(document.getElementById("exam").textContent);
const EXI = [];
for (const g of EX) g.items = g.qs.map((q, n) => { const it = { id: g.id + "-" + n, g, n, s: q.s, a: q.a, x: q.x, why: q.w, k: q.k || "", t: q.t || "" }; EXI.push(it); return it; });
const EXBYID = new Map(EXI.map(it => [it.id, it]));
const DEPTH = JSON.parse(document.getElementById("depth").textContent);
const XI = [];
DEPTH.fam.forEach((r, n) => XI.push({ id: "f" + n, cat: "fam", s: r.s, a: r.a, d: r.d, tr: r.tr, why: "Kelime ailesi: " + r.forms }));
DEPTH.conf.forEach((r, n) => XI.push({ id: "c" + n, cat: "conf", s: r.s, a: r.a, d: r.d, tr: r.tr, why: r.why }));
DEPTH.coll.forEach((r, n) => XI.push({ id: "k" + n, cat: "coll", s: r.s, a: r.a, d: r.d, tr: r.tr, why: r.why }));

/* ---------- question building ---------- */
function choosePractice(lv, n) {
  const ws = pool(lv);
  const dueW = shuffle(ws.filter(due));
  const seen = shuffle(ws.filter(w => getP(w) && !due(w)));
  const fresh = shuffle(ws.filter(w => !getP(w)));
  // mostly due, then a mix of seen and new so practice also introduces words
  const out = [];
  for (const src of [dueW, fresh.slice(0, Math.ceil(n / 2)), seen, fresh]) for (const w of src) { if (out.length >= n) break; if (!out.includes(w)) out.push(w); }
  return shuffle(out);
}
function distractors(w, field, n = 3, lv = S.level) {
  const val = x => field === "t" ? firstMeaning(x.t) : field === "s" ? x.s.split(",")[0].trim() : x.w;
  const mainPos = w.p.split("/")[0];
  let cands = pool(lv).filter(x => x !== w && x.p.split("/")[0] === mainPos && (field !== "s" || x.s));
  if (cands.length < 12) cands = W.filter(x => x !== w && x.p.split("/")[0] === mainPos && (field !== "s" || x.s));
  const right = val(w).toLowerCase();
  const seen = new Set([right]);
  const tm = meanSet(w);
  const out = [];
  for (const x of shuffle(cands)) { const v = val(x); if ([...meanSet(x)].some(m => tm.has(m))) continue; if (!seen.has(v.toLowerCase())) { seen.add(v.toLowerCase()); out.push(v); } if (out.length >= n) break; }
  return out;
}
function mcQ(w, kind) {
  if (kind === "entr") { const right = firstMeaning(w.t); return { kind, w, prompt: w.w, right, opts: shuffle([right, ...distractors(w, "t")]) }; }
  if (kind === "tren") { return { kind, w, prompt: w.t, right: w.w, opts: shuffle([w.w, ...distractors(w, "w")]) }; }
  if (kind === "syn") { const syns = w.s.split(",").map(s => s.trim()).filter(Boolean); const right = pick(syns); const ds = distractors(w, "s").filter(d => !syns.map(s => s.toLowerCase()).includes(d.toLowerCase())); return { kind, w, prompt: w.w, right, opts: shuffle([right, ...ds.slice(0, 3)]) }; }
  if (kind === "type") return { kind, w, prompt: w.t, right: w.w };
}
function kindForBox(w) { const p = getP(w); const b = p ? p[0] : 0; return b <= 1 ? "entr" : b <= 3 ? "tren" : "type"; }

/* ---------- sentence (cloze) questions: grammar and vocabulary in context ---------- */
const isCloze = q => q.kind === "gcloze" || q.kind === "vcloze" || q.kind === "xcloze" || q.kind === "ex";
function clozeQ(item, kind) { return { kind, item, w: kind === "vcloze" ? item.w : null, right: item.a, opts: shuffle([item.a, ...item.d]) }; }
function exQ(item) { return { kind: "ex", item, w: null, right: item.a, opts: item.g.type === "irrelevant" ? ROMAN.slice() : shuffle([item.a, ...item.x]) }; }
function xQ(item) { return { kind: "xcloze", item, w: null, right: item.a, opts: shuffle([item.a, ...item.d]) }; }
const dikteQ = w => ({ kind: "dikte", w, right: w.w });
const sdikteQ = item => ({ kind: "sdikte", item, w: item.w, right: item.s.replace("___", item.a) });
const KEYP = { gcloze: "g:", vcloze: "v:", ex: "e:", xcloze: "x:", sdikte: "sd:" };
const qKey = q => KEYP[q.kind] ? KEYP[q.kind] + q.item.id : (q.kind === "dikte" ? "d:" : "w:") + q.w.w.toLowerCase();
function repeatQ(q) {
  if (q.kind === "ex") return exQ(q.item);
  if (q.kind === "xcloze") return xQ(q.item);
  if (q.kind === "dikte") return dikteQ(q.w);
  if (q.kind === "sdikte") return sdikteQ(q.item);
  return isCloze(q) ? clozeQ(q.item, q.kind) : mcQ(q.w, otherKind(q.kind));
}
const fillBlank = (s, a) => esc(s).replace("___", `<b class="fill">${esc(a)}</b>`);
const plainFill = (s, a) => s.replace("___", a);
function gradeMap(map, id, ok, unsure, revealed) {
  const p = map[id] ? map[id].slice() : [0, today(), 0, 0, today(), 0];
  if (ok && !unsure) { p[0] = Math.min(7, p[0] + 1); p[2]++; p[1] = today() + INTERVALS[p[0]]; }
  else if (ok) { p[0] = Math.min(p[0], 1); p[1] = today(); }
  else { p[0] = 0; p[3]++; p[1] = today(); }
  if (unsure || revealed) p[5] = (p[5] || 0) + 1;
  p[4] = today();
  map[id] = p;
}
// due or missed first, then unseen, then the rest
function pickItems(items, map, n) {
  const t = today(), st = it => map[it.id];
  return [...shuffle(items.filter(it => st(it) && st(it)[1] <= t)), ...shuffle(items.filter(it => !st(it))), ...shuffle(items.filter(it => st(it) && st(it)[1] > t))].slice(0, n);
}
const gItems = lv => GQ.filter(it => lv === "ALL" || it.t.lv === lv);
const vItems = lv => V.filter(it => inLevel(it.w, lv));
const gHard = lv => gItems(lv).filter(it => { const p = S.gq[it.id]; return p && p[3] > 0 && p[0] < 2; });
function topicStats(t) { let learned = 0, seen = 0, wrong = 0; for (const it of t.items) { const p = S.gq[it.id]; if (p) { seen++; if (p[0] >= 2) learned++; if (p[3] > 0 && p[0] < 2) wrong++; } } return { learned, seen, wrong, total: t.items.length }; }
function weakExamTypes() {
  return Object.keys(EXTYPES).map(t => {
    let o = 0, x = 0;
    const items = EX.filter(g => g.type === t).flatMap(g => g.items);
    items.forEach(it => { const p = S.eq[it.id]; if (p) { o += p[2]; x += p[3]; } });
    const miss = items.filter(it => { const p = S.eq[it.id]; return p && p[3] > 0 && p[0] < 2; });
    return { t, acc: o + x >= 3 ? o / (o + x) : null, miss };
  }).filter(x => x.acc !== null && x.acc < .7).sort((a, b) => a.acc - b.acc);
}
function startWeakDrill() {
  const qs = [];
  const used = new Set();
  const add = q => { const k = qKey(q); if (used.has(k)) return; used.add(k); qs.push(q); };
  const topics = G.map(t => ({ t, s: topicStats(t) })).filter(x => x.s.wrong > 0).sort((a, b) => b.s.wrong - a.s.wrong);
  for (const x of topics) {
    if (qs.length >= 6) break;
    shuffle(x.t.items.filter(it => { const p = S.gq[it.id]; return p && p[3] > 0; })).slice(0, 2).forEach(it => add(clozeQ(it, "gcloze")));
  }
  for (const x of weakExamTypes()) {
    if (qs.length >= 11) break;
    const pool = x.miss.length ? x.miss : EX.filter(g => g.type === x.t).flatMap(g => g.items);
    shuffle(pool).slice(0, 2).forEach(it => add(exQ(it)));
  }
  for (const w of W.filter(isHard).sort((a, b) => getP(b)[3] - getP(a)[3])) {
    if (qs.length >= 15) break;
    add(mcQ(w, qs.length % 2 ? "tren" : "entr"));
  }
  if (qs.length < 15) gHard("ALL").forEach(it => { if (qs.length < 15) add(clozeQ(it, "gcloze")); });
  if (qs.length < 15) W.filter(w => { const p = getP(w); return p && p[3] > 0; }).forEach(w => { if (qs.length < 15) add(mcQ(w, "entr")); });
  if (!qs.length) return toast("Henüz zayıf nokta yok. Biraz pratik yapınca burada 15 soruluk bir tur açılır.");
  startGame("weak", shuffle(qs).slice(0, 15));
}

/* ---------- game engine ---------- */
let game = null;
function startGame(mode, arg, key) {
  const lv = S.level, glv = S.glevel;
  let qs = [], intro = null;
  if (mode === "learn") {
    const fresh = shuffle(pool(lv).filter(w => !getP(w))).slice(0, 6);
    if (!fresh.length) return toast("Bu seviyede yeni kelime kalmadı. Tebrikler!");
    intro = fresh;

      <div><b>${esc(w.t)}</b></div>${w.s ? `<div class="fs">Eş anlamlıları: ${esc(w.s)}</div>` : ""}
      ${!isTyping(q) ? contBtn() : ""}</div>`;
    say(w.w);
    const c = document.getElementById("cont"); if (c) { c.addEventListener("click", next); c.focus({ preventScroll: true }); }
  } else if (ok && !near) {
    fb.innerHTML = `<div class="feedback ok" role="status"><div class="fh">${esc(pick(PRAISE))} ${xpTag(xp)}</div>
      <div class="fs"><b>${esc(w.w)}</b> = ${esc(w.t)}${w.s ? ` · eş anlamlı: ${esc(w.s)}` : ""}</div></div>`;
    if (!isTyping(q)) setTimeout(() => { if (game && game.answered && game.qs[game.i] === q) next(); }, 1300);
    else { const sb = app.querySelector("#tform .btn"); if (sb) sb.focus({ preventScroll: true }); }
    if (q.kind === "tren" || isTyping(q)) say(w.w);
  } else {
    fb.innerHTML = `<div class="feedback ${near ? "ok" : "no"}" role="status">
      <div class="fh">${near ? `Neredeyse! Küçük bir yazım farkı var, doğru saydım. ${xpTag(xp)}` : revealed ? "Sorun değil, şimdi öğren." : esc(pick(COMFORT))}</div>
      ${!near && canRepeat() ? `<div class="fs">${esc(later)}</div>` : ""}
      <div class="fw"><span class="hlw">${esc(w.w)}</span>${spk(w.w)}<span class="pill">${esc(posTr(w.p))}</span></div>
      <div><b>${esc(w.t)}</b></div>
      ${w.s ? `<div class="fs">Eş anlamlıları: ${esc(w.s)}</div>` : ""}
      ${!near && game.boxDrop ? `<div class="fs"><b>Tekrar kutusu:</b> ${esc(game.boxDrop)}</div>` : ""}
      ${!near && choice && !isTyping(q) ? `<div class="fs">Senin seçtiğin "${esc(choice)}"${(() => { const o = q.kind === "tren" ? BYKEY.get(choice.toLowerCase()) : null; return o ? ` = ${esc(firstMeaning(o.t))}` : ""; })()}</div>` : ""}
      ${!isTyping(q) ? contBtn() : ""}
    </div>`;
    say(w.w);
    const c = document.getElementById("cont"); if (c) { c.addEventListener("click", next); c.focus({ preventScroll: true }); }
  }
  const comboEl = app.querySelector(".combo"); if (comboEl) { comboEl.textContent = game.combo >= 2 ? "×" + game.combo + " seri" : ""; comboEl.classList.toggle("on", game.combo >= 3); }
  if (game.combo === 5 || game.combo === 10) { toast(`${game.combo} doğru üst üste! Seri bonusu açıldı.`); confetti(game.combo === 10 ? 110 : 60, .3); }
}
function flashFb(ok, w) { const fb = document.getElementById("fb"); if (fb && !ok) fb.innerHTML = `<div class="feedback no"><div class="fw"><span class="hlw">${esc(w.w)}</span></div><div><b>${esc(w.t)}</b></div></div>`; }
function next() {
  if (!game) return;
  game.answered = false; game.i++;
  if (game.i < game.qs.length) return renderGame();
  if (game.stage === "test" && canRepeat() && game.missed.length) { game.phase = "review"; window.scrollTo({ top: 0 }); return renderGame(); }
  finishGame();
}
function startRepeat() {
  game.stage = "repeat"; game.phase = "play"; game.i = 0; game.combo = 0;
  game.tries = new Map(game.missed.map(q => [qKey(q), 1]));
  // word questions come back from the other direction; sentence questions come back with shuffled options
  game.qs = shuffle(game.missed).map(repeatQ);
  renderGame();
}
const spkText = t => `<button class="iconbtn" type="button" data-say="${esc(t)}" aria-label="Cümleyi dinle">${SPK}</button>`;
// one row describing a question in review and result lists
function itemRow(q, tag) {
  const mark = `<span class="mark ${tag}">${tag === "ok" ? "✓" : tag === "un" ? "?" : "✗"}</span>`;
  if (q.kind === "gcloze") return `<div class="ritem">${mark}<span><span class="w sentw">${fillBlank(q.item.s, q.item.a)}</span><br><span class="t">${esc(q.item.t.tr)} · ${esc(q.item.why)}</span></span><button class="iconbtn" type="button" data-topic="${esc(q.item.t.id)}" aria-label="Konu anlatımını aç"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg></button></div>`;
  if (q.kind === "ex") { const it = q.item; const stem = it.g.type === "cloze" ? `Paragraftaki (${it.n + 1}) numaralı boşluk` : it.s; return `<div class="ritem">${mark}<span><span class="w" style="font-weight:700">${esc(EXTYPES[it.g.type].name)}</span><br><span class="t">${esc(stem.length > 160 ? stem.slice(0, 160) + "…" : stem)}</span><br><span class="t"><b style="color:var(--ink)">Doğru cevap:</b> ${esc(it.a)}</span><br><span class="t">${esc(it.why)}</span></span><span></span></div>`; }
  if (q.kind === "xcloze") return `<div class="ritem">${mark}<span><span class="w sentw">${fillBlank(q.item.s, q.item.a)}</span><br><span class="t">${esc(q.item.tr)}</span><br><span class="t">${esc(q.item.why)}</span></span>${spkText(plainFill(q.item.s, q.item.a))}</div>`;
  if (q.kind === "sdikte") return `<div class="ritem">${mark}<span><span class="w sentw">${esc(q.right)}</span><br><span class="t">${esc(q.item.tr)}</span></span>${spkText(q.right)}</div>`;
  if (q.kind === "vcloze") return `<div class="ritem">${mark}<span><span class="w sentw">${fillBlank(q.item.s, q.item.a)}</span><br><span class="t">${esc(q.item.tr)}</span><br><span class="t"><b style="color:var(--ink)">${esc(q.w.w)}</b> = ${esc(q.w.t)}</span></span>${spkText(plainFill(q.item.s, q.item.a))}</div>`;
  const w = q.w;
  return `<div class="ritem" data-open="${w.i}" role="button" tabindex="0">${mark}<span><span class="w">${esc(w.w)}</span> <em class="t" style="font-style:normal">${esc(posTr(w.p))}</em><br><span class="t" style="color:var(--ink)">${esc(w.t)}</span>${w.s ? `<br><span class="t">≈ ${esc(w.s)}</span>` : ""}</span>${spk(w.w)}</div>`;
}
function wireRows(root) {
  root.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openWord(W[+b.dataset.open])));
  root.querySelectorAll("[data-topic]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); openTopic(GBYID.get(b.dataset.topic), true); }));
}

/* review between test and repeat: study the missed questions before being asked again */
function renderReview() {
  const ms = game.missed;
  const testRes = game.results.filter(r => r.stage === "test");
  const right = testRes.filter(r => r.ok && !r.unsure).length;
  const unit = ms.some(isCloze) ? "soru" : "kelime";
  app.innerHTML = `<section class="game"><div class="card result">
    <span class="eyebrow" style="text-align:center">Test bitti · ${right}/${testRes.length} doğru</span>
    <h2>Şimdi tekrar zamanı</h2>
    <p class="sub">Bilemediğin ya da "bilmiyorum" diye işaretlediğin ${ms.length} ${unit} var. Önce bunlara bir göz at, sonra her birini tekrar soracağım. Yine kaçırırsan turun sonunda bir kez daha gelir.</p>
    <div class="rlist" style="max-height:none">${ms.map(q => { const r = testRes.find(x => qKey(x.q) === qKey(q)); return itemRow(q, r && r.unsure ? "un" : "no"); }).join("")}</div>
    <div class="btnrow"><button class="btn" type="button" id="goRepeat">Tekrar testine başla</button><button class="btn ghost" type="button" id="skipRepeat">Tekrarı atla</button></div>
  </div></section>`;
  wireRows(app);
  document.getElementById("goRepeat").addEventListener("click", startRepeat);
  document.getElementById("goRepeat").focus({ preventScroll: true });
  document.getElementById("skipRepeat").addEventListener("click", finishGame);
}
function finishGame() {
  if (!game) return;
  clearInterval(game.timer);
  if (game.mode === "speed") { const c = game.results.filter(r => r.ok).length; if (c > S.best) { S.best = c; game.record = true; } }
  const tr = game.results.filter(r => r.stage !== "repeat");
  if (tr.length) {
    S.hist.push({ ts: Date.now(), d: today(), m: game.mode, lv: game.lv || S.level, t: game.topic || undefined, ok: tr.filter(r => r.ok && !r.unsure).length, n: tr.length, xp: game.xp, rep: game.stage === "repeat" ? game.missed.length : 0 });
    if (S.hist.length > 300) S.hist = S.hist.slice(-300);
    if (tr.length >= 10 && tr.every(r => r.ok && !r.unsure)) S.perfect = 1;
  }
  checkBadges();
  persist();
  game.phase = "done";
  renderGame();
}

/* intro (learn mode) */
function renderIntro() {
  const w = game.intro[game.introI];
  app.innerHTML = `<section class="game">${head(game.introI / (game.intro.length + game.qs.length))}
    <div class="card flash"><span class="qtype">Yeni kelime ${game.introI + 1} / ${game.intro.length}</span>
      <div class="big"><span class="hlw">${esc(w.w)}</span>${spk(w.w)}</div>
      ${metaPills(w)}
      <div class="mean">${esc(w.t)}</div>
      ${w.s ? `<div class="syn">Eş anlamlıları: ${esc(w.s)}</div>` : ""}
      <div class="dots" aria-hidden="true">${game.intro.map((_, i) => `<i class="${i <= game.introI ? "on" : ""}"></i>`).join("")}</div>
      <div class="btnrow">${game.introI > 0 ? '<button class="btn ghost" type="button" id="prev">Geri</button>' : ""}<button class="btn" type="button" id="nxt">${game.introI < game.intro.length - 1 ? "Sonraki kelime" : "Şimdi kendini sına"}</button></div>
      <div class="syncnote">İpucu: kelimeyi dinle, sesli tekrar et ve kafanda bir cümle kur.</div>

  const p = document.getElementById("prev"); if (p) p.addEventListener("click", () => { game.introI--; renderGame(); });
  document.getElementById("nxt").focus({ preventScroll: true });
}

/* match */
function renderMatch() {
  const round = game.qs[game.i];
  if (!game.cur || game.cur.round !== game.i) game.cur = { round: game.i, left: shuffle(round), right: shuffle(round), done: new Set(), errs: new Set() };
  const c = game.cur;
  app.innerHTML = `<section class="game">${head(game.i / game.qs.length)}
    <div class="card qcard"><span class="qtype">Eşleştir · Tur ${game.i + 1} / ${game.qs.length}</span>
      <div class="match"><div class="mcol">${c.left.map(w => `<button class="mt en${c.done.has(w) ? " done" : ""}" type="button" data-l="${w.i}">${esc(w.w)}</button>`).join("")}</div>
      <div class="mcol">${c.right.map(w => `<button class="mt${c.done.has(w) ? " done" : ""}" type="button" data-r="${w.i}">${esc(firstMeaning(w.t))}</button>`).join("")}</div></div>
      <div id="fb" class="syncnote">Soldan bir kelime, sağdan anlamını seç.</div></div></section>`;
  wire();
  let selL = null;
  app.querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => { app.querySelectorAll("[data-l]").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); selL = W[+b.dataset.l]; say(selL.w); }));
  app.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => {
    if (!selL) { document.getElementById("fb").textContent = "Önce soldan bir İngilizce kelime seç."; return; }
    const target = W[+b.dataset.r];
    const lb = app.querySelector(`[data-l="${selL.i}"]`);
    if (target === selL) {
      lb.classList.remove("sel"); lb.classList.add("done"); b.classList.add("done");
      c.done.add(selL);
      const firstTry = !c.errs.has(selL);
      grade(selL, firstTry); game.results.push({ q: { kind: "entr", w: selL }, w: selL, ok: firstTry });
      if (firstTry) { game.combo++; game.bestCombo = Math.max(game.bestCombo, game.combo); } else game.combo = 0;
      const xp = firstTry ? 8 : 2; game.xp += xp; award(xp); persist();
      selL = null;
      if (c.done.size === round.length) { const g = game; setTimeout(() => { if (game !== g) return; game.i++; if (game.i >= game.qs.length) finishGame(); else renderGame(); }, 500); }
    } else {
      c.errs.add(selL);
      b.classList.add("wrong"); setTimeout(() => b.classList.remove("wrong"), 500);
      document.getElementById("fb").textContent = `${selL.w} = ${firstMeaning(selL.t)}. Tekrar dene.`;
    }
  }));
}

/* results */
function renderResult() {
  // the score is the first pass (the test); the repeat stage is for learning, not scoring
  const r = game.results.filter(x => x.stage !== "repeat");
  const ok = r.filter(x => x.ok && !x.unsure).length;
  const pct = r.length ? Math.round(ok / r.length * 100) : 0;
  const repeated = game.stage === "repeat" ? game.missed.length : 0;
  const unit = r.some(x => isCloze(x.q)) ? "soru" : "kelime";
  const title = game.mode === "speed" ? (game.record ? "Yeni rekor!" : "Süre doldu!") : pct >= 90 ? "Muhteşem tur!" : pct >= 70 ? "Çok iyi iş!" : pct >= 50 ? "İyi gidiyorsun" : "Her tur seni geliştiriyor";
  const sub = repeated ? `Testte kaçırdığın ${repeated} ${unit === "soru" ? "soruyu" : "kelimeyi"} tekrar ettin. Kalıcı olsun diye yakında yeniden karşına çıkacaklar.` : pct >= 70 ? "Bu tempoyla YDS soruları sana kolay gelecek." : `Yanlış yaptığın ${unit === "soru" ? "sorular" : "kelimeler"} kaydedildi; yakında tekrar karşına çıkacaklar.`;
  const uniq = []; const seen = new Set();
  for (const x of r) { const k = qKey(x.q); if (!seen.has(k)) { seen.add(k); uniq.push(x); } }
  const tagOf = x => x.ok && !x.unsure ? "ok" : x.unsure ? "un" : "no";
  const wrongs = uniq.filter(x => tagOf(x) !== "ok").map(x => x.q);
  app.innerHTML = `<section class="game"><div class="card result">
    <h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p>
    <div class="kpis"><div class="kpi"><b><span data-count="${ok}">0</span>/${r.length}</b><small>${game.mode === "speed" ? "doğru" : "testte doğru"}</small></div><div class="kpi"><b>+<span data-count="${game.xp}">0</span></b><small>XP</small></div>${repeated ? `<div class="kpi"><b>${repeated}</b><small>tekrar edildi</small></div>` : `<div class="kpi"><b>${game.bestCombo}</b><small>en uzun seri</small></div>`}</div>
    ${wrongs.length >= 2 ? trapSummaryHtml(wrongs) : ""}
    <div><span class="eyebrow">Testteki ${unit === "soru" ? "sorular" : "kelimeler"} · ✓ bildin · ? emin değildin · ✗ bilemedin</span></div>
    <div class="rlist">${uniq.map(x => itemRow(x.q, tagOf(x))).join("")}</div>
    <div class="btnrow">${wrongs.length ? `<button class="btn" type="button" id="redo">Bu ${unit === "soru" ? "soruları" : "kelimeleri"} bir daha çalış</button>` : ""}<button class="btn ${wrongs.length ? "ghost" : ""}" type="button" id="again">Yeni tur</button><button class="btn ghost" type="button" id="home">${game.mode[0] === "g" ? "Gramer sayfası" : game.mode.startsWith("ex:") || game.mode === "redoMock" ? "Sınav sayfası" : game.mode === "weak" || game.mode === "trap" ? "İlerlemem" : "Ana sayfa"}</button></div>
  </div></section>`;
  const mode = game.mode, topic = game.topic;
  app.querySelectorAll("[data-count]").forEach(el => countTo(el, +el.dataset.count, 800));
  if (r.length && (pct >= 70 || game.record)) { const big = pct >= 90 || game.record; setTimeout(() => confetti(big ? 150 : 90), 250); }
  wireRows(app);
  document.getElementById("again").addEventListener("click", () => mode === "aicloze" ? startAiCloze() : mode === "redoMock" ? setTab("exam") : mode === "weak" ? startWeakDrill() : mode === "trap" ? startTrapDrill(topic) : startGame(mode, topic));
  document.getElementById("home").addEventListener("click", () => { const back = mode[0] === "g" ? "gram" : mode.startsWith("ex:") || mode === "redoMock" ? "exam" : mode === "weak" || mode === "trap" ? "me" : null; quitGame(); if (back) setTab(back); });
  const rd = document.getElementById("redo");
  if (rd) rd.addEventListener("click", () => {
    const words = wrongs.filter(q => !isCloze(q) && q.kind !== "sdikte" && q.w).map(q => q.w);
    const qs = shuffle(wrongs.map(repeatQ)).concat(shuffle(words).map(w => mcQ(w, "type")));
    const lv = game.lv;
    if (game) clearInterval(game.timer);
    game = newGame("redo", qs);
    game.lv = lv;
    window.scrollTo({ top: 0 });
    renderGame();
  });
}

/* keyboard */
document.addEventListener("keydown", e => {
  if (document.querySelector(".scrim")) { if (e.key === "Escape") closeSheet(); return; }
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA")) return;
  if (game && game.mode === "mock" && game.phase === "mock") {
    if (/^[1-5]$/.test(e.key)) { const b = app.querySelectorAll(".opt")[+e.key - 1]; if (b) b.click(); }
    else if (e.key === "ArrowRight") { const b = document.getElementById("mNext"); if (b) b.click(); }
    else if (e.key === "ArrowLeft") { const b = document.getElementById("mPrev"); if (b && !b.disabled) b.click(); }
    return;
  }
  if (!game || game.phase !== "play" || game.mode === "match") return;
  const q = game.qs[game.i];
  if (!q) return;
  if (!isTyping(q) && !game.answered && /^[1-5]$/.test(e.key)) { const b = app.querySelectorAll(".opt")[+e.key - 1]; if (b) b.click(); }
  else if (!isTyping(q) && !game.answered && (e.key === "b" || e.key === "B") && document.getElementById("unsure")) toggleUnsure();
  else if (e.key === "Enter" && game.answered && !isTyping(q)) { e.preventDefault(); next(); }
});

/* Claude writes fresh in-context questions for the words being learned at this level */
let sampleNs; // undefined = not asked yet
async function getSample() {
  if (sampleNs !== undefined) return sampleNs;
  try {
    if (!window.claude || !window.claude.use) { sampleNs = null; return null; }
    sampleNs = await Promise.race([
      window.claude.use("sample"),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000))
    ]);
  } catch (e) { sampleNs = null; }
  return sampleNs;
}
function parseModelJson(t) {
  if (!t) return null;
  const m = String(t).match(/\{[\s\S]*\}/);
  if (!m) return null;
  try { return JSON.parse(m[0]); } catch (e) { return null; }
}
async function askJsonAI(prompt) {
  const sm = await getSample();
  if (sm) {
    try { return await sm.json(prompt, { modelTier: "quick" }); } catch (e) { if (!(S.aiKey || "").trim()) throw e; }
  }
  const key = (S.aiKey || "").trim();
  if (!key) return null;
  const asJson = txt => parseModelJson(txt);
  try {
    if (key.startsWith("sk-ant-")) {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: "claude-3-5-haiku-latest", max_tokens: 1600, messages: [{ role: "user", content: prompt + "\nReturn JSON only." }] })
      });
      const j = await res.json();
      if (!res.ok) throw new Error((j && j.error && j.error.message) || "API");
      return asJson((j.content || []).map(c => c.text || "").join("\n"));
    }
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "content-type": "application/json", Authorization: "Bearer " + key },
      body: JSON.stringify({ model: "gpt-4o-mini", temperature: 0.4, response_format: { type: "json_object" }, messages: [{ role: "user", content: prompt }] })
    });
    const j = await res.json();
    if (!res.ok) throw new Error((j && j.error && j.error.message) || "API");
    return asJson(j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content);
  } catch (e) {
    toast("Yerel API anahtarı çalışmadı (tarayıcı CORS veya ağ). Claude.ai veya çevrimdışı örnek kullanılabilir.");
    return null;
  }
}
async function startAiCloze() {

  document.getElementById("aiCancel").addEventListener("click", () => { cancelled = true; refresh(); });

Target words (CEFR ${lv === "YDS" ? "B2-C1 academic" : lv === "ALL" ? "mixed" : lv}): ${words.map(w => `${w.w} (${posTr(w.p)}: ${firstMeaning(w.t)})`).join("; ")}.
For EACH target word write one question. Return JSON only: {"items":[{"word":"<target word exactly as given>","answer":"<the form that fills the blank>","sentence":"<sentence with exactly one ___ where the answer goes>","distractors":["...","...","..."],"tr":"<natural Turkish translation of the completed sentence>"}]}
Rules: the sentence is 10-22 words, clear context so ONLY the answer fits; distractors are the same part of speech and grammatical form as the answer but clearly wrong in meaning; never use the answer or its synonyms as distractors; register like YDS reading passages for B2+ words, everyday for A1-B1.`;
  try {

    if (cancelled) return;
    if (!d) {
      const set = new Set(words.map(w => w.w.toLowerCase()));

      const w = set.get(String(x.word || "").toLowerCase());

      if (!w || typeof x.sentence !== "string" || x.sentence.split("___").length !== 2 || !x.answer || ds.length < 3) return null;
      if (ds.slice(0, 3).some(v => v.toLowerCase() === String(x.answer).toLowerCase())) return null;
      return { id: "ai" + Date.now() + n, ai: true, w, a: String(x.answer), s: x.sentence, d: ds.slice(0, 3), tr: String(x.tr || "") };

    startGame("aicloze", items);
  } catch (e) {
    if (cancelled) return;
    const set = new Set(words.map(w => w.w.toLowerCase()));
    const hit = V.filter(it => set.has(it.w.w.toLowerCase()));
    const rest = shuffle(V.filter(it => inLevel(it.w, lv) && !hit.includes(it)));
    const items = hit.concat(rest).slice(0, 8);
    if (items.length) {
      toast("Claude cümleleri alınamadı; hazır cümlelerden bir tur açıyorum.");
      return startGame("aicloze", items);

    refresh();
  }
}

// turns raw English text into HTML: blanks become gap markers, words become tappable when taps is on
function richText(raw, taps, curGap) {
  let out = "", last = 0;
  const re = /\((\d)\)___|___|[A-Za-z][A-Za-z'’]*(?:-[A-Za-z]+)*/g;
  for (const m of raw.matchAll(re)) {
    out += esc(raw.slice(last, m.index));
    if (m[1]) out += `<span class="pgap${curGap === m[1] ? " cur" : ""}">(${m[1]})</span>`;
    else if (m[0] === "___") out += '<span class="gap" aria-label="boşluk">&nbsp;</span>';
    else out += taps ? `<span class="tw">${esc(m[0])}</span>` : esc(m[0]);
    last = m.index + m[0].length;
  }
  return out + esc(raw.slice(last));
}
function exPromptHtml(it, taps = true) {
  const g = it.g;
  let ph = "";
  if (g.p) {
    const cur = g.type === "cloze" ? (it.s.match(/\((\d)\)/) || [])[1] : null;
    ph = `<div class="passage${taps ? " taps" : ""}">${g.p.split("\n").map(x => `<p>${richText(x, taps, cur)}</p>`).join("")}</div>`;
    if (taps) ph += '<p class="taphint">Bilmediğin bir kelimeye dokun: anlamını gör, tek dokunuşla listene ekle.</p>';
  }
  const stem = g.type === "cloze" ? `${it.s} numaralı boşluğa hangisi gelir?` : it.s;
  return ph + `<div class="qstem">${richText(stem, false, null)}</div>`;
}

const IRREG = { was: "be", were: "be", is: "be", are: "be", been: "be", am: "be", went: "go", gone: "go", took: "take", taken: "take", made: "make", found: "find", became: "become", began: "begin", begun: "begin", brought: "bring", built: "build", bought: "buy", caught: "catch", chose: "choose", chosen: "choose", came: "come", did: "do", done: "do", drew: "draw", drawn: "draw", fell: "fall", fallen: "fall", felt: "feel", got: "get", gave: "give", given: "give", grew: "grow", grown: "grow", had: "have", has: "have", held: "hold", kept: "keep", knew: "know", known: "know", led: "lead", left: "leave", lost: "lose", meant: "mean", met: "meet", paid: "pay", ran: "run", said: "say", saw: "see", seen: "see", sent: "send", shown: "show", sold: "sell", spent: "spend", stood: "stand", taught: "teach", thought: "think", told: "tell", understood: "understand", won: "win", wrote: "write", written: "write", rose: "rise", risen: "rise", children: "child", people: "person", men: "man", women: "woman", feet: "foot", teeth: "tooth", mice: "mouse", worse: "bad", worst: "bad", phenomena: "phenomenon", criteria: "criterion", analyses: "analysis" };
function lookupWord(raw) {
  const w = raw.toLowerCase().replace(/’/g, "'").replace(/'s$/, "");
  const tries = [w, IRREG[w]];
  const cut = n => w.slice(0, -n);
  if (w.endsWith("ies") || w.endsWith("ied")) tries.push(cut(3) + "y");
  if (w.endsWith("es")) tries.push(cut(2));
  if (w.endsWith("s")) tries.push(cut(1));
  if (w.endsWith("ed")) { tries.push(cut(2), cut(1)); if (/(.)\1ed$/.test(w)) tries.push(cut(3)); }
  if (w.endsWith("ing")) { tries.push(cut(3), cut(3) + "e"); if (/(.)\1ing$/.test(w)) tries.push(cut(4)); }
  if (w.endsWith("ily")) tries.push(cut(3) + "y");
  if (w.endsWith("ly")) tries.push(cut(2));
  if (w.endsWith("est")) tries.push(cut(3), cut(2));
  if (w.endsWith("er")) tries.push(cut(2), cut(1));
  for (const t of tries) { const hit = t && BYKEY.get(t); if (hit) return hit; }
  return null;
}

  const newToday = Object.values(S.prog).filter(p => p[6] === t).length;
  let newTarget = 10;
  if (days && days > 0) { const leftW = W.filter(w => (["B1", "B2", "C1", "YDS"].includes(w.l) || w.y) && !getP(w)).length; newTarget = Math.max(10, Math.min(40, Math.ceil(leftW / days))); }
  const hToday = S.hist.filter(h => h.d === t);
  const order = ["A1", "A2", "B1", "B2", "C1", "YDS"];
  const topics = G.slice().sort((a, b) => (a.lv === S.glevel ? -1 : 0) - (b.lv === S.glevel ? -1 : 0) || order.indexOf(a.lv) - order.indexOf(b.lv));
  const nextTopic = topics.find(tp => { const s = topicStats(tp); return s.learned < s.total; }) || G[0];
  const typeAcc = t2 => { let okc = 0, x = 0; EX.filter(g => g.type === t2).forEach(g => g.items.forEach(it => { const p = S.eq[it.id]; if (p) { okc += p[2]; x += p[3]; } })); return okc + x ? okc / (okc + x) : -1; };
  const types = Object.keys(EXTYPES).sort((a, b) => typeAcc(a) - typeAcc(b));
  const exType = types.find(x => typeAcc(x) === -1) || types[0];
  const lastMock = S.mocks.length ? S.mocks[S.mocks.length - 1].ts : 0;
  const tasks = [
    { label: dueN ? `Akıllı tekrar: ${dueN} kelime seni bekliyor` : "Akıllı tekrar: bugün tekrarı gelen kelime yok", done: dueN === 0, run: () => startGame("review") },
    { label: `Yeni kelime: ${Math.min(newToday, newTarget)}/${newTarget}`, done: newToday >= newTarget, run: () => startGame("learn") },
    { label: `Gramer: ${nextTopic.tr} (${nextTopic.lv})`, done: hToday.some(h => h.m[0] === "g"), run: () => startGame("gtopic", nextTopic.id) },
    { label: `YDS soru tipi: ${EXTYPES[exType].name}`, done: hToday.some(h => h.m.startsWith("ex:") || h.m === "mock"), run: () => startGame("ex:" + exType) }
  ];
  if (days !== null && days <= 60 && Date.now() - lastMock > 6 * 86400000) tasks.push({ label: "Bu hafta bir deneme sınavı çöz", done: false, run: startMock });
  return { days, tasks };
}

  root.addEventListener("keydown", e => {

  }
}

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") maybeNotifyDue(); });
refresh();
})();
</script>
