ning speeds up crowded criminal courts: the accused admits a lesser charge and the trial is avoided. Supporters say this saves public money. ___ A justice system that depends too heavily on bargains may punish the timid more reliably than the guilty.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"Critics reply that innocent people may plead guilty simply because they cannot risk a long hearing.","x":["Every accused person is given an unlimited budget for trial.","Courts are never crowded in large cities.","Admitting a charge always proves complete guilt.","Public money is irrelevant to criminal procedure."],"w":"Son cümle ürkek olanın cezalandırılmasını ima ediyor; boşluk masumların risk yüzünden suç kabul edebileceğini söylemeli."}]},{"id":"p15","type":"parcomp","lv":"B2","topic":"Eğitim","p":"School libraries do more than lend storybooks. They give students a quiet place to work and a librarian who can help them judge sources. ___ When those libraries close to save money, the loss is not only cultural; it is academic.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"Students without internet at home feel this support most strongly.","x":["Librarians are not allowed to speak to students.","Quiet places make it impossible to study.","Storybooks have no place in a modern school.","Closing a library always increases test scores."],"w":"Kapanmanın akademik kayıp olması, özellikle evde interneti olmayanlar için anlamlı."}]},{"id":"p16","type":"parcomp","lv":"C1","topic":"Ekonomi","p":"A minimum wage is meant to protect the lowest-paid workers. If it is set too low, it changes nothing. If it is set far above what small firms can pay, some jobs may disappear. ___ The difficult political task is to find a level that raises living standards without a sharp fall in employment.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"Empirical studies often find modest gains in pay and only small, if any, job losses when the increase is gradual.","x":["Economists agree that any minimum wage destroys all employment.","Small firms never hire anyone even without a minimum wage.","Living standards cannot be affected by wages.","Gradual increases have never been tried in any country."],"w":"Son cümle denge arıyor; boşluk kademeli artışın sınırlı etkisine dair kanıtı vermeli."}]},{"id":"p17","type":"parcomp","lv":"B2","topic":"Tarih","p":"Paper reached Europe centuries after it was used in East Asia. Cheaper than parchment, it made record-keeping and eventually printing far more practical. ___ Without that material change, the later explosion of books would have been much harder to imagine.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"Workshops could then produce documents in greater numbers at a lower cost.","x":["Parchment became cheaper than paper overnight.","Printing was invented before writing.","East Asia never used paper for records.","Books exploded in number before cheap paper existed."],"w":"\"Without that material change\" atölyelerin daha çok belge üretebilmesine atıf."}]},{"id":"p18","type":"parcomp","lv":"C1","topic":"Çevre","p":"Restoring a river is not simply a matter of planting trees on the bank. Engineers may need to reopen old bends that had been straightened for shipping. ___ Only then do fish, insects and plants return in a stable way, rather than appearing for a season and vanishing again.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"The slower, more varied flow creates the habitats those species actually use.","x":["Straight rivers always contain more fish than bent ones.","Shipping disappears as soon as any tree is planted.","Fish return before the flow of the river changes.","Insects cannot live in varied habitats."],"w":"\"Only then\" yavaş ve çeşitli akışın habitat yaratmasına bağlanır."}]},{"id":"p19","type":"parcomp","lv":"B2","topic":"Teknoloji","p":"Password reuse is one of the most common reasons accounts are stolen. When a shopping site is breached, criminals try the same email and password on email and banking services. ___ A password manager is less heroic than a film spy, but it attacks the real problem.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"Using a different, long password for each important service breaks that chain.","x":["Criminals never try passwords on more than one site.","Email services ignore all leaked passwords.","Shopping sites cannot be breached in any country.","A single short password protects every account perfectly."],"w":"Zinciri kırmak = her önemli hizmet için ayrı uzun parola."}]},{"id":"p20","type":"parcomp","lv":"C1","topic":"Psikoloji","p":"Grief does not follow a fixed timetable, despite popular lists of \"stages\". People may feel anger, numbness or unexpected relief in an order that surprises them. ___ Friends who insist that someone should \"be over it\" by a certain month often add isolation to the original loss.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"Treating those reactions as signs of failure misunderstands how mourning actually works.","x":["Everyone reaches the same stage on the same day.","Relief during grief is impossible.","Isolation never occurs after a death.","Popular lists have been proven accurate in every culture."],"w":"\"be over it\" baskısı, tepkileri başarısızlık saymanın yanlışlığıyla bağlanır."}]},{"id":"i11","type":"irrelevant","lv":"B2","topic":"","p":"(I) Olive trees can live for centuries in dry Mediterranean climates. (II) Their roots reach deep water that shallower plants cannot use. (III) This resilience has made olives a reliable crop where rainfall is uncertain. (IV) Olive oil is a common ingredient in soap. (V) Farmers still prune the trees carefully so that they keep producing fruit.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"IV","x":["I","II","III","V"],"w":"Parça zeytin ağacının kuraklığa dayanıklılığı ve tarımı; sabun (IV) kopuk."}]},{"id":"i12","type":"irrelevant","lv":"C1","topic":"","p":"(I) Peer review is meant to catch errors before a study is published. (II) Reviewers are usually unpaid specialists in the same field. (III) The system is imperfect, because reviewers may miss flaws or favour fashionable ideas. (IV) Still, papers that have not been reviewed at all are treated with more caution. (V) Many scientific journals also sell advertising space.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"V","x":["I","II","III","IV"],"w":"Konu hakemlik sistemi; dergi reklamı (V) akışı bozuyor."}]},{"id":"i13","type":"irrelevant","lv":"B2","topic":"","p":"(I) Seat belts reduce deaths in car crashes by keeping people in their seats. (II) Traffic lights were first used to manage horse-drawn carriages. (III) Modern cars also have airbags that open within milliseconds. (IV) Used together, belts and airbags lower the chance of a fatal head injury. (V) That is why most countries now require belts by law.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"II","x":["I","III","IV","V"],"w":"Parça emniyet kemeri ve hava yastığı; at arabası trafik ışığı (II) kopuk."}]},{"id":"i14","type":"irrelevant","lv":"C1","topic":"","p":"(I) Translation is never a simple substitution of words. (II) Idioms and humour often have no exact match in the target language. (III) Bilingual dictionaries are sold in many bookshops. (IV) A good translator therefore reconstructs the effect, not only the dictionary meanings. (V) This is why machine output still needs a human editor for literary texts.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"III","x":["I","II","IV","V"],"w":"Çevirinin etkisi ve makine çıktısı; kitapçıda sözlük satışı (III) kopuk."}]},{"id":"i15","type":"irrelevant","lv":"B2","topic":"","p":"(I) Beavers build dams that slow rivers and create ponds. (II) Those ponds become homes for fish, insects and birds. (III) In some valleys this activity reduces flood peaks downstream. (IV) Beaver fur was once fashionable in European hats. (V) Conservation groups therefore reintroduce beavers where they had disappeared.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"IV","x":["I","II","III","V"],"w":"Barajların ekolojik etkisi; şapka modası (IV) kopuk."}]},{"id":"i16","type":"irrelevant","lv":"C1","topic":"","p":"(I) Statistical significance is often misunderstood as proof that a finding is important. (II) A tiny effect can be \"significant\" if the sample is huge. (III) Conversely, a large effect may miss the threshold in a small study. (IV) Readers should therefore look at the size of the effect, not only at a p-value. (V) Coin tosses are a popular classroom demonstration of chance.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"V","x":["I","II","III","IV"],"w":"Anlamlılık ve etki büyüklüğü; yazı tura sınıf gösterisi (V) kopuk."}]},{"id":"i17","type":"irrelevant","lv":"B2","topic":"","p":"(I) Composting turns kitchen waste into soil that can feed gardens. (II) Coffee is grown in several tropical countries. (III) Fruit peels and coffee grounds break down if they are kept moist and aerated. (IV) Plastic packaging does not belong in a compost heap. (V) Households that compost send less organic waste to landfill.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"II","x":["I","III","IV","V"],"w":"Kompost konusu; kahvenin tropik ülkelerde yetişmesi (II) kopuk."}]},{"id":"i18","type":"irrelevant","lv":"C1","topic":"","p":"(I) Archive law determines how long public documents must be kept. (II) Too short a period and later researchers cannot check a government's claims. (III) Many novelists use historical settings in their fiction. (IV) Too long a period and sensitive personal data may remain exposed. (V) Good legislation therefore distinguishes between records that serve accountability and those that only concern private lives.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"III","x":["I","II","IV","V"],"w":"Arşiv hukuku; romanlarda tarihi mekân (III) kopuk."}]},{"id":"i19","type":"irrelevant","lv":"B2","topic":"","p":"(I) Hearing protection matters in noisy factories. (II) Repeated loud sound damages the inner ear, often without pain at first. (III) Workers who wear well-fitted ear defenders keep more of their hearing. (IV) Factory canteens sometimes serve hot meals. (V) Regular tests can catch early loss before it becomes severe.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"IV","x":["I","II","III","V"],"w":"İşitme koruması; kantin yemeği (IV) kopuk."}]},{"id":"i20","type":"irrelevant","lv":"C1","topic":"","p":"(I) Open data lets other scientists repeat an analysis with the same numbers. (II) Journals increasingly ask authors to share tables, not only conclusions. (III) Privacy rules still forbid the release of information that could identify patients. (IV) The practical task is to anonymise datasets well enough that both reuse and confidentiality are possible. (V) Spreadsheet software has many keyboard shortcuts.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"V","x":["I","II","III","IV"],"w":"Açık veri ve gizlilik; klavye kısayolu (V) kopuk."}]},{"id":"d1","type":"dialogue","lv":"B1","topic":"","p":"Ayşe: I've applied for a scholarship to study in Canada, but I haven't heard anything yet.\nMert: When did you send your application?\nAyşe: About two months ago. ___\nMert: Don't worry. These decisions usually take a long time.","qs":[{"s":"Diyaloğu tamamlayan cümle hangisidir?","a":"I'm starting to think they've rejected it.","x":["I'm so glad they accepted me immediately.","I've never wanted to study abroad.","I'll send my application next week.","Canada is a very cold country."],"w":"Mert'in \"Endişelenme\" cevabı Ayşe'nin kaygılandığını gösteriyor; reddedildiğini düşünmeye başlaması uygun."}]},{"id":"d2","type":"dialogue","lv":"B2","topic":"","p":"Doctor: Your test results show that your blood pressure is quite high.\nPatient: Is that serious? I feel perfectly fine.\nDoctor: ___\nPatient: I see. Then I'd better start exercising and cutting down on salt.","qs":[{"s":"Diyaloğu tamamlayan cümle hangisidir?","a":"High blood pressure often has no symptoms, but it increases the risk of heart disease.","x":["You don't need to change anything in your lifestyle.","Your blood pressure is lower than it should be.","Feeling fine means that the results must be wrong.","You should eat more salty food to feel better."],"w":"Hasta egzersize başlayıp tuzu azaltacağını söylüyor; doktorun riski açıklaması gerekiyor."}]},{"id":"d3","type":"dialogue","lv":"B1","topic":"","p":"Customer: Excuse me, I bought this jacket last week, but it's too small.\nAssistant: ___\nCustomer: Yes, here it is.\nAssistant: Fine. Would you like to exchange it for a larger size?","qs":[{"s":"Diyaloğu tamamlayan cümle hangisidir?","a":"Do you have the receipt with you?","x":["We don't sell jackets in this shop.","How much did you pay for your shoes?","Would you like to try a smaller size?","When are you planning to buy it?"],"w":"Müşteri \"here it is\" diyerek bir şey uzatıyor; fişi istenmesi uygun."}]},{"id":"d4","type":"dialogue","lv":"B2","topic":"","p":"Emre: Have you read the article about four-day working weeks?\nSelin: Yes. Apparently, productivity didn't fall at all in the companies that tried it.\nEmre: ___\nSelin: That's true, but surely it depends on the type of job.","qs":[{"s":"Diyaloğu tamamlayan cümle hangisidir?","a":"So maybe every company should adopt the system.","x":["I've never heard of the four-day week before.","That proves productivity always falls with shorter weeks.","Most companies work seven days a week.","I don't like reading articles about work."],"w":"Selin'in \"Doğru ama işin türüne bağlı\" cevabı Emre'nin genelleme yaptığını gösteriyor."}]},{"id":"d5","type":"dialogue","lv":"B1","topic":"","p":"Tourist: Excuse me, could you tell me how to get to the museum?\nLocal: ___\nTourist: Oh, I'd rather walk. It's a lovely day.\nLocal: Then go straight ahead and turn left at the second traffic lights.","qs":[{"s":"Diyaloğu tamamlayan cümle hangisidir?","a":"You can take bus number 12, or it's about a twenty-minute walk.","x":["The museum is closed on Mondays.","I'm sorry, I'm not from here either.","You have to take a taxi; there's no other way.","I've never been to the museum."],"w":"Turist \"yürümeyi tercih ederim\" diyor; yani seçenek sunulmuş olmalı (otobüs veya yürüyüş)."}]},{"id":"d6","type":"dialogue","lv":"B2","topic":"","p":"Manager: The client wants the report by Friday instead of next Wednesday.\nEmployee: ___\nManager: I know it's a lot to ask. I'll get two more people to help you.","qs":[{"s":"Diyaloğu tamamlayan cümle hangisidir?","a":"That gives us three fewer days. I'm not sure we can finish in time.","x":["Great, we have plenty of time then.","The client has already received the report.","I'll start working on it next month.","Wednesday is too early for me."],"w":"Müdür \"çok şey istediğimi biliyorum\" ve \"yardımcı vereceğim\" diyor; çalışan zamanın yetmeyeceğinden endişe ediyor olmalı."}]},{"id":"d7","type":"dialogue","lv":"C1","topic":"","p":"Interviewer: Some argue that tourism damages the cultures it claims to celebrate. What's your view?\nResearcher: ___\nInterviewer: So it's the way tourism is managed, rather than tourism itself, that matters.\nResearcher: Exactly.","qs":[{"s":"Diyaloğu tamamlayan cümle hangisidir?","a":"It can, but when local communities control it, tourism often helps preserve traditions.","x":["Tourism has absolutely no effect on local cultures.","I think all forms of tourism should be banned immediately.","Most tourists are not interested in culture at all.","Culture is more important than the economy."],"w":"Görüşmeci \"Önemli olan turizmin nasıl yönetildiği\" diye özetliyor; yerel yönetim vurgusu bu sonuca uygun."}]},{"id":"d8","type":"dialogue","lv":"B1","topic":"","p":"Can: Are you coming to the concert tonight?\nDeniz: ___\nCan: That's a pity. Maybe next time, then.","qs":[{"s":"Diyaloğu tamamlayan cümle hangisidir?","a":"I'd love to, but I have an exam tomorrow morning.","x":["Of course! I've already bought my ticket.","Yes, I'll meet you there at eight.","I went to a concert last week.","What time does it finish?"],"w":"Can'ın \"Yazık, belki bir dahaki sefere\" cevabı Deniz'in gelemeyeceğini gösteriyor."}]},{"id":"d9","type":"dialogue","lv":"B2","topic":"","p":"Student: I don't understand why my essay got such a low grade.\nTeacher: Your ideas were interesting, but ___\nStudent: So I should have organised my arguments more clearly?\nTeacher: Yes, and supported them with evidence.","qs":[{"s":"Diyaloğu tamamlayan ifade hangisidir?","a":"the essay lacked a clear structure and supporting examples.","x":["the essay was much too well organised.","you used too many examples from research.","you handed it in two weeks early.","your handwriting was very beautiful."],"w":"Öğrencinin \"argümanlarımı daha net düzenlemeliydim\" yorumu yapı eksikliğine işaret ediyor."}]},{"id":"d10","type":"dialogue","lv":"B2","topic":"","p":"Journalist: Your company has just launched an electric car. Why now?\nCEO: ___\nJournalist: So falling battery costs made the project possible.\nCEO: That's right.","qs":[{"s":"Diyaloğu tamamlayan cümle hangisidir?","a":"Until recently, batteries were simply too expensive to make an affordable model.","x":["We have always believed electric cars are a bad idea.","Our customers don't care about electric cars.","The government asked us to stop producing cars.","Petrol prices have fallen sharply this year."],"w":"Gazeteci \"batarya maliyetlerinin düşmesi\" diye özetliyor; CEO bataryaların yakın zamana kadar çok pahalı olduğunu söylemiş olmalı."}]},{"id":"m1","type":"restate","lv":"B2","topic":"","p":"","qs":[{"s":"Hardly had the meeting started when the fire alarm went off.","a":"The fire alarm went off just after the meeting had begun.","x":["The meeting started immediately after the fire alarm stopped.","The fire alarm went off before the meeting started.","Because of the fire alarm, the meeting could not start.","The meeting was hard to start because of the fire alarm."],"w":"\"Hardly ... when\" = -er -mez. Toplantı başlar başlamaz alarm çaldı."}]},{"id":"m2","type":"restate","lv":"B2","topic":"","p":"","qs":[{"s":"It was such a difficult exam that only a few students passed it.","a":"The exam was so difficult that very few students passed it.","x":["Although the exam was difficult, many students passed it.","Only a few students found the exam difficult.","The exam was easy enough for most students to pass.","Few students took the exam because it was difficult."],"w":"\"such a ... that\" = \"so ... that\"; çok az öğrenci geçti."}]},{"id":"m3","type":"restate","lv":"C1","topic":"","p":"","qs":[{"s":"Without the support of local volunteers, the project would never have been completed.","a":"The project was completed only because local volunteers supported it.","x":["The project was completed even though local volunteers did not support it.","Local volunteers completed the project without any support.","The project failed because local volunteers did not help.","Local volunteers will support the project until it is completed."],"w":"\"Without ... would never have\" = yardım olmasaydı bitmezdi; demek ki yardım sayesinde bitti."}]},{"id":"m4","type":"restate","lv":"B2","topic":"","p":"","qs":[{"s":"The new model is not as efficient as the old one.","a":"The old model is more efficient than the new one.","x":["The new model is as efficient as the old one.","The new model is more efficient than the old one.","Neither model is efficient.","The old model is less efficient than the new one."],"w":"\"not as ... as\" = ... kadar değil; yani eski model daha verimli."}]},{"id":"m5","type":"restate","lv":"C1","topic":"","p":"","qs":[{"s":"Scarcely any of the participants were aware of the study's real purpose.","a":"Almost none of the participants knew what the study was really about.","x":["Most of the participants understood the real purpose of the study.","The participants were told the study's purpose in advance.","Some participants were scared of the study's real purpose.","The study had no real purpose, according to the participants."],"w":"\"Scarcely any\" = neredeyse hiç; katılımcıların neredeyse hiçbiri amacı bilmiyordu."}]},{"id":"m6","type":"restate","lv":"B2","topic":"","p":"","qs":[{"s":"You needn't have brought an umbrella; the forecast says it will be sunny all day.","a":"It was unnecessary for you to bring an umbrella, as it is expected to be sunny.","x":["You should have brought an umbrella because it will rain.","You mustn't bring an umbrella when it is sunny.","You forgot to bring an umbrella although it will rain.","You will need an umbrella later in the day."],"w":"\"needn't have + V3\" = gerek yokken yapılmış iş."}]},{"id":"m7","type":"restate","lv":"C1","topic":"","p":"","qs":[{"s":"The government is thought to have underestimated the cost of the project.","a":"People believe that the government underestimated the project's cost.","x":["The government thinks the project will cost less than expected.","The government has estimated the cost of the project correctly.","The cost of the project is expected to be underestimated in the future.","The government will underestimate the cost of future projects."],"w":"\"is thought to have + V3\" = (geçmişte) ... yaptığı düşünülüyor."}]},{"id":"m8","type":"restate","lv":"B1","topic":"","p":"","qs":[{"s":"I'd rather you didn't tell anyone about this.","a":"I would prefer you to keep this to yourself.","x":["I want you to tell everyone about this.","You didn't tell anyone about this, did you?","I'd rather tell everyone myself.","You told someone about this, which I didn't like."],"w":"\"I'd rather you didn't\" = yapmamanı tercih ederim; yani kimseye söyleme."}]},{"id":"m9","type":"restate","lv":"B2","topic":"","p":"","qs":[{"s":"The longer you leave the problem, the harder it will be to solve.","a":"If you delay dealing with the problem, it will become more difficult to solve.","x":["The problem will be easier to solve if you wait.","It takes a long time to solve hard problems.","The problem is so hard that it can never be solved.","You should leave the problem until it becomes easier."],"w":"\"The longer ..., the harder ...\" = ne kadar bekletirsen o kadar zorlaşır."}]},{"id":"m10","type":"restate","lv":"C1","topic":"","p":"","qs":[{"s":"In spite of having little experience, she was appointed as the team leader.","a":"Although she had limited experience, she was made the team leader.","x":["She was appointed team leader because of her long experience.","She refused to lead the team because she lacked experience.","Having been the team leader, she gained a lot of experience.","She was not appointed because she had little experience."],"w":"\"In spite of\" = -e rağmen; az deneyime rağmen takım lideri yapıldı."}]},{"id":"p1","type":"parcomp","lv":"B2","topic":"","p":"Honeybees play a vital role in agriculture. ___ Without them, the production of many fruits, vegetables and nuts would fall dramatically. In recent years, however, bee populations have declined in many parts of the world, raising concerns about food security.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"They pollinate around one third of the crops that humans eat.","x":["Honey has been used as a medicine for thousands of years.","Some people are allergic to bee stings.","Bees live in colonies led by a single queen.","Wild bees are usually smaller than honeybees."],"w":"Sonraki cümle \"Onlar olmadan meyve ve sebze üretimi düşer\" diyor; boşluk arıların tozlaşmadaki rolünü anlatmalı."}]},{"id":"p2","type":"parcomp","lv":"B2","topic":"","p":"The first antibiotics were discovered by accident. In 1928, Alexander Fleming returned from holiday to find that mould had grown on one of his bacterial cultures. ___ This substance, later named penicillin, became the first widely used antibiotic and saved millions of lives.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"He noticed that the bacteria around the mould had been killed.","x":["Fleming was born in Scotland in 1881.","Many scientists today work in large laboratories.","The holiday had been longer than he had planned.","Bacteria are found almost everywhere on Earth."],"w":"\"This substance\" ifadesi küfün bakterileri öldüren maddesine gönderme yapıyor; boşluk bunu tanıtmalı."}]},{"id":"p3","type":"parcomp","lv":"C1","topic":"","p":"Many cities are experimenting with car-free zones in their centres. ___ Air quality improves, noise levels fall and pedestrians feel safer. Shop owners, who initially feared losing customers, have often reported an increase in sales as more people walk through the area.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"The results of these experiments have generally been positive.","x":["Cars were invented at the end of the nineteenth century.","Public transport is often crowded during rush hour.","Some people prefer to live in the countryside.","Electric cars are becoming increasingly popular."],"w":"Sonraki cümleler olumlu sonuçları sıralıyor; boşluk bu sonuçlara giriş yapmalı."}]},{"id":"p4","type":"parcomp","lv":"B2","topic":"","p":"Learning to play a musical instrument offers benefits beyond music itself. Studies have shown that children who take music lessons often perform better in mathematics and languages. ___ Furthermore, playing in a group teaches cooperation and patience.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"This may be because music training strengthens memory and attention.","x":["The piano was invented in Italy around 1700.","However, music lessons can be very expensive.","Most famous musicians started playing as adults.","Some instruments are much louder than others."],"w":"Boşluk matematik ve dil başarısının sebebini açıklamalı; \"Furthermore\" ile yeni bir fayda ekleniyor."}]},{"id":"p5","type":"parcomp","lv":"C1","topic":"","p":"For centuries, scholars believed that the Earth was at the centre of the universe. ___ His model placed the Sun at the centre, with the planets, including Earth, moving around it. Although his ideas were initially rejected, they eventually transformed astronomy.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"In the sixteenth century, however, Copernicus proposed a radically different view.","x":["The Moon is the closest celestial body to the Earth.","Many ancient cultures worshipped the Sun as a god.","Telescopes today can see galaxies billions of light years away.","Astronomy is one of the oldest sciences."],"w":"\"His model\" ifadesi bir kişiye gönderme yapıyor; boşluk bu kişiyi (Kopernik) tanıtmalı."}]},{"id":"p6","type":"parcomp","lv":"B2","topic":"","p":"Volunteering is often seen as something people do purely to help others. ___ Research shows that volunteers tend to report higher levels of happiness and lower levels of stress. Some studies even suggest that regular volunteering is linked to a longer life.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"However, it can also bring significant benefits to the volunteers themselves.","x":["Most charities rely on donations from large companies.","Volunteers usually work on weekends.","Therefore, people should never volunteer.","Many volunteers are retired teachers."],"w":"Sonraki cümleler gönüllülerin kendi kazanımlarını anlatıyor; \"However\" ile bu yeni fikre geçiş yapılmalı."}]},{"id":"p7","type":"parcomp","lv":"B2","topic":"","p":"Desert plants have developed remarkable ways of surviving with very little water. Cacti, for example, store water in their thick stems. ___ Other species have extremely long roots that reach water deep underground.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"Their spines, which are modified leaves, reduce the amount of water lost to the air.","x":["Deserts cover about one fifth of the Earth's land surface.","Many tourists visit deserts in the winter months.","Some deserts are extremely cold at night.","Camels can travel long distances without drinking."],"w":"Paragraf bitkilerin su tasarrufu yollarını sıralıyor; kaktüs dikenleri örneği akışa uyuyor."}]},{"id":"p8","type":"parcomp","lv":"C1","topic":"","p":"Inflation refers to a general rise in prices over time. When inflation is moderate, it is usually considered a sign of a healthy economy. ___ In such cases, people's savings lose value rapidly, and businesses find it difficult to plan for the future.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"When it rises too quickly, however, it can cause serious economic problems.","x":["Most central banks are located in capital cities.","Prices of some goods fall during sales periods.","Economists study the behaviour of markets.","Moderate inflation helps people save more money."],"w":"\"In such cases\" yüksek enflasyon durumuna gönderme yapıyor; boşluk enflasyonun çok hızlı yükselmesinden bahsetmeli."}]},{"id":"p9","type":"parcomp","lv":"B1","topic":"","p":"Breakfast is often called the most important meal of the day. ___ Without it, many people feel tired and find it hard to concentrate in the morning. Nutritionists recommend a breakfast that includes protein, fruit and whole grains.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"It provides the energy the body needs after a long night without food.","x":["Many people prefer to eat dinner late in the evening.","Coffee is the most popular drink in the world.","Some restaurants serve breakfast all day.","Lunch is usually eaten around midday."],"w":"\"Without it\" kahvaltıya gönderme yapıyor ve enerji eksikliğini anlatıyor; boşluk kahvaltının enerji sağladığını söylemeli."}]},{"id":"p10","type":"parcomp","lv":"B2","topic":"","p":"Earthquakes cannot be prevented, but their effects can be reduced. ___ Buildings constructed according to these standards are much more likely to remain standing during strong tremors. Public education about what to do during an earthquake can also save many lives.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"One of the most effective measures is enforcing strict building codes.","x":["Earthquakes occur along the boundaries of tectonic plates.","The largest earthquake ever recorded happened in Chile.","Some animals seem to sense earthquakes before they happen.","Many earthquakes happen under the sea."],"w":"\"these standards\" ifadesi bina yönetmeliklerine gönderme yapıyor; boşluk bunları tanıtmalı."}]},{"id":"i1","type":"irrelevant","lv":"B2","topic":"","p":"(I) Sleep is essential for both physical and mental health. (II) Coffee is one of the most widely traded products in the world. (III) During sleep, the body repairs tissues and strengthens the immune system. (IV) The brain also uses this time to process and store information from the day. (V) As a result, people who regularly sleep too little are more likely to become ill and to have problems with memory.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"II","x":["I","III","IV","V"],"w":"Parça uykunun önemini anlatıyor; kahve ticaretiyle ilgili II. cümle konudan kopuk."}]},{"id":"i2","type":"irrelevant","lv":"B2","topic":"","p":"(I) The Great Wall of China was built over many centuries to protect Chinese states from invasions. (II) Contrary to popular belief, the wall cannot be seen with the naked eye from space. (III) Chinese is spoken by more people than any other language. (IV) Most of the wall that survives today was constructed during the Ming dynasty. (V) Today, the wall is a UNESCO World Heritage Site and attracts millions of tourists every year.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"III","x":["I","II","IV","V"],"w":"Parça Çin Seddi'ni anlatıyor; Çincenin konuşan sayısı (III) konudan kopuk."}]},{"id":"i3","type":"irrelevant","lv":"C1","topic":"","p":"(I) Remote work has become common in many industries since 2020. (II) Employees often appreciate the time saved by not commuting. (III) However, some workers report feeling isolated from their colleagues. (IV) Commuting by bicycle is a healthy way to get to work. (V) Companies are therefore experimenting with hybrid models that combine office and home working.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"IV","x":["I","II","III","V"],"w":"Parça uzaktan çalışmanın artı ve eksilerini anlatıyor; bisikletle işe gitmek (IV) akışı bozuyor."}]},{"id":"i4","type":"irrelevant","lv":"B2","topic":"","p":"(I) Vitamin D is produced by the skin when it is exposed to sunlight. (II) It helps the body absorb calcium, which is necessary for strong bones. (III) People who spend little time outdoors may therefore develop a deficiency. (IV) In such cases, doctors may recommend supplements or foods such as oily fish and eggs. (V) Sunflowers turn their heads to follow the movement of the sun.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"V","x":["I","II","III","IV"],"w":"Parça D vitaminini anlatıyor; ayçiçeklerinin güneşi takip etmesi (V) konudan kopuk."}]},{"id":"i5","type":"irrelevant","lv":"C1","topic":"","p":"(I) Plastic pollution is one of the most serious environmental challenges of our time. (II) Plastic was first produced on a large scale in the 1950s. (III) Every year, millions of tonnes of plastic waste end up in the oceans. (IV) Sea turtles often mistake plastic bags for jellyfish and swallow them. (V) Many countries have introduced taxes on plastic bags to reduce their use.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"II","x":["I","III","IV","V"],"w":"Parça plastik kirliliğinin etkileri ve çözümleri üzerine; plastiğin ilk üretim tarihi (II) akışı kesiyor."}]},{"id":"i6","type":"irrelevant","lv":"B2","topic":"","p":"(I) Learning a foreign language can improve career opportunities. (II) Many international companies prefer to hire employees who can communicate with clients in several languages. (III) English has borrowed many words from French and Latin. (IV) Bilingual employees may also receive higher salaries. (V) For these reasons, an increasing number of adults are enrolling in language courses.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"III","x":["I","II","IV","V"],"w":"Parça dil öğrenmenin kariyer faydalarını anlatıyor; İngilizcenin kelime kökenleri (III) konudan kopuk."}]},{"id":"i7","type":"irrelevant","lv":"B2","topic":"","p":"(I) Volcanoes form where molten rock from deep inside the Earth reaches the surface. (II) When pressure builds up, the volcano may erupt violently, releasing ash and lava. (III) Mount Etna in Italy is one of the most active volcanoes in Europe. (IV) Italian cuisine is famous for its pasta and pizza. (V) Scientists monitor active volcanoes closely in order to warn nearby residents of possible eruptions.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"IV","x":["I","II","III","V"],"w":"Parça yanardağları anlatıyor; İtalyan mutfağı (IV) konudan kopuk."}]},{"id":"i8","type":"irrelevant","lv":"C1","topic":"","p":"(I) Childhood obesity has increased dramatically in many countries. (II) One major cause is the growing consumption of sugary drinks and processed foods. (III) Lack of physical activity, partly due to time spent on screens, also contributes to the problem. (IV) Experts warn that obese children are at greater risk of developing diabetes and heart disease later in life. (V) Many video games are now played online with people from all over the world.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"V","x":["I","II","III","IV"],"w":"Parça çocukluk obezitesinin nedenleri ve sonuçları üzerine; çevrimiçi oyunların küresel oynanması (V) akışı bozuyor."}]},{"id":"i9","type":"irrelevant","lv":"B2","topic":"","p":"(I) Bees communicate with each other in a remarkable way. (II) Honey never spoils if it is stored properly. (III) When a worker bee finds a good source of food, it returns to the hive and performs a special dance. (IV) The direction and length of the dance tell other bees where the food is located. (V) Using this information, the other bees can fly directly to the food source.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"II","x":["I","III","IV","V"],"w":"Parça arıların iletişimini anlatıyor; balın bozulmaması (II) konudan kopuk."}]},{"id":"i10","type":"irrelevant","lv":"C1","topic":"","p":"(I) The Industrial Revolution began in Britain in the late eighteenth century. (II) New machines greatly increased the speed at which goods such as textiles could be produced. (III) Britain is an island nation surrounded by the sea. (IV) Many people moved from the countryside to cities to work in factories. (V) These changes transformed not only the economy but also the structure of society.","qs":[{"s":"Parçada anlam akışını bozan cümle hangisidir?","a":"III","x":["I","II","IV","V"],"w":"Parça Sanayi Devrimi'nin etkilerini anlatıyor; Britanya'nın ada olması (III) akışı bozuyor."}]},{"id":"r1","type":"reading","lv":"B2","topic":"Sağlık","p":"For decades, sleep was regarded as a passive state in which the brain simply rested. Research over the past twenty years, however, has shown that sleep plays an active role in learning. During deep sleep, the brain appears to replay information acquired during the day, strengthening the connections between neurons that encode new memories. In one well-known experiment, students who slept after studying a list of word pairs recalled significantly more pairs the next morning than students who stayed awake for the same period. Interestingly, the benefit was greatest for information that the students had been told they would be tested on, which suggests that the sleeping brain prioritises what it considers useful. These findings have practical implications for students, who often sacrifice sleep in order to study longer. Staying up all night before an exam may increase the amount of material reviewed, but it also reduces the brain's ability to store that material in a lasting form.","qs":[{"s":"The passage mainly focuses on ___.","a":"the active contribution of sleep to the formation of memories","x":["the reasons why students tend to sleep less before exams","the differences between deep sleep and other stages of sleep","the methods that scientists use to measure brain activity","the negative effects of word-pair tests on memory"],"w":"Parçanın tamamı uykunun öğrenme ve hafıza oluşumundaki aktif rolünü anlatıyor. Diğer şıklar ya parçada geçmiyor ya da yalnızca bir ayrıntı.","k":"anafikir"},{"s":"According to the passage, students who slept after studying ___.","a":"remembered more word pairs the following morning than those who stayed awake","x":["needed less time to learn the word pairs in the first place","forgot the information they had not been told about","performed worse on tests they had not prepared for","preferred to study shorter lists of words"],"w":"Parçada açıkça \"students who slept after studying ... recalled significantly more pairs the next morning\" deniyor.","k":"ayrinti"},{"s":"It can be inferred from the passage that the sleeping brain ___.","a":"does not treat all newly learned information equally","x":["is unable to process information learned late at night","stores information more effectively when the person is anxious","erases most of the details learned during the day","works in exactly the same way as the waking brain"],"w":"Fayda en çok \"test edileceği söylenen\" bilgide görülmüş; yani uyuyan beyin yararlı gördüğü bilgiye öncelik veriyor, her bilgiye eşit davranmıyor.","k":"cikarim"},{"s":"The author's attitude towards staying up all night before an exam is ___.","a":"critical, because it weakens long-term storage of what is studied","x":["supportive, since it allows more material to be reviewed","neutral, as the evidence on the subject is not yet clear","enthusiastic, because it improves concentration","indifferent, since exam results depend mostly on intelligence"],"w":"Son cümlede yazar, sabahlamanın daha çok konu tekrarı sağlasa da bilgiyi kalıcı depolama yeteneğini azalttığını söylüyor; yani eleştirel bir tutumda.","k":"tutum"},{"s":"Which of the following is the best title for the passage?","a":"Sleep: An Active Partner in Learning","x":["Why Students Should Study All Night","The History of Word-Pair Experiments","How Neurons Are Formed in Childhood","The Hidden Dangers of Too Much Sleep"],"w":"Başlık sorusu: metnin tamamını kapsayan başlığı ara. Parça uykunun öğrenmedeki aktif rolünü anlatıyor; diğer başlıklar ya bir ayrıntıya odaklanıyor ya da metinle çelişiyor (metin sabahlamayı eleştiriyor).","k":"baslik"}]},{"id":"r2","type":"reading","lv":"B2","topic":"Çevre","p":"Microplastics are tiny plastic particles less than five millimetres in length. Some are manufactured at this size for use in cosmetics and industrial products, while most result from the gradual breakdown of larger items such as bottles, bags and synthetic clothing. Because they are so small, microplastics easily escape water treatment systems and enter rivers and oceans, where they have now been detected from the surface to the deepest trenches. Marine animals frequently mistake the particles for food. Once swallowed, microplastics can block the digestive system or create a false sense of fullness, causing animals to eat less and grow more slowly. A further concern is that the particles attract toxic chemicals from the surrounding water, which may then move up the food chain to humans. Although several countries have banned microbeads in cosmetics, scientists stress that such measures address only a small fraction of the problem, since the majority of microplastics come from the fragmentation of everyday plastic waste.","qs":[{"s":"According to the passage, most microplastics ___.","a":"are produced when larger plastic objects slowly break apart","x":["are added to cosmetics during the manufacturing process","are created in water treatment systems","originate in the deepest parts of the ocean","are released by marine animals"],"w":"\"most result from the gradual breakdown of larger items\" ifadesi çoğu mikroplastiğin büyük eşyaların parçalanmasıyla oluştuğunu söylüyor.","k":"ayrinti"},{"s":"One effect of microplastics on marine animals mentioned in the passage is that they ___.","a":"may make the animals feel full and therefore eat less","x":["increase the speed at which the animals grow","help the animals digest their food more efficiently","make the animals avoid areas with polluted water","cause the animals to move to deeper waters"],"w":"Parçada \"create a false sense of fullness, causing animals to eat less\" deniyor.","k":"ayrinti"},{"s":"The word \"fraction\" in the last sentence is closest in meaning to ___.","a":"small part","x":["main cause","total amount","final result","serious danger"],"w":"\"fraction\" burada \"küçük bir kısım\" anlamında: yasaklar sorunun yalnızca küçük bir kısmına çözüm oluyor.","k":"kelime"},{"s":"It can be concluded from the passage that banning microbeads in cosmetics ___.","a":"is helpful but far from sufficient to solve the problem","x":["has completely stopped microplastic pollution in those countries","is the most effective way of protecting marine life","has increased the amount of plastic waste in the oceans","is opposed by most of the scientific community"],"w":"Bilim insanları bu yasakların sorunun sadece küçük bir kısmını çözdüğünü vurguluyor; yani faydalı ama yetersiz.","k":"cikarim"},{"s":"Which of the following is NOT mentioned in the passage as a source of microplastics?","a":"car tyres","x":["cosmetics","plastic bottles","synthetic clothing","plastic bags"],"w":"\"Hangisi değildir\" sorusunda her şıkkı metinde tek tek ara. Kozmetik, şişe, poşet ve sentetik giysi geçiyor; araç lastiği hiç geçmiyor.","k":"degil"}]},{"id":"r3","type":"reading","lv":"C1","topic":"Sosyal bilimler","p":"The term \"urban heat island\" describes the phenomenon whereby cities are noticeably warmer than the rural areas surrounding them. The difference is most pronounced at night, when concrete, asphalt and brick release the heat they have absorbed during the day. The scarcity of vegetation compounds the problem, as plants cool their environment by releasing water vapour, a process that is largely absent in densely built areas. Waste heat from vehicles, air conditioners and industry adds further to urban temperatures. The consequences are not merely a matter of discomfort. During heatwaves, mortality rates in cities rise sharply, particularly among the elderly and those with chronic illnesses. Higher temperatures also increase demand for air conditioning, which in turn consumes more energy and releases more heat, creating a vicious circle. Urban planners have responded with a range of strategies, including planting trees along streets, creating green roofs and using reflective materials for pavements, all of which have been shown to lower local temperatures by several degrees.","qs":[{"s":"According to the passage, the temperature difference between cities and rural areas is greatest ___.","a":"at night, when built surfaces release stored heat","x":["in the early morning, before traffic begins","in winter, when heating systems are used","at midday, when the sun is strongest","during rainy periods, when humidity is high"],"w":"\"The difference is most pronounced at night\" cümlesi cevabı doğrudan veriyor.","k":"ayrinti"},{"s":"The author mentions air conditioning as an example of ___.","a":"a response to heat that ultimately makes the problem worse","x":["a technology that has solved the heat island problem","a method used by planners to cool city streets","a cause of illness among elderly people","a cheap alternative to planting trees"],"w":"Klima kullanımı daha çok enerji harcayıp daha çok ısı yayarak \"kısır döngü\" (vicious circle) yaratıyor.","k":"amac"},{"s":"The phrase \"compounds the problem\" is closest in meaning to ___.","a":"makes the problem worse","x":["solves the problem","explains the problem","hides the problem","divides the problem"],"w":"\"compound\" burada \"kötüleştirmek, şiddetlendirmek\" anlamında; bitki azlığı sorunu büyütüyor.","k":"kelime"},{"s":"Which of the following is NOT mentioned as a strategy to reduce urban heat?","a":"Limiting the number of vehicles in city centres","x":["Planting trees along streets","Building green roofs","Using reflective materials for pavements","Increasing the amount of greenery in built-up areas"],"w":"Ağaç dikmek, yeşil çatılar ve yansıtıcı malzemeler sayılıyor; araç sayısını sınırlamak strateji olarak geçmiyor.","k":"degil"},{"s":"Which of the following is the best title for the passage?","a":"Why Cities Run Hot and What Can Be Done","x":["The Benefits of Air Conditioning","Rural Life During Summer Heatwaves","How Concrete and Asphalt Are Produced","Caring for the Elderly in Winter"],"w":"Metin hem nedenleri (beton, bitki azlığı, atık ısı) hem çözümleri (ağaç, yeşil çatı) anlatıyor; başlık ikisini de kapsamalı.","k":"baslik"}]},{"id":"r4","type":"reading","lv":"B2","topic":"Eğitim","p":"For much of the twentieth century, many parents and educators believed that learning two languages in early childhood would confuse children and delay their development. Recent research has largely overturned this view. Studies indicate that bilingual children may initially have smaller vocabularies in each individual language, but their total vocabulary across both languages is usually similar to that of monolingual children. Moreover, bilingualism appears to bring certain cognitive advantages. Because bilingual speakers must constantly select one language while suppressing the other, they seem to develop stronger skills in attention control and task switching. Some researchers have even suggested that lifelong bilingualism may delay the onset of dementia symptoms by several years, although this claim remains controversial and requires further investigation. What is clear is that the fear of confusing children is not supported by evidence, and families should feel free to maintain their heritage language at home.","qs":[{"s":"The passage is mainly concerned with ___.","a":"how research has changed views about raising bilingual children","x":["the best methods of teaching a foreign language at school","the reasons why some children learn languages faster than others","the causes of dementia in elderly bilingual speakers","the difficulties immigrant families face in a new country"],"w":"Parça, iki dilli çocuk yetiştirme hakkındaki eski görüşün araştırmalarla nasıl değiştiğini anlatıyor.","k":"anafikir"},{"s":"According to the passage, bilingual children ___.","a":"may know fewer words in each language but a similar total number of words","x":["always have larger vocabularies than monolingual children","usually start speaking later than monolingual children","are more likely to confuse grammatical rules","prefer to use only one of their languages at home"],"w":"\"smaller vocabularies in each individual language, but their total vocabulary ... is usually similar\" ifadesi bunu söylüyor.","k":"ayrinti"},{"s":"The author considers the claim about dementia to be ___.","a":"interesting but not yet firmly established","x":["completely proven by recent studies","clearly false and misleading","the most important finding about bilingualism","irrelevant to the discussion of children"],"w":"Yazar bu iddianın \"hâlâ tartışmalı ve daha fazla araştırma gerektirdiğini\" söylüyor; yani henüz kesinleşmemiş.","k":"ayrinti"},{"s":"The author would most likely advise families to ___.","a":"continue speaking their heritage language with their children","x":["wait until children start school before teaching a second language","speak only the language of the country they live in","avoid mixing two languages in the same conversation","consult a doctor before raising children bilingually"],"w":"Son cümle: \"families should feel free to maintain their heritage language at home.\"","k":"cikarim"},{"s":"The author mentions attention control and task switching in order to ___.","a":"give examples of cognitive advantages linked to bilingualism","x":["show that bilingual children learn more slowly","prove that bilingualism prevents dementia","explain why parents once feared bilingual education","describe how vocabulary size is measured"],"w":"Amaç sorusu: \"Bu ayrıntı neden verilmiş?\" Bu beceriler, hemen önceki \"bilişsel avantajlar\" cümlesinin örnekleri. Demans iddiası ise metinde kanıtlanmış değil, tartışmalı.","k":"amac"}]},{"id":"r5","type":"reading","lv":"C1","topic":"Sağlık","p":"Antibiotics, first introduced on a large scale in the 1940s, transformed medicine by making once-deadly bacterial infections easily treatable. Yet their success has contained the seeds of a serious problem. Whenever antibiotics are used, bacteria that happen to carry genetic mutations allowing them to survive the drug are left behind and multiply. Over time, these resistant strains can come to dominate a population. The misuse of antibiotics has greatly accelerated this process. Patients often demand antibiotics for viral infections such as colds, against which the drugs are useless, and many stop taking their medication as soon as they feel better, allowing the hardiest bacteria to survive. In agriculture, antibiotics are routinely given to healthy animals to promote growth. The World Health Organization now ranks antimicrobial resistance among the greatest threats to global health, warning that routine surgery and cancer treatment could become far riskier if effective antibiotics are no longer available.","qs":[{"s":"According to the passage, antibiotic resistance develops because ___.","a":"bacteria that survive the drug reproduce and spread","x":["antibiotics change the genetic structure of viruses","modern antibiotics are weaker than earlier ones","patients take larger doses than necessary","bacteria learn to avoid the parts of the body where drugs are present"],"w":"İlaca dayanıklı mutasyona sahip bakteriler hayatta kalıp çoğalıyor ve zamanla popülasyona hakim oluyor.","k":"ayrinti"},{"s":"Which of the following is given as an example of antibiotic misuse?","a":"Stopping treatment early once symptoms disappear","x":["Using antibiotics to treat bacterial infections","Developing new antibiotics in laboratories","Giving antibiotics only to sick animals","Following a doctor's instructions carefully"],"w":"\"many stop taking their medication as soon as they feel better\" kötüye kullanım örneği olarak veriliyor.","k":"ayrinti"},{"s":"The phrase \"contained the seeds of a serious problem\" suggests that ___.","a":"the success of antibiotics itself led to a later difficulty","x":["antibiotics were dangerous from the very beginning","scientists predicted the problem in the 1940s","agriculture was the original source of antibiotics","the problem has now been completely solved"],"w":"Bu ifade, antibiyotiklerin başarısının içinde ileride büyüyecek bir sorunun tohumunu taşıdığı anlamına geliyor.","k":"kelime"},{"s":"It can be inferred that, without effective antibiotics, ___.","a":"medical procedures that are now routine would carry greater risks","x":["cancer would become easier to treat","viral infections would disappear","farm animals would grow faster","the World Health Organization would stop its research"],"w":"Son cümlede rutin ameliyatların ve kanser tedavisinin çok daha riskli hale gelebileceği belirtiliyor.","k":"cikarim"},{"s":"Which of the following is the best title for the passage?","a":"How Success Bred Resistance: The Antibiotic Problem","x":["The Discovery of Antibiotics in the 1940s","Antibiotics as a Cure for Viral Colds","New Techniques in Cancer Surgery","Raising Healthy Animals Without Medicine"],"w":"Metin antibiyotiklerin başarısının ve yanlış kullanımının direnç sorununu nasıl doğurduğunu anlatıyor. 1940'lar sadece giriş ayrıntısı; soğuk algınlığı tedavisi ise metinle çelişiyor.","k":"baslik"}]},{"id":"r6","type":"reading","lv":"B1","topic":"Tarih","p":"The Silk Road was not a single road but a vast network of trade routes that connected China with the Mediterranean world for more than fifteen centuries. Although it took its name from the Chinese silk that was highly valued in Rome, many other goods travelled along these routes, including spices, glass, paper and precious metals. Few merchants travelled the entire distance. Instead, goods usually passed through the hands of many traders, each covering a section of the journey before selling to the next. Cities such as Samarkand and Bukhara grew rich by providing markets, water and shelter for passing caravans. Perhaps even more important than the goods themselves were the ideas that spread along the routes. Religions, scientific knowledge and technologies such as papermaking moved from one civilisation to another, shaping cultures across Asia and Europe.","qs":[{"s":"According to the passage, the Silk Road was ___.","a":"a large network of routes rather than one single road","x":["a road built by the Roman Empire","used only for transporting silk","a route that existed for about one hundred years","controlled by a single group of merchants"],"w":"İlk cümle: \"not a single road but a vast network of trade routes\".","k":"ayrinti"},{"s":"Most merchants on the Silk Road ___.","a":"travelled only part of the route and then sold their goods to others","x":["travelled the whole distance between China and Rome","lived permanently in Samarkand and Bukhara","traded only in spices and glass","avoided cities and stayed in the desert"],"w":"\"Few merchants travelled the entire distance ... each covering a section of the journey\" deniyor.","k":"ayrinti"},{"s":"Cities such as Samarkand and Bukhara became wealthy because they ___.","a":"offered services and markets to the caravans","x":["produced most of the silk sold in Rome","were the capitals of large empires","prevented foreign traders from entering","invented the technique of papermaking"],"w":"Bu şehirler kervanlara pazar, su ve barınak sağlayarak zenginleşti.","k":"ayrinti"},{"s":"The author suggests that the most significant result of the Silk Road was ___.","a":"the exchange of ideas and knowledge between civilisations","x":["the high price of silk in Rome","the growth of the Chinese army","the discovery of new precious metals","the decline of trade by sea"],"w":"\"Perhaps even more important than the goods themselves were the ideas\" cümlesi yazarın vurgusunu gösteriyor.","k":"cikarim"},{"s":"Which of the following is NOT mentioned as something that travelled along the Silk Road?","a":"gunpowder","x":["glass","spices","religious ideas","precious metals"],"w":"Metinde baharat, cam, kâğıt, değerli metaller, dinler ve bilimsel bilgi geçiyor; barut hiç geçmiyor. Genel kültürle değil, sadece metinle cevap ver.","k":"degil"}]},{"id":"r7","type":"reading","lv":"C1","topic":"Psikoloji","p":"The placebo effect refers to the improvement in a patient's condition that occurs after receiving a treatment with no active ingredient, such as a sugar pill. For a long time, it was viewed mainly as a nuisance that complicated clinical trials, since researchers had to show that a new drug performed better than a placebo. Today, scientists increasingly study the effect in its own right. Brain imaging studies have shown that expecting pain relief can trigger the release of the body's natural painkillers, indicating that the effect has a measurable biological basis. The size of the effect depends on surprisingly subtle factors: injections tend to produce stronger placebo responses than pills, and expensive-looking pills often work better than cheap ones. Perhaps most surprisingly, some studies report that placebos can help even when patients are told that the pills contain no medicine. Such findings raise difficult ethical questions about whether, and how, doctors might use placebos deliberately.","qs":[{"s":"In the past, the placebo effect was mainly regarded as ___.","a":"an obstacle that made clinical trials more complicated","x":["the most effective form of pain relief","a proven method of treating serious diseases","a purely biological process in the brain","an ethical way to reduce the cost of medicine"],"w":"\"it was viewed mainly as a nuisance that complicated clinical trials\" ifadesi bunu anlatıyor.","k":"anafikir"},{"s":"The brain imaging studies mentioned in the passage show that ___.","a":"the placebo effect involves real physical changes in the body","x":["placebos work only for patients with mild pain","sugar pills contain small amounts of painkillers","patients cannot tell the difference between drugs and placebos","expectations have no influence on the experience of pain"],"w":"Beklentinin doğal ağrı kesicilerin salınımını tetiklemesi, etkinin ölçülebilir biyolojik bir temeli olduğunu gösteriyor.","k":"ayrinti"},{"s":"According to the passage, which of the following tends to produce a stronger placebo response?","a":"An injection rather than a pill","x":["A cheap pill rather than an expensive one","A pill taken without water","A treatment given by a nurse rather than a doctor","A smaller pill rather than a larger one"],"w":"\"injections tend to produce stronger placebo responses than pills\" deniyor.","k":"ayrinti"},{"s":"The findings described at the end of the passage ___.","a":"make the deliberate use of placebos by doctors a complex moral issue","x":["prove that placebos should replace real medicine","show that patients must never be told the truth","have been rejected by most scientists","demonstrate that the placebo effect does not exist"],"w":"Son cümle bu bulguların doktorların plaseboyu bilerek kullanması konusunda zor etik sorular doğurduğunu söylüyor.","k":"ayrinti"},{"s":"The author's attitude towards the placebo effect can best be described as ___.","a":"interested in its scientific study while aware of the ethical questions it raises","x":["dismissive, regarding it as nothing more than a trick","enthusiastic, recommending that doctors use it widely","hostile, claiming that it harms patients","indifferent, since it has no biological basis"],"w":"Tutum sorusu: yazarın kelime seçimlerine bak. Etkiyi \"ölçülebilir biyolojik temeli olan\" ve \"başlı başına incelenen\" bir konu olarak anlatıyor; sonunda da etik soruları vurguluyor. Ne küçümsüyor ne de yaygın kullanım öneriyor.","k":"tutum"}]},{"id":"r8","type":"reading","lv":"B2","topic":"Çevre","p":"Coral reefs cover less than one percent of the ocean floor, yet they support around a quarter of all marine species. Reefs are built by tiny animals called coral polyps, which live in partnership with microscopic algae. The algae live inside the coral's tissues and supply it with food through photosynthesis, as well as giving the reef its bright colours. When the water becomes too warm, however, this partnership breaks down. Stressed corals expel the algae and turn white, a process known as bleaching. Bleached corals are not dead, and they can recover if temperatures return to normal fairly quickly. If the heat persists, though, the corals starve and eventually die. As ocean temperatures have risen, mass bleaching events, which were once rare, have become increasingly frequent, leaving reefs less time to recover between them.","qs":[{"s":"According to the passage, coral reefs are important because they ___.","a":"provide a home for a large proportion of marine species","x":["cover most of the ocean floor","produce most of the oxygen in the ocean","protect coastlines from rising temperatures","are the main source of food for humans"],"w":"Okyanus tabanının %1'inden azını kaplamalarına rağmen deniz türlerinin yaklaşık dörtte birine ev sahipliği yapıyorlar.","k":"ayrinti"},{"s":"The algae living inside corals ___.","a":"supply the corals with food and give them colour","x":["build the hard structure of the reef","protect the corals from warm water","compete with the corals for food","cause the corals to turn white"],"w":"Algler fotosentez yoluyla mercana besin sağlıyor ve resife parlak rengini veriyor.","k":"ayrinti"},{"s":"According to the passage, bleached corals ___.","a":"can survive if the water cools down again soon enough","x":["are always already dead","become more resistant to heat","produce more algae than before","recover more quickly when bleaching is frequent"],"w":"\"Bleached corals are not dead, and they can recover if temperatures return to normal fairly quickly.\"","k":"ayrinti"},{"s":"The main concern expressed in the last sentence is that ___.","a":"frequent bleaching gives reefs insufficient time to recover","x":["bleaching events are now extremely rare","ocean temperatures are expected to fall","scientists cannot explain why bleaching happens","corals are moving to colder waters"],"w":"Toplu ağarma olaylarının sıklaşması, resiflerin iki olay arasında toparlanmasına daha az zaman bırakıyor.","k":"ayrinti"},{"s":"Which of the following is the best title for the passage?","a":"Warming Seas and the Bleaching of Coral Reefs","x":["How to Grow Algae at Home","The Colours of Tropical Fish","A Diver's Guide to Coral Reefs","Photosynthesis in Desert Plants"],"w":"Metnin odağı ısınan suların mercan ağarmasına yol açması; başlık bunu yansıtmalı.","k":"baslik"}]},{"id":"r9","type":"reading","lv":"C1","topic":"Ekonomi","p":"The so-called gig economy, in which workers take on short-term tasks through digital platforms rather than holding permanent jobs, has expanded rapidly over the past decade. Supporters argue that it offers flexibility, allowing people to choose when and how much they work, and that it provides valuable income for students, carers and those seeking a second job. Critics, on the other hand, point out that gig workers are usually classified as independent contractors rather than employees. As a result, they typically lack sick pay, paid holidays and pension contributions, and their income can fluctuate unpredictably from week to week. Several court cases in Europe have challenged this classification, with some judges ruling that platforms exercise enough control over workers to be considered employers. The outcome of these disputes is likely to shape the future of work far beyond the gig economy itself, as more traditional companies adopt similar flexible arrangements.","qs":[{"s":"The passage mainly discusses ___.","a":"the benefits and drawbacks of platform-based short-term work","x":["the history of digital technology in Europe","why students prefer permanent jobs","how to start a successful online platform","the decline of traditional companies"],"w":"Parça gig ekonomisinin hem savunucularının hem eleştirmenlerinin görüşlerini sunuyor.","k":"anafikir"},{"s":"According to critics, gig workers are disadvantaged mainly because they ___.","a":"do not receive the benefits that employees normally have","x":["are forced to work longer hours than employees","earn less than students and carers","are not allowed to choose their working hours","must pay high fees to the platforms"],"w":"Bağımsız yüklenici sayıldıkları için hastalık izni, ücretli tatil ve emeklilik katkısından yoksun kalıyorlar.","k":"anafikir"},{"s":"The court cases mentioned in the passage concern ___.","a":"whether platforms should be treated as the employers of their workers","x":["the amount of tax that platforms should pay","the right of students to work part-time","the safety of digital payment systems","competition between European and American companies"],"w":"Davalar, platformların çalışanlar üzerinde işveren sayılacak kadar kontrol uygulayıp uygulamadığıyla ilgili.","k":"ayrinti"},{"s":"The author suggests that the results of these disputes ___.","a":"may affect working conditions in other sectors as well","x":["will be irrelevant to traditional companies","have already ended the gig economy","will only influence students and carers","are of interest mainly to lawyers"],"w":"Son cümle, sonuçların gig ekonomisinin çok ötesinde iş dünyasını şekillendireceğini söylüyor.","k":"cikarim"},{"s":"The tone of the passage is mainly ___.","a":"balanced, presenting the views of both supporters and critics","x":["strongly supportive of gig platforms","openly hostile to digital technology","humorous and informal","doubtful about whether the gig economy exists at all"],"w":"Metin önce savunucuların (\"Supporters argue\"), sonra eleştirmenlerin (\"Critics ... point out\") görüşünü veriyor; yazar taraf tutmuyor.","k":"tutum"}]},{"id":"r10","type":"reading","lv":"B2","topic":"Arkeoloji","p":"Göbekli Tepe, an archaeological site in south-eastern Turkey, has forced researchers to reconsider the origins of civilisation. Excavations that began in the 1990s revealed massive stone pillars arranged in circles, many decorated with carvings of foxes, snakes and birds. Dating methods indicate that the oldest structures were built around 11,500 years ago, which makes them thousands of years older than Stonehenge and the Egyptian pyramids. What makes the site particularly remarkable is that it was constructed by hunter-gatherers, before the development of farming, pottery or writing. Traditionally, archaeologists assumed that people first settled down to farm and only later built monumental temples. Göbekli Tepe suggests that the order may have been reversed: the need to gather large groups for ritual purposes might have encouraged people to settle and, eventually, to cultivate crops to feed them.","qs":[{"s":"According to the passage, Göbekli Tepe is important mainly because it ___.","a":"challenges traditional ideas about how civilisation began","x":["is the largest site ever excavated in Turkey","contains the oldest examples of writing","was built by farmers who lived near Stonehenge","proves that pottery was invented before farming"],"w":"İlk cümle sitenin araştırmacıları uygarlığın kökenlerini yeniden düşünmeye zorladığını söylüyor.","k":"anafikir"},{"s":"The people who built the oldest structures at Göbekli Tepe ___.","a":"had not yet started farming","x":["were skilled at writing","were Egyptian builders","used pottery for religious rituals","lived in large cities"],"w":"\"it was constructed by hunter-gatherers, before the development of farming, pottery or writing.\"","k":"ayrinti"},{"s":"The traditional view mentioned in the passage holds that ___.","a":"farming came first and monumental temples were built later","x":["temples were built before people settled down","hunter-gatherers built most ancient monuments","writing was necessary for building temples","Stonehenge is older than Göbekli Tepe"],"w":"Geleneksel görüş: insanlar önce tarım için yerleşti, anıtsal tapınakları sonra inşa etti.","k":"ayrinti"},{"s":"The word \"reversed\" in the last sentence is closest in meaning to ___.","a":"turned the other way round","x":["completely forgotten","clearly proven","slowly repeated","carefully hidden"],"w":"\"reversed\" = tersine çevrilmiş; Göbekli Tepe sıranın tersine olabileceğini düşündürüyor.","k":"kelime"},{"s":"The author mentions Stonehenge and the Egyptian pyramids in order to ___.","a":"emphasise how old the structures at Göbekli Tepe are","x":["show that they were built by the same people","argue that they are more important than Göbekli Tepe","explain how stone pillars were carved","describe the decoration of ancient temples"],"w":"Bu yapılar karşılaştırma için anılıyor: Göbekli Tepe onlardan binlerce yıl daha eski.","k":"amac"}]},{"id":"r11","type":"reading","lv":"B2","topic":"Sağlık","p":"Vaccination does not only protect the person who receives the injection. When a large enough share of a population is immune, a virus finds it hard to move from one host to another, a phenomenon known as herd immunity. This is especially important for people who cannot be vaccinated, such as infants or patients with weakened immune systems. Public-health campaigns therefore aim at high coverage rather than at individual protection alone. Critics sometimes argue that rare side effects make vaccines too risky, but large studies consistently show that the diseases themselves cause far more harm than the vaccines designed to prevent them. The historical disappearance of smallpox and the sharp decline of polio are among the clearest illustrations of this point.","qs":[{"s":"The passage is mainly concerned with ___.","a":"how widespread vaccination can protect even those who are not vaccinated","x":["the chemical composition of modern vaccines","why infants should never receive any injection","the economic cost of public-health campaigns","how smallpox was first identified in laboratories"],"w":"Parça sürü bağışıklığını ve yüksek kapsamanın bireysel korumadan öte anlamını anlatıyor.","k":"anafikir"},{"s":"According to the passage, herd immunity is valuable because ___.","a":"it helps people who cannot be vaccinated stay safer","x":["it makes side effects of vaccines completely disappear","it allows viruses to spread more slowly among the vaccinated only","it replaces the need for any further medical research","it proves that all diseases will eventually vanish"],"w":"Sürü bağışıklığının özellikle aşılanamayanlar için önemli olduğu açıkça belirtiliyor.","k":"ayrinti"},{"s":"It can be inferred that the author regards vaccine side effects as ___.","a":"real but much less dangerous than the diseases vaccines prevent","x":["the main reason vaccination programmes should be stopped","a problem that large studies have been unable to measure","more harmful than smallpox and polio combined","irrelevant because they never occur"],"w":"Yan etkiler nadir kabul ediliyor ve hastalıkların zararıyla karşılaştırılıyor; yani ciddiye alınıyor ama abartılmıyor.","k":"cikarim"},{"s":"The word \"coverage\" in the passage is closest in meaning to ___.","a":"the proportion of people who have been vaccinated","x":["the price of a single dose","the length of a hospital stay","the number of laboratories in a country","the speed at which a virus mutates"],"w":"\"high coverage\" aşılama oranının yüksekliği anlamında kullanılıyor.","k":"kelime"},{"s":"It CANNOT be inferred from the passage that ___.","a":"vaccines have no side effects at all","x":["infants can benefit when other people are vaccinated","high vaccination coverage makes it harder for a virus to spread","smallpox no longer spreads among people as it once did","the author considers vaccines worth their small risks"],"w":"\"Çıkarılamaz\" sorusunda metinle çelişeni ya da metinde dayanağı olmayanı ara. Metin nadir yan etkilerin varlığını kabul ediyor; \"hiç yan etkisi yok\" çıkarılamaz.","k":"degil"}]},{"id":"r12","type":"reading","lv":"C1","topic":"Sosyal bilimler","p":"Rapid urbanisation has transformed the social geography of many countries. Millions of people have left rural areas in search of work, education and health services, concentrating economic activity in a handful of large cities. While this shift can raise average incomes, it also produces overcrowded housing, strained transport systems and sharp inequalities between neighbourhoods. Sociologists note that newcomers often rely on informal networks of relatives rather than on official institutions, which may delay their access to legal employment. At the same time, cities remain engines of innovation because they bring together people with different skills. Policy makers therefore face a double task: they must keep cities attractive as centres of opportunity without ignoring the villages that lose their working-age population.","qs":[{"s":"What is the main idea of the passage?","a":"Urban growth creates both economic opportunities and serious social costs","x":["Rural life has become more attractive than city life in recent decades","Informal networks have replaced all official institutions in large cities","Transport systems are the only problem caused by urbanisation","Innovation in cities depends entirely on government laboratories"],"w":"Parça kentleşmenin hem gelir/inovasyon hem de konut, eşitsizlik ve kırın boşalması gibi maliyetlerini birlikte ele alıyor.","k":"anafikir"},{"s":"According to the passage, newcomers to cities often ___.","a":"turn first to family networks instead of official channels","x":["immediately obtain legal employment through the state","refuse to live in overcrowded housing","return to villages as soon as they find work","avoid education and health services"],"w":"Yeni gelenlerin resmi kurumlar yerine akraba ağlarına yaslandığı belirtiliyor.","k":"ayrinti"},{"s":"The author suggests that policy makers should ___.","a":"support cities as places of opportunity while also attending to depopulated rural areas","x":["discourage all further movement from villages to cities","abolish informal networks of relatives","concentrate every public service in a single capital","ignore housing shortages until incomes rise"],"w":"Son cümle çifte görevi açıkça söylüyor.","k":"cikarim"},{"s":"The phrase \"strained transport systems\" refers to systems that are ___.","a":"under too much pressure to work well","x":["newly built and still unused","cheaper than rural roads","reserved for tourists only","independent of population growth"],"w":"\"strained\" = aşırı yük altında, zorlanan.","k":"kelime"},{"s":"Which of the following is the best title for the passage?","a":"Cities of Opportunity and Strain","x":["The Decline of Large Cities","Modern Farming Techniques in Rural Areas","Why Migrants Avoid Their Relatives","Building Better Roads in Villages"],"w":"Metin kentleşmenin hem fırsatlarını (gelir, yenilik) hem sıkıntılarını (kalabalık, eşitsizlik) anlatıyor. \"Akrabalardan kaçınma\" ise metinle çelişiyor.","k":"baslik"}]},{"id":"r13","type":"reading","lv":"B2","topic":"Fen","p":"Nitrogen is essential for life because it is a building block of proteins and DNA. Although about 78 percent of the atmosphere consists of nitrogen gas, most living things cannot use this form directly. Certain bacteria convert atmospheric nitrogen into compounds that plants can absorb, a process called nitrogen fixation. Other bacteria later return nitrogen to the air, completing the cycle. Human activity has greatly altered this balance. The industrial production of fertilisers now fixes more nitrogen than all natural processes combined, which has increased crop yields but also polluted rivers and coastal waters. Scientists therefore argue that feeding a growing population will require more efficient use of fertilisers, not simply larger quantities.","qs":[{"s":"The passage primarily discusses ___.","a":"how nitrogen moves through nature and how humans have changed that movement","x":["why DNA contains more oxygen than nitrogen","the reasons plants cannot grow without sunlight","how bacteria cause infectious diseases in crops","the history of the first chemical factories"],"w":"Azot döngüsü ve gübre üretiminin bu dengeyi değiştirmesi ana konu.","k":"anafikir"},{"s":"Most living things cannot use atmospheric nitrogen directly because ___.","a":"they need it in a different chemical form, which some bacteria produce","x":["the atmosphere contains almost no nitrogen","nitrogen is poisonous in every form","plants refuse to absorb any compound that contains nitrogen","DNA cannot include nitrogen atoms"],"w":"Bakterilerin azotu bitkilerin alabileceği bileşiklere çevirdiği belirtiliyor.","k":"ayrinti"},{"s":"An inference that can be drawn from the passage is that ___.","a":"producing more fertiliser without changing how it is used may worsen pollution","x":["natural nitrogen fixation has already stopped","coastal waters are unaffected by farming","crop yields will fall if any fertiliser is used","bacteria are no longer part of the nitrogen cycle"],"w":"Bilim insanları daha fazla miktar değil daha verimli kullanım istiyor; aksi halde kirlilik artabilir.","k":"cikarim"},{"s":"The word \"yields\" in the passage is closest in meaning to ___.","a":"the amounts harvested from crops","x":["the prices paid to farmers","the number of bacterial species","the depth of coastal waters","the speed of industrial machines"],"w":"\"crop yields\" = ürün verimi.","k":"kelime"},{"s":"The author mentions bacteria mainly in order to ___.","a":"explain how nitrogen moves between the air and living things","x":["warn about diseases caused by bacteria","argue that fertilisers are unnecessary","describe how DNA is copied","show that plants can use nitrogen gas directly"],"w":"Bakteriler azot döngüsünü (havadan bitkilere, sonra yeniden havaya) açıklamak için anılıyor.","k":"amac"}]},{"id":"r14","type":"reading","lv":"C1","topic":"Hukuk","p":"Legal systems are often divided into common-law and civil-law traditions. In common-law countries, judges play a central role: their written decisions become precedents that later courts are expected to follow. In civil-law systems, by contrast, detailed codes passed by legislatures are the main source of rules, and judicial opinions carry less formal weight. Neither model exists in a pure form. Common-law judges still interpret statutes, and civil-law courts publish reasoned judgments that influence later cases. Comparative lawyers argue that the practical difference today lies less in abstract theory than in legal education and procedure: how lawyers are trained to find the law, and how much time a trial gives to oral argument. Understanding these habits matters for international contracts, where parties from different traditions may assume quite different things about what a \"binding rule\" looks like.","qs":[{"s":"The passage mainly argues that ___.","a":"common-law and civil-law systems differ in method, yet both have become mixed in practice","x":["civil-law codes have completely replaced judicial decisions everywhere","common-law judges are not allowed to read statutes","international contracts should avoid any written rules","legal education is identical in every country"],"w":"İki geleneğin farkı anlatılıyor, ardından hiçbirinin saf olmadığı ve asıl farkın eğitim/usul olduğu belirtil
