<script id="gram" type="application/json">[{"id":"be","lv":"A1","en":"The verb \"to be\"","tr":"\"to be\" fiili (am / is / are)","p":["\"Be\" fiili Türkçedeki \"-im, -sin, -dir\" eklerinin karşılığıdır. Özneye göre değişir: I → am, he/she/it → is, you/we/they → are.","Olumsuz yapmak için arkasına \"not\" gelir (isn't, aren't). Soru yaparken fiil özneden önceye geçer: Are you tired?"],"f":["I am · he/she/it is · you/we/they are","Olumsuz: I am not · he isn't · they aren't · Soru: Is she ...? / Are they ...?"],"e":[["She is a doctor.","O bir doktor."],["We aren't at home.","Evde değiliz."],["Are you ready?","Hazır mısın?"]],"q":[["My parents ___ teachers.","are",["is","am","be"],"\"My parents\" çoğul bir öznedir (they), bu yüzden \"are\" kullanılır."],["I ___ very hungry right now.","am",["is","are","be"],"\"I\" öznesi her zaman \"am\" alır."],["___ your brother at school today?","Is",["Are","Am","Be"],"\"your brother\" tekil 3. şahıstır (he); soru cümlesinde \"Is\" başa gelir."],["The weather ___ not cold today.","is",["are","am","be"],"\"The weather\" tekildir (it) ve \"is\" alır."],["Where ___ my keys?","are",["is","am","be"],"\"my keys\" çoğul olduğu için \"are\" gerekir."],["Those books ___ on the table.","are",["is","am","be"],"\"Those books\" çoğul: are."],["___ I late for class?","Am",["Is","Are","Be"],"\"I\" ile soru: Am I..."]]},{"id":"possessive","lv":"A1","en":"Pronouns and possessive adjectives","tr":"Zamirler ve iyelik sıfatları","p":["Özne zamirleri cümlenin öznesidir: I, you, he, she, it, we, they. Nesne zamirleri fiilden sonra gelir: me, you, him, her, it, us, them.","İyelik sıfatları ismin önüne gelir ve \"benim, senin...\" anlamı verir: my, your, his, her, its, our, their."],"f":["I → me → my · he → him → his · she → her → her · we → us → our · they → them → their"],"e":[["This is my book.","Bu benim kitabım."],["Can you help me?","Bana yardım eder misin?"],["They love their dog.","Köpeklerini çok seviyorlar."]],"q":[["Ali is my friend. I see ___ every day.","him",["he","his","her"],"Fiilden sonra nesne gerekir: he → him."],["Ayşe and ___ sister live in Ankara.","her",["she","hers","his"],"Ayşe kadın, kız kardeşinden bahsediliyor: \"her sister\" (onun kız kardeşi)."],["We like ___ new teacher very much.","our",["us","we","ours"],"İsmin (teacher) önünde iyelik sıfatı gelir: our."],["The cat is eating ___ food.","its",["it's","it","their"],"Hayvanın/eşyanın sahipliği \"its\" ile anlatılır; \"it's\" = it is."],["Please give ___ the pen.","me",["I","my","mine"],"\"give\" fiilinden sonra nesne zamiri gelir: me."],["This bag is ___. Don't take it.","mine",["my","me","I"],"İyelik zamiri: mine (benimki)."],["They forgot ___ umbrellas at home.","their",["theirs","them","they"],"İsimden önce iyelik sıfatı: their."]]},{"id":"present-simple","lv":"A1","en":"Present simple","tr":"Geniş zaman (Present Simple)","p":["Alışkanlıkları, rutinleri ve genel gerçekleri anlatır. \"Her gün, genellikle\" gibi durumlarda kullanılır.","He/she/it ile fiile -s/-es eklenir. Olumsuz ve soru cümlelerinde do/does yardımcı fiili kullanılır; does geldiğinde fiildeki -s düşer."],"f":["I/you/we/they work · he/she/it works","don't / doesn't + fiil · Do / Does + özne + fiil?"],"e":[["She drinks coffee every morning.","Her sabah kahve içer."],["Water boils at 100 degrees.","Su 100 derecede kaynar."],["Does he play football?","Futbol oynar mı?"]],"q":[["My father ___ to work by bus.","goes",["go","going","is go"],"Özne he (my father) olduğu için fiil -es alır: goes."],["They ___ live in the city centre.","don't",["doesn't","aren't","not"],"\"They\" ile olumsuz geniş zaman \"don't\" ile yapılır."],["___ your sister speak English?","Does",["Do","Is","Are"],"\"your sister\" (she) için soru \"Does\" ile kurulur."],["The sun ___ in the east.","rises",["rise","is rise","rising"],"Genel gerçek, tekil özne: rises."],["He doesn't ___ meat.","eat",["eats","eating","ate"],"\"doesn't\" sonrası fiil yalın halde kalır: eat."],["She ___ to work by bus every morning.","goes",["go","going","gone"],"\"she\" + present simple: goes."],["___ they live near the station?","Do",["Does","Are","Is"],"Çoğul özne ile soru: Do they..."]]},{"id":"present-continuous","lv":"A1","en":"Present continuous","tr":"Şimdiki zaman (Present Continuous)","p":["Şu anda, konuşma anında devam eden eylemleri anlatır. \"now, at the moment, look!\" gibi ifadelerle sık görülür.","Yapı: am/is/are + fiil-ing."],"f":["Özne + am/is/are + fiil-ing"],"e":[["I am reading a book now.","Şu anda kitap okuyorum."],["Look! It is raining.","Bak! Yağmur yağıyor."],["What are you doing?","Ne yapıyorsun?"]],"q":[["Be quiet! The baby ___.","is sleeping",["sleeps","sleep","are sleeping"],"\"Be quiet!\" şu an olan bir durumu gösterir; tekil özne: is sleeping."],["We ___ dinner at the moment.","are having",["have","has","is having"],"\"at the moment\" şimdiki zaman ister; we → are having."],["Listen! Someone ___ at the door.","is knocking",["knocks","knock","are knocking"],"\"Listen!\" konuşma anını işaret eder."],["What ___ you looking at?","are",["is","do","does"],"Şimdiki zaman sorusu: are you looking."],["She usually walks to school, but today she ___ the bus.","is taking",["takes","take","took"],"\"usually\" geniş zaman, \"today\" ise şu anki farklı durum: is taking."],["Look! The children ___ in the garden.","are playing",["play","plays","played"],"Şu anda olan eylem: are playing."],["Be quiet. The baby ___.","is sleeping",["sleeps","sleep","slept"],"Şu an: is sleeping."]]},{"id":"there-is","lv":"A1","en":"There is / there are","tr":"There is / There are (var / yok)","p":["Bir yerde bir şeyin var olduğunu söylemek için kullanılır. Tekil ve sayılamayan isimlerle \"there is\", çoğul isimlerle \"there are\" gelir."],"f":["There is + tekil · There are + çoğul · Is there ...? / Are there ...?"],"e":[["There is a bank near my house.","Evimin yakınında bir banka var."],["There are two chairs in the room.","Odada iki sandalye var."]],"q":[["___ a lot of people in the park today.","There are",["There is","It is","They are"],"\"people\" çoğuldur: There are."],["There ___ some milk in the fridge.","is",["are","be","am"],"\"milk\" sayılamayan bir isimdir ve \"is\" alır."],["___ any shops near here?","Are there",["Is there","There are","Is it"],"\"shops\" çoğul; soru: Are there...?"],["There ___ a cat under the table.","is",["are","have","has"],"Tek bir kedi: There is."],["There aren't ___ students in the classroom.","any",["some","a","no"],"Olumsuz cümlede çoğul isimle \"any\" kullanılır."],["___ any milk in the fridge?","Is there",["Are there","There is","There are"],"\"milk\" sayılamaz: Is there."],["There ___ two parks in our neighbourhood.","are",["is","have","has"],"Çoğul: there are."]]},{"id":"can","lv":"A1","en":"Can / can't (ability)","tr":"Can / can't (yetenek ve izin)","p":["\"Can\" bir şeyi yapabilmeyi ya da izin istemeyi anlatır. Tüm öznelerle aynıdır ve arkasından fiil yalın halde gelir (to almaz)."],"f":["Özne + can / can't + yalın fiil · Can + özne + fiil?"],"e":[["I can swim.","Yüzebilirim."],["She can't drive.","O araba süremez."],["Can I open the window?","Pencereyi açabilir miyim?"]],"q":[["My brother can ___ three languages.","speak",["speaks","to speak","speaking"],"\"can\" sonrası fiil yalın kalır: speak."],["___ you help me with my homework?","Can",["Do","Are","Does"],"Rica/yardım istemek için \"Can you...?\""],["Penguins ___ fly, but they can swim very well.","can't",["can","don't can","aren't"],"Penguenler uçamaz: can't."],["She can ___ the piano very well.","play",["plays","to play","playing"],"Modal sonrası yalın fiil."],["I'm sorry, I ___ come to your party on Saturday.","can't",["can","don't","not can"],"Gelemeyeceğini söylüyor: can't."],["He ___ swim, but he can ride a bike.","can't",["doesn't can","isn't can","don't can"],"Olumsuz yetenek: can't."],["___ I open the window, please?","Can",["Do","Am","Have"],"İzin isteme: Can I..."]]},{"id":"past-simple-1","lv":"A1","en":"Past simple (was/were and regular verbs)","tr":"Geçmiş zaman (was/were ve düzenli fiiller)","p":["Geçmişte olup bitmiş eylemler için kullanılır: yesterday, last week, in 2010, ago.","\"Be\" fiilinin geçmişi was (I/he/she/it) ve were (you/we/they)'dir. Düzenli fiillere -ed eklenir. Olumsuz ve soruda \"did\" kullanılır, fiil yalın kalır."],"f":["was / were · fiil + -ed · didn't + fiil · Did + özne + fiil?"],"e":[["I was at home yesterday.","Dün evdeydim."],["We watched a film last night.","Dün gece film izledik."],["Did you call her?","Onu aradın mı?"]],"q":[["They ___ in London last summer.","were",["was","are","did"],"\"They\" ile geçmiş be fiili: were."],["I ___ my grandmother last weekend.","visited",["visit","visits","am visiting"],"\"last weekend\" geçmiş zaman ister: visited."],["___ you finish your homework yesterday?","Did",["Do","Were","Was"],"Geçmiş zaman sorusu \"Did\" ile kurulur."],["She didn't ___ the email.","answer",["answered","answers","answering"],"\"didn't\" sonrası fiil yalın: answer."],["The film ___ very interesting.","was",["were","is being","did"],"Tekil özne, geçmiş: was."],["They ___ at home last night.","were",["was","are","been"],"\"they\" geçmiş: were."],["I ___ my keys yesterday.","lost",["lose","loses","losing"],"Düzensiz geçmiş: lost."]]},{"id":"prepositions-time","lv":"A1","en":"Prepositions of time and place","tr":"Zaman ve yer edatları (in / on / at)","p":["Zaman: at + saat (at 5 o'clock), on + gün/tarih (on Monday, on 3 May), in + ay/yıl/mevsim/gün bölümü (in July, in 2020, in the morning).","Yer: in + kapalı alan/şehir/ülke, on + yüzey/cadde, at + belirli nokta (at the bus stop, at school)."],"f":["at 7 pm · on Friday · in April · in the box · on the wall · at the door"],"e":[["The meeting is on Tuesday at 10.","Toplantı salı günü saat 10'da."],["I was born in 1999.","1999'da doğdum."]],"q":[["The lesson starts ___ nine o'clock.","at",["in","on","by"],"Saatlerden önce \"at\" kullanılır."],["My birthday is ___ June.","in",["on","at","to"],"Aylardan önce \"in\" gelir."],["We have English ___ Mondays.","on",["in","at","by"],"Günlerden önce \"on\" kullanılır."],["There is a picture ___ the wall.","on",["in","at","under"],"Duvar bir yüzeydir: on the wall."],["I usually study ___ the evening.","in",["on","at","by"],"\"in the morning/afternoon/evening\" kalıbı. (Ama: at night)"],["We usually have lunch ___ noon.","at",["in","on","to"],"\"at noon\"."],["Her birthday is ___ July.","in",["on","at","by"],"Ay ile: in July."]]},{"id":"past-simple-2","lv":"A2","en":"Past simple: irregular verbs and questions","tr":"Geçmiş zaman: düzensiz fiiller ve soru kalıpları","p":["Pek çok sık kullanılan fiil düzensizdir ve -ed almaz: go → went, see → saw, buy → bought, take → took, write → wrote.","Olumsuz ve soru cümlelerinde \"did\" geldiği için fiil yine yalın hale döner: Did you see? / I didn't go."],"f":["went · saw · bought · took · came · made · had · gave"],"e":[["We went to Izmir last year.","Geçen yıl İzmir'e gittik."],["What did you buy?","Ne satın aldın?"]],"q":[["I ___ a great film at the cinema yesterday.","saw",["seed","see","seen"],"\"see\" düzensizdir; geçmiş hali \"saw\"."],["She ___ a new phone last week.","bought",["buyed","buys","has bought"],"\"buy → bought\"; \"last week\" geçmiş zaman ister."],["Where did you ___ on holiday?","go",["went","going","gone"],"\"did\" sonrası yalın fiil: go."],["He ___ me a nice present for my birthday.","gave",["gived","give","given"],"\"give → gave\"."],["We didn't ___ time to visit the museum.","have",["had","has","having"],"\"didn't\" sonrası yalın: have."],["Where ___ you go after the meeting?","did",["do","were","have"],"Geçmiş soru: did + V1."],["He ___ the email two hours ago.","sent",["send","sends","sending"],"Düzensiz: sent."]]},{"id":"past-continuous","lv":"A2","en":"Past continuous","tr":"Geçmişte süregelen zaman (Past Continuous)","p":["Geçmişte belirli bir anda devam etmekte olan eylemi anlatır. Çoğunlukla past simple ile birlikte, uzun süren eylemin kısa bir eylemle bölündüğünü göstermek için kullanılır.","\"while\" genellikle past continuous ile, \"when\" genellikle past simple ile gelir."],"f":["was / were + fiil-ing"],"e":[["I was cooking when the phone rang.","Telefon çaldığında yemek pişiriyordum."],["While we were walking, it started to rain.","Biz yürürken yağmur başladı."]],"q":[["At 8 pm yesterday, I ___ TV.","was watching",["watched","am watching","were watching"],"Geçmişte belirli bir anda devam eden eylem: was watching."],["She was reading when the lights ___ out.","went",["were going","go","was going"],"Uzun eylemi bölen kısa olay past simple: went."],["While they ___ football, it began to snow.","were playing",["played","was playing","are playing"],"\"While\" + past continuous; they → were."],["What ___ you doing at midnight?","were",["was","did","are"],"\"you\" için past continuous: were you doing."],["I ___ when I heard a strange noise.","was sleeping",["slept","am sleeping","sleep"],"Ses duyulduğunda devam eden eylem: was sleeping."],["While I ___ dinner, the phone rang.","was cooking",["cooked","cook","have cooked"],"Kesilen eylem: past continuous."],["They ___ TV when we arrived.","were watching",["watched","watch","are watching"],"Çoğul özne: were watching."]]},{"id":"present-perfect-1","lv":"A2","en":"Present perfect (ever, never, just, already, yet)","tr":"Present Perfect (ever / never / just / already / yet)","p":["Geçmişte başlayıp etkisi şimdiye uzanan ya da zamanı belirtilmeyen deneyimleri anlatır. Kesin geçmiş zaman ifadesi (yesterday, in 2010) ile kullanılmaz.","ever (hiç), never (asla/hiç), just (az önce), already (çoktan), yet (henüz; olumsuz ve soru cümlelerinde, cümle sonunda)."],"f":["have / has + V3 (past participle)"],"e":[["Have you ever been to Paris?","Hiç Paris'e gittin mi?"],["I have just finished my homework.","Ödevimi az önce bitirdim."],["She hasn't called yet.","Henüz aramadı."]],"q":[["I ___ never eaten sushi.","have",["has","am","did"],"\"I\" ile present perfect: have + V3."],["Has she finished her report ___?","yet",["already","ever","just"],"Soru cümlesinin sonunda \"yet\" (henüz) kullanılır."],["We have ___ seen this film. Let's watch something else.","already",["yet","ever","since"],"\"çoktan izledik\" anlamı: already."],["___ you ever ridden a horse?","Have",["Did","Do","Has"],"\"ever\" ile deneyim sorusu: Have you ever...?"],["He ___ his keys, so he can't open the door.","has lost",["lost","loses","have lost"],"Geçmişteki olayın şimdiye etkisi var: has lost."],["I have ___ finished my homework.","already",["yet","still","ago"],"Olumlu cümlede already."],["Have you ever ___ to Izmir?","been",["went","go","gone to never"],"\"Have you ever been to...\""]]},{"id":"future","lv":"A2","en":"Future: will and be going to","tr":"Gelecek zaman: will ve be going to","p":["\"be going to\": önceden yapılmış planlar ve şu anki işaretlere dayanan tahminler (Look at those clouds! It's going to rain.)","\"will\": konuşma anında verilen kararlar, sözler, teklifler ve genel tahminler (I think...). Arkasından yalın fiil gelir."],"f":["will + fiil · am/is/are going to + fiil"],"e":[["I'm going to visit my aunt next week.","Gelecek hafta teyzemi ziyaret edeceğim (planlı)."],["I'm tired. I'll go to bed.","Yorgunum, yatacağım (anlık karar)."]],"q":[["Look at those dark clouds! It ___ rain.","is going to",["will be","goes to","is going"],"Şu anki işarete dayanan tahmin: is going to."],["\"The phone is ringing.\" \"OK, I ___ answer it.\"","will",["am going to","going to","answer"],"Konuşma anında verilen karar: will."],["We have bought the tickets. We ___ fly to Rome on Friday.","are going to",["will to","go","are go"],"Önceden yapılmış plan: are going to."],["I think Turkey ___ win the match.","will",["is","are going","wins to"],"\"I think\" ile genel tahmin: will."],["I promise I ___ tell anyone your secret.","won't",["don't","am not","not will"],"Söz verirken \"will/won't\" kullanılır."],["It looks cloudy. It ___ rain.","is going to",["will to","shall","going"],"Kanıta dayalı tahmin: going to."],["I think she ___ the exam.","will pass",["passes","is passing","pass"],"Kişisel tahmin: will."]]},{"id":"comparatives","lv":"A2","en":"Comparatives and superlatives","tr":"Karşılaştırma ve üstünlük sıfatları","p":["Kısa sıfatlar -er / -est alır (cheap → cheaper → the cheapest). Uzun sıfatlar more / the most alır (expensive → more expensive → the most expensive).","Düzensizler: good → better → the best · bad → worse → the worst · far → further → the furthest. Karşılaştırmada \"than\" kullanılır."],"f":["sıfat-er + than · more + sıfat + than · the + sıfat-est · the most + sıfat"],"e":[["My car is faster than yours.","Arabam seninkinden daha hızlı."],["This is the most beautiful city in the world.","Burası dünyanın en güzel şehri."]],"q":[["Ankara is ___ than Istanbul in winter.","colder",["more cold","coldest","the colder"],"Kısa sıfat: cold → colder + than."],["This is ___ book I have ever read.","the best",["the better","the goodest","best than"],"\"good\" düzensiz; üstünlük: the best."],["A Ferrari is ___ than a Fiat.","more expensive",["expensiver","most expensive","the more expensive"],"Uzun sıfat: more expensive."],["Today is ___ day of the year.","the hottest",["the hotest","hotter","the most hot"],"\"hot\" → hottest (sessiz harf ikizlenir)."],["My English is ___ than last year.","better",["gooder","best","more good"],"good → better."],["This bag is ___ than that one.","heavier",["more heavy","heaviest","heavily"],"Kısa sıfat: heavier."],["She is the ___ student in the class.","tallest",["taller","more tall","most tall"],"Üstünlük: the tallest."]]},{"id":"quantifiers","lv":"A2","en":"Countable/uncountable: some, any, much, many","tr":"Sayılabilen/sayılamayan isimler: some, any, much, many","p":["Sayılabilen isimler çoğul olabilir (apples); sayılamayanlar olamaz (water, information, advice).","many → sayılabilen çoğul · much → sayılamayan · some → olumlu cümle · any → olumsuz ve soru · a lot of → her ikisi."],"f":["How many + çoğul? · How much + sayılamayan?"],"e":[["How much water do you drink?","Ne kadar su içersin?"],["There aren't many students here.","Burada çok öğrenci yok."]],"q":[["How ___ sugar do you want in your tea?","much",["many","lot","few"],"\"sugar\" sayılamaz: How much."],["There aren't ___ eggs in the fridge.","any",["some","much","a"],"Olumsuz cümle, çoğul sayılabilen: any."],["I don't have ___ money with me.","much",["many","a few","few"],"\"money\" sayılamaz: much."],["How ___ people came to the party?","many",["much","lot","little"],"\"people\" sayılabilen çoğul: many."],["Could I have ___ advice, please?","some",["any","a","many"],"\"advice\" sayılamaz; rica cümlesinde \"some\" kullanılır."],["There isn't ___ sugar left.","much",["many","few","a few"],"\"sugar\" sayılamaz: much."],["Only ___ people came to the meeting.","a few",["a little","little","much"],"\"people\" sayılabilen, az ama var: a few."]]},{"id":"obligation","lv":"A2","en":"Must, have to, should","tr":"Zorunluluk ve tavsiye: must, have to, should","p":["must: konuşanın hissettiği güçlü zorunluluk veya kural. have to: dış koşullardan gelen zorunluluk. should: tavsiye.","Dikkat: mustn't = yasak (yapmamalısın) ama don't have to = gerek yok (zorunda değilsin)."],"f":["must / should + yalın fiil · have to / has to + yalın fiil"],"e":[["You must wear a seat belt.","Emniyet kemeri takmalısın."],["You don't have to come.","Gelmek zorunda değilsin."],["You should see a doctor.","Doktora görünmelisin."]],"q":[["You look ill. You ___ see a doctor.","should",["mustn't","don't have to","shouldn't"],"Tavsiye: should."],["Students ___ use their phones during the exam. It's forbidden.","mustn't",["don't have to","should","must"],"Yasak: mustn't."],["Tomorrow is Sunday, so I ___ get up early.","don't have to",["mustn't","have to","must"],"Zorunluluk yok: don't have to."],["She ___ work on Saturdays because the shop is open.","has to",["have to","must to","should to"],"Dış zorunluluk; she → has to."],["You ___ smoke in the hospital.","mustn't",["don't have to","needn't","should"],"Hastanede sigara içmek yasak: mustn't."],["You ___ smoke in the hospital. It's forbidden.","mustn't",["don't have to","shouldn't to","must not to"],"Yasak: mustn't."],["We ___ wear a uniform; it's optional.","don't have to",["mustn't","can't","shouldn't have"],"Zorunluluk yok: don't have to."]]},{"id":"gerund-infinitive-1","lv":"A2","en":"Verb + -ing or to + verb","tr":"Fiil + -ing ya da to + fiil","p":["Bazı fiillerden sonra -ing gelir: enjoy, like, love, hate, finish, mind, avoid. Bazılarından sonra to + fiil gelir: want, decide, hope, plan, need, would like."],"f":["enjoy doing · finish doing · want to do · decide to do"],"e":[["I enjoy reading novels.","Roman okumaktan hoşlanırım."],["She decided to study medicine.","Tıp okumaya karar verdi."]],"q":[["I really enjoy ___ in the sea.","swimming",["to swim","swim","swam"],"\"enjoy\" sonrası -ing gelir."],["We want ___ a new car next year.","to buy",["buying","buy","bought"],"\"want\" sonrası to + fiil gelir."],["Have you finished ___ the report?","writing",["to write","write","wrote"],"\"finish\" sonrası -ing gelir."],["They decided ___ the party until next week.","to postpone",["postponing","postpone","postponed"],"\"decide\" sonrası to + fiil."],["Would you mind ___ the window?","opening",["to open","open","opened"],"\"mind\" sonrası -ing gelir."],["I enjoy ___ in the sea.","swimming",["swim","to swim","swam"],"\"enjoy\" + V-ing."],["She decided ___ a new course.","to take",["taking","take","took"],"\"decide\" + to V1."]]},{"id":"pp-vs-ps","lv":"B1","en":"Present perfect vs past simple; for and since","tr":"Present Perfect mi, Past Simple mı? For ve since","p":["Kesin geçmiş zaman belirtiliyorsa (yesterday, in 2019, ago, last year) past simple kullanılır. Süre şimdiye kadar devam ediyorsa ya da zaman belirtilmiyorsa present perfect kullanılır.","for + süre (for three years), since + başlangıç noktası (since 2019, since Monday)."],"f":["I have lived here for ten years. · I have lived here since 2015."],"e":[["I moved here in 2015.","2015'te buraya taşındım (bitmiş olay, kesin zaman)."],["I have lived here since 2015.","2015'ten beri burada yaşıyorum (hâlâ devam ediyor)."]],"q":[["I ___ this company in 2018.","joined",["have joined","was joining","have been joining"],"\"in 2018\" kesin geçmiş zaman: past simple."],["She has worked as a nurse ___ fifteen years.","for",["since","during","ago"],"Süre bildiren ifade: for."],["We have known each other ___ we were children.","since",["for","ago","from"],"Başlangıç noktası: since."],["How long ___ you had this car?","have",["did","are","do"],"Şimdiye kadar süren durum: How long have you had...?"],["I ___ him two days ago.","saw",["have seen","had seen","see"],"\"ago\" past simple ister."],["I ___ Paris in 2019.","visited",["have visited","has visited","visiting"],"\"in 2019\" belirli geçmiş: past simple."],["She has lived here ___ 2015.","since",["for","from","ago"],"Başlangıç noktası: since."]]},{"id":"pp-continuous","lv":"B1","en":"Present perfect continuous","tr":"Present Perfect Continuous","p":["Geçmişte başlayıp hâlâ devam eden ya da az önce bitip etkisi görülen, süreç vurgulu eylemleri anlatır. Genellikle \"for, since, how long, all day\" ile kullanılır."],"f":["have / has been + fiil-ing"],"e":[["I have been waiting for an hour.","Bir saattir bekliyorum."],["Your eyes are red. Have you been crying?","Gözlerin kırmızı. Ağlıyor muydun?"]],"q":[["She ___ English for three years and she is still learning.","has been studying",["studied","is studying","had studied"],"Geçmişte başlayıp devam eden süreç: has been studying."],["I'm tired because I ___ all day.","have been working",["worked","am working","work"],"Etkisi şu an görülen süreç: have been working."],["How long ___ you been living in Izmir?","have",["did","are","were"],"\"How long have you been + -ing\" kalıbı."],["It ___ since this morning, and the streets are wet.","has been raining",["rained","is raining","rains"],"\"since this morning\" + süreç: has been raining."],["They have been ___ for this exam for months.","preparing",["prepared","prepare","to prepare"],"\"have been\" sonrası fiil -ing alır."],["They have been waiting ___ two hours.","for",["since","during","from"],"Süre: for + time period."],["He is tired because he ___ all morning.","has been working",["works","worked","is working"],"Sabah boyunca süren eylem: present perfect continuous."]]},{"id":"conditionals-1","lv":"B1","en":"First and second conditionals","tr":"Koşul cümleleri: 1. ve 2. tip","p":["1. tip: gerçek/olası gelecek koşul. If + present simple, will + fiil.","2. tip: şimdiki zaman için hayali/olası olmayan durum. If + past simple, would + fiil. \"be\" fiili tüm öznelerle \"were\" olabilir (If I were you...)."],"f":["If + present, will + V1 · If + past, would + V1"],"e":[["If it rains, we will stay at home.","Yağmur yağarsa evde kalacağız."],["If I had more time, I would learn Spanish.","Daha çok zamanım olsaydı İspanyolca öğrenirdim."]],"q":[["If you heat ice, it ___.","melts",["melted","would melt","will melted"],"Genel gerçek (0. tip): If + present, present."],["If it ___ tomorrow, we will cancel the picnic.","rains",["will rain","rained","would rain"],"1. tip: if cümlesinde will kullanılmaz, present simple gelir."],["If I ___ you, I would accept the job.","were",["am","will be","had been"],"Tavsiye kalıbı: If I were you."],["If I won the lottery, I ___ a big house.","would buy",["will buy","bought","buy"],"2. tip: would + fiil."],["If she studies hard, she ___ the exam.","will pass",["would pass","passed","passes"],"1. tip: will + fiil."],["If it rains tomorrow, we ___ at home.","will stay",["stay","would stay","stayed"],"1. tip: If + present, will."],["If I ___ rich, I would travel more.","were",["am","was being","will be"],"2. tip: If + past, would. \"I were\" kalıbı."]]},{"id":"passive-1","lv":"B1","en":"The passive (present and past)","tr":"Edilgen yapı (Passive): geniş ve geçmiş zaman","p":["Eylemi kimin yaptığı önemsiz ya da bilinmiyorsa, eylemden etkilenen nesne cümlenin başına alınır. Yapan kişi gerekirse \"by\" ile belirtilir."],"f":["am/is/are + V3 (geniş zaman) · was/were + V3 (geçmiş zaman)"],"e":[["English is spoken all over the world.","İngilizce tüm dünyada konuşulur."],["The bridge was built in 1973.","Köprü 1973'te inşa edildi."]],"q":[["Coffee ___ in Brazil.","is grown",["grows","is growing","grown"],"Edilgen geniş zaman: is grown."],["This novel ___ by Orhan Pamuk.","was written",["wrote","is writing","has written"],"Edilgen geçmiş zaman: was written."],["The windows ___ every week.","are cleaned",["clean","cleaned","are cleaning"],"Çoğul özne, edilgen: are cleaned."],["My bike ___ last night.","was stolen",["stole","was stealing","is stolen"],"Dün gece çalındı: was stolen."],["Millions of emails ___ every day.","are sent",["send","sent","are sending"],"Edilgen geniş zaman, çoğul: are sent."],["These phones ___ in Turkey.","are made",["make","made","are making"],"Geniş zaman edilgen: are made."],["The window ___ during the storm.","was broken",["broke","is broken","has break"],"Geçmiş edilgen: was broken."]]},{"id":"relative-1","lv":"B1","en":"Relative clauses (who, which, that, where, whose)","tr":"İlgi cümleleri (who / which / that / where / whose)","p":["İsmi tanımlayan yan cümlelerdir. who → insanlar, which → nesneler/hayvanlar, that → ikisi için de (tanımlayıcı cümlelerde), where → yerler, whose → sahiplik."],"f":["the man who ... · the book which/that ... · the town where ... · the girl whose father ..."],"e":[["The woman who lives next door is a doctor.","Yan dairede oturan kadın doktor."],["This is the house where I was born.","Burası doğduğum ev."]],"q":[["The man ___ helped me was very kind.","who",["which","where","whose"],"İnsan için ilgi zamiri: who."],["This is the hotel ___ we stayed last year.","where",["which","who","whose"],"Yer bildirir ve arkasında tam bir cümle var: where."],["I lost the watch ___ my father gave me.","that",["who","where","whose"],"Nesne için: that/which."],["That's the boy ___ mother is a famous singer.","whose",["who","who's","which"],"Sahiplik (\"annesi\"): whose."],["The film ___ we saw yesterday was boring.","which",["who","where","whom"],"Nesne (film) için: which."],["The woman ___ you met is my aunt.","who",["where","whose","when"],"Nesne/kişi: who (whom da olur; şıklarda who)."],["2020 was the year ___ the pandemic began.","when",["where","who","which year"],"Zaman: when."]]},{"id":"reported-1","lv":"B1","en":"Reported speech (statements)","tr":"Dolaylı anlatım (cümleler)","p":["Birinin söylediğini aktarırken, aktarma fiili geçmişteyse (said, told) zaman bir derece geriye kayar: am → was, will → would, can → could, present simple → past simple, past simple → past perfect.","\"say\" nesne almaz (said that), \"tell\" kişi nesnesi alır (told me that)."],"f":["\"I am tired.\" → She said (that) she was tired."],"e":[["He said he would call me.","Beni arayacağını söyledi."],["She told me she couldn't come.","Bana gelemeyeceğini söyledi."]],"q":[["\"I am busy,\" he said. → He said that he ___ busy.","was",["is","has been","will be"],"Zaman bir derece geriye kayar: am → was."],["\"I will help you,\" she said. → She said she ___ help me.","would",["will","can","shall"],"will → would."],["She ___ me that she was leaving.","told",["said","spoke","talked"],"Kişi nesnesi varsa \"told me\" kullanılır."],["\"I can swim,\" Ali said. → Ali said he ___ swim.","could",["can","may","would can"],"can → could."],["He ___ that he was tired.","said",["told","told to","spoke"],"Kişi nesnesi yoksa \"said (that)\"."],["\"We have finished,\" they said. → They said they ___ finished.","had",["have","has","were"],"\"have finished\" → had finished."],["\"I may be late,\" she said. → She said she ___ be late.","might",["may","can","will"],"may → might."]]},{"id":"used-to","lv":"B1","en":"Used to and would (past habits)","tr":"Used to ve would (geçmiş alışkanlıklar)","p":["\"used to + fiil\" geçmişte olan ama artık olmayan alışkanlık ve durumları anlatır. \"would\" yalnızca tekrarlanan eylemler için kullanılır, durumlar için kullanılmaz.","Karıştırma: \"be used to + -ing\" = bir şeye alışkın olmak. \"get used to + -ing\" = alışmak."],"f":["used to + V1 · didn't use to + V1 · be/get used to + V-ing"],"e":[["I used to live in Bursa.","Eskiden Bursa'da yaşardım."],["I'm used to getting up early.","Erken kalkmaya alışkınım."]],"q":[["When I was a child, I ___ play in the street every day.","used to",["use to","was used to","am used to"],"Geçmiş alışkanlık: used to + V1."],["She didn't ___ like vegetables, but now she loves them.","use to",["used to","using to","uses to"],"Olumsuz: didn't use to."],["I'm used to ___ in a noisy city.","living",["live","lived","to living"],"\"be used to\" sonrası -ing gelir."],["It took me months to get used to ___ on the left.","driving",["drive","drove","to drive"],"\"get used to\" sonrası -ing."],["There ___ be a cinema here, but now it's a supermarket.","used to",["would","was used to","uses to"],"Geçmişteki durum: used to (would durumlar için kullanılmaz)."],["He ___ smoke, but he stopped last year.","used to",["was used to","uses to","would to"],"Geçmiş alışkanlık: used to."],["I'm not used to ___ so much coffee.","drinking",["drink","drank","to drink"],"\"be used to\" + V-ing."]]},{"id":"deduction-1","lv":"B1","en":"Modals of deduction (present)","tr":"Çıkarım kipleri (şimdiki zaman): must, might, can't","p":["must: neredeyse eminim (olumlu). can't: kesinlikle olamaz. might / may / could: olabilir, emin değilim."],"f":["must / might / may / could / can't + V1 (ya da be + -ing)"],"e":[["She has been working all day. She must be tired.","Bütün gün çalıştı, yorgun olmalı."],["That can't be true!","Bu doğru olamaz!"]],"q":[["He has three cars and a big house. He ___ be rich.","must",["can't","mustn't","shouldn't"],"Kanıtlara dayanan güçlü çıkarım: must."],["That ___ be Ahmet. He is in London this week.","can't",["must","should","has to"],"İmkânsız olduğunu düşünüyoruz: can't."],["I'm not sure where she is. She ___ be at the library.","might",["must","can't","has to"],"Emin olmayan olasılık: might."],["You haven't eaten anything all day. You ___ be hungry.","must",["can't","might not","mustn't"],"Güçlü çıkarım: must."],["Take an umbrella. It ___ rain later.","may",["must","can't","mustn't"],"Olasılık: may."],["The lights are off. They ___ be at home.","can't",["must","should","have to"],"Kanıt olumsuz: can't."],["She's not answering. She ___ be driving.","might",["mustn't","can't to","has"],"Olasılık: might."]]},{"id":"conditionals-2","lv":"B2","en":"Third and mixed conditionals","tr":"Koşul cümleleri: 3. tip ve karma tip","p":["3. tip: geçmişte gerçekleşmemiş bir koşul ve sonucu (pişmanlık, eleştiri). If + past perfect, would have + V3.","Karma tip: geçmişteki koşulun şimdiki sonucu. If + past perfect, would + V1 (If I had studied medicine, I would be a doctor now)."],"f":["If + had + V3, would have + V3 · If + had + V3, would + V1 (now)"],"e":[["If you had told me, I would have helped you.","Bana söyleseydin sana yardım ederdim."],["If I had saved money, I would be rich now.","Para biriktirseydim şimdi zengin olurdum."]],"q":[["If she had left earlier, she ___ the train.","would have caught",["would catch","will catch","had caught"],"3. tip: would have + V3."],["If I ___ harder, I would have passed the exam.","had studied",["studied","have studied","would study"],"3. tip if cümlesi: had + V3."],["If he had taken the medicine, he ___ better now.","would feel",["would have felt","will feel","felt"],"Geçmişteki koşul, şimdiki sonuç (\"now\"): karma tip, would + V1."],["We would have won the match if our best player ___ injured.","hadn't been",["wasn't","wouldn't be","hasn't been"],"3. tip if cümlesi: hadn't been."],["If I had accepted that job, I ___ in Germany now.","would be living",["would have lived","will live","had lived"],"Karma tip: şu anki hayali durum (\"now\")."],["If she had studied, she ___ the exam.","would have passed",["would pass","will pass","passed"],"3. tip: would have + V3."],["If I hadn't missed the bus, I ___ on time.","would have arrived",["will arrive","arrive","arrived"],"3. tip karışık değil, geçmiş sonuç."]]},{"id":"past-perfect","lv":"B2","en":"Past perfect and past perfect continuous","tr":"Past Perfect ve Past Perfect Continuous","p":["Geçmişteki iki olaydan önce olanı göstermek için past perfect (had + V3) kullanılır. \"by the time, before, after, when, already\" ile sık görülür.","Geçmişteki bir andan önce bir süre devam etmiş eylemi vurgulamak için past perfect continuous (had been + -ing) kullanılır."],"f":["had + V3 · had been + V-ing"],"e":[["When we arrived, the film had already started.","Vardığımızda film çoktan başlamıştı."],["She was tired because she had been running.","Koştuğu için yorgundu."]],"q":[["By the time the police arrived, the thief ___.","had escaped",["escaped","has escaped","was escaping"],"Polis gelmeden önce tamamlanmış eylem: had escaped."],["I ___ that film before, so I didn't want to see it again.","had seen",["have seen","saw","was seeing"],"Geçmişteki karardan önceki deneyim: had seen."],["Her eyes were red because she ___ for hours.","had been crying",["has been crying","cried","was cried"],"Geçmişteki bir andan önce süren eylem: had been crying."],["After he ___ his homework, he went out.","had finished",["has finished","was finishing","finishes"],"\"After\" ile önce olan eylem: had finished."],["When I got to the station, the train ___ already.","had left",["has left","was leaving","leaves"],"İstasyona varmadan önce tamamlanmış: had left."],["By the time we sat down, the film ___ .","had started",["has started","started","starts"],"Önce biten eylem: past perfect."],["She was tired because she ___ all night.","had been working",["has been working","worked","works"],"Geçmişte süren eylem: past perfect continuous."]]},{"id":"future-advanced","lv":"B2","en":"Future continuous and future perfect","tr":"Future Continuous ve Future Perfect","p":["Future continuous (will be + -ing): gelecekte belirli bir anda devam ediyor olacak eylem.","Future perfect (will have + V3): gelecekte belirli bir zamandan önce tamamlanmış olacak eylem. \"by + zaman\" ile sık kullanılır."],"f":["will be + V-ing · will have + V3"],"e":[["This time tomorrow I will be flying to Rome.","Yarın bu saatte Roma'ya uçuyor olacağım."],["By 2030, they will have finished the project.","2030'a kadar projeyi bitirmiş olacaklar."]],"q":[["Don't call me at 8; I ___ dinner then.","will be having",["will have had","have","am had"],"O anda devam ediyor olacak: will be having."],["By next June, I ___ from university.","will have graduated",["will graduate","graduate","am graduating"],"\"By next June\" öncesinde tamamlanmış olacak: will have graduated."],["This time next week, we ___ on a beach in Antalya.","will be lying",["will have lain","lie","are lain"],"Gelecekte belirli bir anda süren durum: will be lying."],["By the time you arrive, I ___ the cake.","will have baked",["will bake","bake","baked"],"Gelmenden önce tamamlanmış olacak: will have baked."],["The scientists ___ the results by the end of the year.","will have published",["will be publish","have published","publish"],"\"by the end of the year\" + tamamlanma: will have published."],["This time tomorrow I ___ over the Atlantic.","will be flying",["will fly","fly","am flying"],"Belirli gelecekteki süreç: future continuous."],["By 2030 the city ___ a new metro line.","will have built",["builds","has built","will build"],"O tarihe kadar tamamlanmış: future perfect."]]},{"id":"passive-2","lv":"B2","en":"Advanced passive (modals, perfect, reporting verbs)","tr":"İleri edilgen yapılar (modal, perfect, it is said that)","p":["Modal ile edilgen: modal + be + V3 (must be done). Perfect ile: have/has been + V3. Devam eden: is being + V3.","Haber/akademik dilde: It is said / believed / thought that ... ya da Özne + is said to + V1 / to have + V3 (geçmiş için)."],"f":["can/must/should be + V3 · has been + V3 · is being + V3 · is said to have + V3"],"e":[["The work must be finished by Friday.","İş cuma gününe kadar bitirilmeli."],["He is believed to have left the country.","Ülkeyi terk ettiğine inanılıyor."]],"q":[["The road ___ at the moment, so we have to use another route.","is being repaired",["is repaired","has repaired","repairs"],"Şu an devam eden edilgen eylem: is being repaired."],["All the forms must ___ before Monday.","be completed",["complete","completed","being completed"],"Modal + be + V3."],["The new hospital ___ recently.","has been opened",["has opened","is opening","was opening"],"\"recently\" + edilgen perfect: has been opened."],["The painting is thought ___ in the 16th century.","to have been painted",["to paint","to be painting","painting"],"Geçmişe ait bir durum: is thought to have been + V3."],["It ___ that the economy will grow next year.","is expected",["expects","is expecting","has expected"],"\"It is expected that...\" edilgen kalıbı."],["The results ___ next week.","will be announced",["will announce","are announcing","announce"],"Gelecek edilgen: will be announced."],["The window must ___ before winter.","be repaired",["repair","repaired","to repair"],"Modal + edilgen: must be repaired."]]},{"id":"causative","lv":"B2","en":"Causative: have / get something done","tr":"Ettirgen yapı: have/get something done","p":["Bir işi başkasına yaptırdığımızı anlatır. Yapı: have/get + nesne + V3. Ayrıca \"have someone do\" ve \"get someone to do\" kalıpları da vardır."],"f":["have + nesne + V3 · get + nesne + V3 · have sb do · get sb to do"],"e":[["I had my hair cut yesterday.","Dün saçımı kestirdim."],["She got her car repaired.","Arabasını tamir ettirdi."]],"q":[["I'm going to have my eyes ___ tomorrow.","tested",["test","testing","to test"],"have + nesne + V3: tested."],["We had the house ___ last month.","painted",["paint","painting","to paint"],"have + nesne + V3."],["I'll get the mechanic ___ the brakes.","to check",["check","checked","checking"],"get + kişi + to + V1."],["She had her assistant ___ the documents.","send",["to send","sent","sending"],"have + kişi + V1 (to almaz)."],["You should get your phone ___; the screen is broken.","fixed",["fix","to fix","fixing"],"get + nesne + V3."],["I had my car ___ yesterday.","repaired",["repair","repairing","to repair"],"\"have something done\"."],["She got her hair ___ before the interview.","cut",["cutting","to cut","cuts"],"\"get something done\"."]]},{"id":"wish","lv":"B2","en":"Wish and if only","tr":"Wish ve if only (dilek ve pişmanlık)","p":["Şimdiki durum için dilek: wish + past simple (I wish I were taller). Geçmiş için pişmanlık: wish + past perfect (I wish I had studied). Başkasının davranışından şikâyet: wish + would."],"f":["wish + V2 (şimdi) · wish + had + V3 (geçmiş) · wish + sb + would + V1"],"e":[["I wish I knew the answer.","Keşke cevabı bilsem."],["If only I hadn't said that.","Keşke bunu söylemeseydim."]],"q":[["I wish I ___ a car. I'm tired of taking the bus.","had",["have","would have","will have"],"Şimdiki durum için dilek: past simple."],["She wishes she ___ to the party last night.","had gone",["went","would go","has gone"],"Geçmişle ilgili pişmanlık: had + V3."],["I wish you ___ making that noise! It's annoying.","would stop",["stopped","stop","had stopped"],"Başkasının davranışından şikâyet: would + V1."],["If only I ___ more time to finish the project.","had",["have","will have","would had"],"Şimdiki dilek: past simple."],["I wish I ___ so much yesterday. I feel sick now.","hadn't eaten",["didn't eat","wouldn't eat","haven't eaten"],"Geçmişteki eylemden pişmanlık: hadn't eaten."],["I wish I ___ more time.","had",["have","will have","am having"],"Şimdiki dilek: wish + past."],["He wishes he ___ the job offer.","had accepted",["accepted","accepts","has accepted"],"Geçmiş pişmanlık: wish + past perfect."]]},{"id":"past-modals","lv":"B2","en":"Modals in the past (should have, must have, could have)","tr":"Geçmişe yönelik modallar","p":["should have + V3: yapılması gerekirdi ama yapılmadı (eleştiri/pişmanlık). must have + V3: geçmiş hakkında güçlü çıkarım. can't/couldn't have + V3: geçmişte olmuş olamaz. could/might/may have + V3: olmuş olabilir. needn't have + V3: gereksiz yere yapıldı."],"f":["modal + have + V3"],"e":[["You should have told me earlier.","Bana daha önce söylemeliydin."],["She must have forgotten our meeting.","Toplantımızı unutmuş olmalı."]],"q":[["The ground is wet. It ___ last night.","must have rained",["should have rained","can't have rained","must rain"],"Kanıta dayanan geçmiş çıkarım: must have rained."],["You failed the exam. You ___ harder.","should have studied",["must have studied","could study","should study"],"Geçmişe yönelik eleştiri: should have + V3."],["He ___ the money; he was with me all day.","can't have stolen",["must have stolen","should have stolen","needn't have stolen"],"Geçmişte imkânsız: can't have + V3."],["I'm not sure why she's late. She ___ the bus.","might have missed",["must miss","should have missed","can't miss"],"Emin olunmayan geçmiş olasılık: might have + V3."],["We ___ so much food; only three guests came.","needn't have cooked",["mustn't have cooked","can't have cooked","shouldn't cook"],"Gereksiz yere yapılmış iş: needn't have + V3."],["You ___ told me earlier.","should have",["should","must have to","could"],"Geçmiş tavsiye: should have + V3."],["She isn't in her office. She ___ gone home.","must have",["must","should","can have"],"Geçmişe güçlü çıkarım: must have + V3."]]},{"id":"reported-2","lv":"B2","en":"Reported questions and commands","tr":"Dolaylı sorular ve emirler","p":["Dolaylı soruda soru düzeni bozulur, düz cümle düzeni gelir (yardımcı fiil öznenin arkasına geçer). Evet/hayır soruları if/whether ile aktarılır.","Emir ve ricalar: tell/ask + kişi + (not) to + V1."],"f":["She asked me where I lived. · He asked if I was ready. · He told me to sit down."],"e":[["\"Where do you work?\" → She asked me where I worked.","Nerede çalıştığımı sordu."],["\"Don't touch it!\" → He told me not to touch it.","Ona dokunmamamı söyledi."]],"q":[["She asked me where ___.","I lived",["did I live","do I live","I do live"],"Dolaylı soruda düz cümle düzeni: where I lived."],["He asked me ___ I could speak French.","if",["that","what","which"],"Evet/hayır sorusu: if/whether."],["The teacher told us ___ talk during the exam.","not to",["don't","to not to","not"],"Olumsuz emir: told us not to + V1."],["I wonder what time ___.","the meeting starts",["does the meeting start","starts the meeting","is the meeting start"],"\"I wonder\" sonrası düz cümle düzeni gelir."],["My mother asked me ___ the dishes.","to wash",["wash","washing","that wash"],"ask + kişi + to + V1."],["\"Where do you live?\" she asked. → She asked me where I ___.","lived",["live","do live","was live"],"Dolaylı soruda düz düzen + zaman kayması."],["\"Don't be late,\" he said. → He told me ___ late.","not to be",["to not be","don't be","not be"],"Emir: told me not to + V1."]]},{"id":"relative-2","lv":"B2","en":"Non-defining relative clauses and prepositions","tr":"Tanımlamayan ilgi cümleleri ve edatlı yapılar","p":["Tanımlamayan ilgi cümleleri ek bilgi verir ve virgülle ayrılır; bu cümlelerde \"that\" kullanılamaz.","Edatlı yapılarda edat başa gelebilir: in which, to whom, of which. Bütün bir cümleye gönderme yaparken \", which\" kullanılır."],"f":["My brother, who lives in Izmir, ... · the house in which I grew up · He passed, which surprised everyone."],"e":[["Istanbul, which is the largest city in Turkey, has two continents.","Türkiye'nin en büyük şehri olan İstanbul iki kıtaya yayılır."],["The person to whom I spoke was helpful.","Konuştuğum kişi yardımcı oldu."]],"q":[["My father, ___ is 60, still works every day.","who",["that","which","whom"],"Virgüllü (tanımlamayan) cümlede \"that\" kullanılmaz; insan → who."],["He didn't call me back, ___ made me angry.","which",["that","what","who"],"Bütün cümleye gönderme: \", which\"."],["The company for ___ she works is very successful.","which",["that","whom","who"],"Edattan sonra nesne için \"which\"."],["The woman to ___ I sent the email never replied.","whom",["who","which","that"],"Edattan sonra insan için \"whom\"."],["The students, most of ___ were tired, went home early.","whom",["who","them","which"],"\"most of whom\": insanlar için edatlı yapı."],["Paris, ___ is the capital of France, is beautiful.","which",["who","where","that"],"Tanımlamayan, virgüllü: which (that olmaz)."],["The people with ___ I work are kind.","whom",["who","which","whose"],"Edat + whom (resmi)."]]},{"id":"inversion","lv":"C1","en":"Inversion after negative adverbials","tr":"Devrik yapı (Inversion)","p":["Olumsuz veya kısıtlayıcı bir zarf cümlenin başına geldiğinde, soru cümlesindeki gibi yardımcı fiil öznenin önüne geçer. Resmi ve akademik dilde vurgu için kullanılır.","Kalıplar: Never / Rarely / Seldom + aux + özne · Not only ... but also · Hardly/Scarcely ... when · No sooner ... than · Only then / Only after · Not until · Under no circumstances."],"f":["Never have I seen ... · No sooner had I arrived than ... · Not only did he ..., but he also ..."],"e":[["Never have I seen such a beautiful view.","Hiç bu kadar güzel bir manzara görmemiştim."],["No sooner had we sat down than the phone rang.","Oturur oturmaz telefon çaldı."]],"q":[["Rarely ___ such an honest politician.","do we meet",["we meet","we do meet","meet we"],"Olumsuz zarf başa gelince devrik: do we meet."],["No sooner had he left ___ it started to rain.","than",["when","then","that"],"\"No sooner ... than\" kalıbı."],["Not only ___ the exam, but she also got the highest score.","did she pass",["she passed","she did pass","passed she"],"\"Not only\" sonrası devrik: did she pass."],["Hardly had I closed my eyes ___ the alarm went off.","when",["than","then","that"],"\"Hardly/Scarcely ... when\" kalıbı."],["Under no circumstances ___ leave the building during the test.","should you",["you should","you must","must"],"Devrik yapı: should you leave."],["Never ___ such a mess.","have I seen",["I have seen","I saw","have seen I"],"\"Never\" sonrası devrik: have I seen."],["Not only ___ late, but he also forgot the files.","was he",["he was","he is","was"],"Not only + devrik."]]},{"id":"cleft","lv":"C1","en":"Cleft sentences and emphasis","tr":"Vurgu cümleleri (Cleft sentences)","p":["Cümlenin bir bölümünü öne çıkarmak için: It is/was ... that/who ... ve What ... is/was ... yapıları kullanılır. Olumlu cümlede vurgu için do/does/did + V1 kullanılabilir."],"f":["It was Ali who broke the window. · What I need is a holiday. · I did tell you!"],"e":[["It was in 1923 that the Republic was founded.","Cumhuriyetin kurulduğu yıl 1923'tü."],["What surprised me was his answer.","Beni şaşırtan şey onun cevabıydı."]],"q":[["It was my sister ___ found the lost keys.","who",["which","what","where"],"İnsan vurgulanıyor: It was ... who."],["___ I really want is a quiet weekend.","What",["That","Which","It"],"\"What ... is\" vurgu kalıbı."],["It was only after the meeting ___ I understood the problem.","that",["which","when","what"],"\"It was ... that\" kalıbı."],["I ___ lock the door; I'm sure of it.","did",["do","have","was"],"Geçmişte vurgu: did + V1."],["What the government should do ___ invest in education.","is",["are","it is","that"],"\"What ... is + V1\" kalıbı."],["___ I need is a quiet room.","What",["That","Which","It what"],"\"What I need is...\""],["It was in 1969 ___ they landed on the moon.","that",["which","when that","what"],"It was X that..."]]},{"id":"subjunctive","lv":"C1","en":"The subjunctive and \"it's time\"","tr":"Subjunctive (istek kipi) ve it's (high) time","p":["suggest, recommend, insist, demand, propose ile ve \"It is essential/vital/important that\" ile sonraki cümlede fiil özneye bakmadan yalın halde gelir (should de kullanılabilir).","\"It's (high) time + özne + past simple\": bir şeyin artık yapılması gerektiğini anlatır. \"would rather + özne + past simple\": başkası için tercih."],"f":["suggest that he go · It is essential that she be · It's time we left · I'd rather you stayed"],"e":[["The doctor recommended that he stop smoking.","Doktor sigarayı bırakmasını önerdi."],["It's high time you found a job.","Artık bir iş bulmanın zamanı geldi."]],"q":[["The committee insisted that the report ___ before Friday.","be submitted",["is submitted","was submitted","will be submitted"],"Subjunctive: fiil yalın halde (be submitted)."],["It is vital that every student ___ the safety rules.","follow",["follows","followed","will follow"],"\"It is vital that\" + yalın fiil."],["It's time we ___ home; it's very late.","went",["go","will go","have gone"],"\"It's time + özne + past simple\"."],["I'd rather you ___ smoke in the car.","didn't",["don't","won't","not"],"\"would rather + özne + past simple\" (olumsuz: didn't)."],["She suggested that we ___ a taxi.","take",["took","will take","taking"],"\"suggest that\" + yalın fiil."],["The doctor recommended that he ___ in bed.","stay",["stays","stayed","staying"],"Öneri: (should) stay / subjunctive."],["It's time we ___ home.","went",["go","gone","going"],"\"It's time\" + past."]]},{"id":"participle","lv":"C1","en":"Participle clauses","tr":"Sıfat-fiil ve zarf-fiil cümlecikleri (Participle clauses)","p":["Aynı özneye sahip iki cümle kısaltılabilir. Etken anlam → V-ing (Walking home, I saw...). Edilgen anlam → V3 (Built in 1900, the house...). Önce tamamlanmış eylem → Having + V3."],"f":["V-ing ..., · V3 ..., · Having + V3 ..., · Having been + V3 ...,"],"e":[["Having finished her work, she went home.","İşini bitirdikten sonra eve gitti."],["Written in simple English, the book is easy to read.","Sade bir İngilizceyle yazıldığı için kitap kolay okunuyor."]],"q":[["___ the email, I realised I had made a mistake.","Having sent",["Sent","Being sent","Have sent"],"Önce tamamlanmış etken eylem: Having + V3."],["___ in 1453, the city became the capital of the empire.","Conquered",["Conquering","Having conquered","Conquer"],"Edilgen anlam (şehir fethedildi): V3."],["___ along the beach, we saw a group of dolphins.","Walking",["Walked","Having walked","To walk"],"Eş zamanlı etken eylem: V-ing."],["___ by the noise, the baby started crying.","Frightened",["Frightening","Having frightening","Frighten"],"Bebek korkutuldu (edilgen): V3."],["Not ___ what to say, he remained silent.","knowing",["known","having know","to know"],"Olumsuz participle: Not + V-ing."],["___ the door, she realised she had forgotten her keys.","Closing",["Closed","Close","To closing"],"Etken participle: Closing..."],["The man ___ to hospital was a tourist.","taken",["taking","took","take"],"Edilgen: taken."]]},{"id":"conditionals-3","lv":"C1","en":"Advanced conditionals (inverted, unless, but for)","tr":"İleri koşul yapıları","p":["\"If\" atılarak devrik koşul kurulabilir: Had I known (= If I had known), Were I you (= If I were you), Should you need (= If you need).","Diğer bağlaçlar: unless (= if not), provided/providing that, as long as, on condition that, otherwise, but for / without (= olmasaydı)."],"f":["Had + özne + V3 · Were + özne · Should + özne + V1 · But for + isim"],"e":[["Had I known about the problem, I would have helped.","Sorunu bilseydim yardım ederdim."],["Should you have any questions, please contact us.","Herhangi bir sorunuz olursa lütfen bize ulaşın."]],"q":[["___ I known you were ill, I would have visited you.","Had",["If","Were","Should"],"Devrik 3. tip: Had I known."],["___ you need further information, please call our office.","Should",["Had","Were","Would"],"Devrik 1. tip: Should you need."],["You won't improve ___ you practise every day.","unless",["if","provided","as long as"],"\"unless\" = eğer ... -mezsen."],["___ your help, I would never have finished the project.","But for",["Unless","Despite","In case"],"\"But for\" = (yardımın) olmasaydı."],["___ I in your position, I would accept the offer.","Were",["Was","Had","Should"],"Devrik 2. tip: Were I."],["___ the funding, the lab would close.","But for",["Unless for","Despite","Because"],"But for = olmasa..."],["Should you need help, ___ the desk.","call",["calling","called","to call"],"Devrik koşul: Should you need..."]]},{"id":"ellipsis","lv":"C1","en":"Substitution and ellipsis (so, neither, do so)","tr":"Yerine koyma ve eksiltme (so do I, neither, so / not)","p":["Tekrardan kaçınmak için: So + aux + özne (ben de), Neither/Nor + aux + özne (ben de ... -mem). \"I think so / I hope not\" kalıplarında \"so/not\" bir cümlenin yerini tutar."],"f":["So do I · Neither can she · I hope so · I'm afraid not"],"e":[["\"I love jazz.\" \"So do I.\"","\"Cazı severim.\" \"Ben de.\""],["\"I can't swim.\" \"Neither can I.\"","\"Yüzemem.\" \"Ben de yüzemem.\""]],"q":[["\"I've never been to Japan.\" \"___ I.\"","Neither have",["So have","Neither am","So am"],"Olumsuz cümleye katılma, present perfect: Neither have I."],["\"She works in a bank.\" \"So ___ her husband.\"","does",["is","has","do"],"Geniş zamanda tekil özneyle: So does."],["\"Will it rain tomorrow?\" \"I hope ___. The garden needs water.\"","so",["not","it","yes"],"Olumlu beklenti: I hope so."],["\"Is the shop open on Sunday?\" \"I'm afraid ___.\"","not",["no","so","none"],"Olumsuz cevap kalıbı: I'm afraid not."],["He promised to help, and he did ___.","so",["it","that","too"],"\"did so\" = söz verdiği şeyi yaptı."],["I don't like tea. ___ .","Neither do I",["So I don't","Neither I don't","I neither"],"Olumsuz katılma: Neither do I."],["She can swim, and so ___ her brother.","can",["does","is","swims"],"\"so + yardımcı + özne\"."]]},{"id":"time-clauses","lv":"YDS","en":"Tense agreement and time clauses","tr":"Zaman uyumu ve zaman bağlaçları (YDS)","p":["YDS'nin en sık sorduğu konudur. Zaman bağlaçlarından (when, as soon as, until, before, after, by the time, once) sonra gelecek anlamı için will kullanılmaz; present simple veya present perfect gelir.","Geçmişte: by the time + past simple → ana cümle past perfect. Gelecekte: by the time + present simple → ana cümle future perfect. \"since\" + past simple → ana cümle present perfect."],"f":["by the time + V2, had + V3 · by the time + V1, will have + V3 · since + V2, have + V3"],"e":[["By the time the ambulance arrived, the patient had lost a lot of blood.","Ambulans geldiğinde hasta çok kan kaybetmişti."],["I will call you as soon as I arrive.","Varır varmaz seni arayacağım."]],"q":[["By the time the rescue team reached the village, the floodwaters ___ much of the farmland.","had destroyed",["have destroyed","destroy","will destroy"],"\"by the time + past simple\" → ana cümle past perfect."],["The results will be announced as soon as all the data ___ analysed.","has been",["will be","would be","had been"],"Zaman bağlacından sonra will gelmez; present perfect edilgen: has been analysed."],["Since the industrial revolution began, global temperatures ___ steadily.","have risen",["rose","had risen","are rising"],"\"since + past simple\" → ana cümle present perfect."],["By the time the new law comes into force, many companies ___ their policies.","will have changed",["have changed","had changed","changed"],"Gelecekte \"by the time + V1\" → future perfect."],["The researchers did not publish their findings until they ___ the experiment several times.","had repeated",["have repeated","repeat","will repeat"],"Geçmişte \"until\" ile önce tamamlanan eylem: had repeated."],["Once the committee ___ a decision, the results will be announced.","has made",["will make","had made","makes"],"\"once\" zaman bağlacından sonra will gelmez; present perfect uygun."],["After she ___ the documents, she left the office.","had signed",["has signed","signs","will sign"],"Geçmişte \"after\" ile önce biten eylem: past perfect."],["I will call you as soon as I ___ home.","arrive",["will arrive","arrived","am arriving"],"\"as soon as\" sonrası present, gelecek anlam."],["By the time she arrived, we ___ dinner.","had finished",["have finished","finished","finish"],"Önce biten eylem: past perfect."]]},{"id":"adverbial","lv":"YDS","en":"Adverbial clauses: contrast, reason, result","tr":"Zarf cümlecikleri: zıtlık, sebep, sonuç (YDS)","p":["Zıtlık: although/though/even though + cümle; despite/in spite of + isim/V-ing; whereas/while = oysa (iki durumu karşılaştırır).","Sebep: because/since/as + cümle; because of/due to/owing to + isim. Sonuç: so + sıfat + that; such + (a) + sıfat + isim + that; so that = -sın diye (amaç)."],"f":["although + clause · despite + noun · so ... that · such ... that · so that + can/could"],"e":[["Despite the heavy rain, the match continued.","Şiddetli yağmura rağmen maç devam etti."],["The test was so difficult that nobody passed.","Sınav o kadar zordu ki kimse geçemedi."]],"q":[["___ the treatment is expensive, many patients prefer it because of its success rate.","Although",["Despite","Because of","In spite of"],"Arkasından tam cümle var ve zıtlık bildiriyor: Although."],["___ the lack of funding, the project was completed on time.","Despite",["Although","Even though","Whereas"],"Arkasından isim öbeği geliyor: Despite."],["The new drug was ___ effective that doctors began prescribing it widely.","so",["such","too","very"],"\"so + sıfat + that\"."],["Some species thrive in cold climates, ___ others can only survive in warm regions.","whereas",["because","so that","despite"],"İki durumu karşılaştırma: whereas (oysa)."],["The flight was cancelled ___ the severe weather conditions.","due to",["because","although","so that"],"Arkasından isim öbeği gelen sebep: due to."],["She saved money ___ she could study abroad.","so that",["such that","because of","despite"],"Amaç: so that + could."],["___ being expensive, the treatment is widely used.","In spite of",["Although","Even though","Whereas"],"\"In spite of\" + V-ing / isim."],["It was ___ a difficult exam that almost nobody finished it.","such",["so","too","very"],"\"such a + sıfat + isim + that\"."],["___ the rain, the match continued.","Despite",["Although","Because","So"],"Despite + isim."],["She left early ___ she could catch the train.","so that",["despite","although","whereas"],"Amaç: so that."]]},{"id":"conjunctions","lv":"YDS","en":"Linkers and transitions","tr":"Bağlaçlar ve geçiş ifadeleri (YDS)","p":["Cümle başı geçiş ifadeleri noktalı virgül/noktadan sonra gelir ve virgül alır: However, Nevertheless, Moreover, Furthermore, Therefore, Consequently, In contrast, Likewise, Otherwise.","Koşul bağlaçları: provided that / as long as (şartıyla), unless (-medikçe), in case (ihtimaline karşı), even if (-se bile). Anlam ilişkisini (zıtlık mı, ekleme mi, sonuç mu) önce tespit et."],"f":["Zıtlık: however, nevertheless · Ekleme: moreover, furthermore · Sonuç: therefore, thus, consequently"],"e":[["The method is cheap; however, it is not very accurate.","Yöntem ucuz; ancak çok doğru değil."]],"q":[["Solar energy is clean and renewable; ___, it is not available at night.","however",["moreover","therefore","likewise"],"İki cümle arasında zıtlık: however."],["The company lost its biggest client. ___, it had to lay off many workers.","Consequently",["Nevertheless","However","In contrast"],"Sebep-sonuç ilişkisi: Consequently."],["Regular exercise strengthens the heart. ___, it reduces stress.","Moreover",["However","Otherwise","Instead"],"Olumlu bir bilgiye ek: Moreover."],["You can borrow my car ___ you return it by Sunday.","provided that",["unless","whereas","even though"],"Şart: provided that."],["Take an umbrella ___ it rains later.","in case",["unless","so that","although"],"İhtimale karşı: in case."],["The patient will not recover ___ he receives proper treatment.","unless",["if","provided that","as long as"],"\"-medikçe\": unless."],["The evidence is limited; ___, the hypothesis remains useful.","nevertheless",["therefore","moreover","likewise"],"Zıtlık: nevertheless."],["Leave early; ___, you will miss the last train.","otherwise",["however","moreover","therefore"],"Aksi halde: otherwise."],["The study is small; ___, the results are useful.","nevertheless",["therefore","because","so that"],"Zıtlık bağlacı: nevertheless."],["He was tired; he kept working, ___.","though",["despite","however he","because"],"Cümle sonu though."]]},{"id":"noun-clauses","lv":"YDS","en":"Noun clauses (that, whether, wh-, the fact that)","tr":"İsim cümlecikleri (Noun clauses)","p":["Bir cümle, başka bir cümlenin öznesi ya da nesnesi olabilir. that (... olduğunu), whether (... olup olmadığını), what/how/why (ne/nasıl/neden ... olduğunu), the fact that (... olduğu gerçeği).","Wh- ile başlayan isim cümleciklerinde soru düzeni yoktur: I don't know where he lives (NOT where does he live)."],"f":["that + clause · whether (or not) · what/why/how + özne + fiil · the fact that"],"e":[["What surprised scientists was how quickly the virus spread.","Bilim insanlarını şaşırtan şey virüsün ne kadar hızlı yayıldığıydı."],["It is not clear whether the drug is safe.","İlacın güvenli olup olmadığı belli değil."]],"q":[["Researchers are still trying to understand ___ some people are more resistant to the disease.","why",["that","what","whether or not"],"\"neden ... olduğunu\" anlamı: why."],["___ the climate is changing is accepted by most scientists.","That",["What","Whether","If"],"\"İklimin değiştiği\" (gerçek bir bilgi) özne: That."],["It is uncertain ___ the new policy will reduce unemployment or not.","whether",["that","what","which"],"\"or not\" ile \"olup olmadığı\": whether."],["___ he apologised did not change the committee's decision.","The fact that",["What","Whether","That fact"],"\"... olduğu gerçeği\": The fact that."],["We need to find out ___ caused the system failure.","what",["that","whether","which that"],"Neyin sebep olduğu (özne yok, what özne): what."],["I wonder ___ the results can be trusted.","whether",["what","which","who"],"\"olup olmadığı\": whether."],["___ remains unclear is how the virus entered the hospital.","What",["That","Whether","Which"],"Cümlenin öznesi \"ne olduğu\": What remains unclear."],["I wonder ___ the results are reliable.","whether",["that if","what if","despite"],"whether + cümle."],["The fact ___ she resigned surprised us.","that",["which","what","if"],"the fact that."]]},{"id":"reduced-relative","lv":"YDS","en":"Reduced relative clauses","tr":"Kısaltılmış ilgi cümleleri (YDS)","p":["who/which + be kısaltılabilir: etken anlam → V-ing (the man standing there), edilgen anlam → V3 (the data collected in 2020). \"the first/last/only + to + V1\" kalıbı da sık sorulur."],"f":["the people living here · the methods used · the first woman to win"],"e":[["The questions asked in the interview were difficult.","Mülakatta sorulan sorular zordu."],["Marie Curie was the first woman to win a Nobel Prize.","Marie Curie Nobel kazanan ilk kadındı."]],"q":[["The data ___ in the survey were analysed by experts.","collected",["collecting","to collect","collects"],"Veriler toplandı (edilgen): collected."],["Students ___ in the dormitory must follow the rules.","living",["lived","live","to living"],"Öğrenciler yaşıyor (etken): living."],["Neil Armstrong was the first person ___ on the moon.","to walk",["walking","walked","who walk"],"\"the first + to + V1\"."],["Most of the products ___ in this factory are exported.","manufactured",["manufacturing","manufacture","to manufacturing"],"Ürünler üretiliyor (edilgen): manufactured."],["The number of people ___ from obesity has increased dramatically.","suffering",["suffered","suffer","to suffered"],"İnsanlar acı çekiyor (etken): suffering."],["The only scientist ___ the award was from Sweden.","to receive",["receiving","received","who receive"],"\"the only + to + V1\"."],["Buildings ___ in the 19th century need careful restoration.","constructed",["constructing","construct","to constructing"],"Binalar inşa edildi (edilgen): constructed."],["The data ___ in the appendix support the claim.","presented",["presenting","present","presents"],"Kısaltılmış edilgen: presented."],["Anyone ___ to j ch + tekil isim."]]},{"id":"prepositions-yds","lv":"YDS","en":"Dependent prepositions","tr":"Fiil/sıfat + edat kalıpları (YDS)","p":["YDS'de kelime ile birlikte kullanılan edat sıkça sorulur: rely on, consist of, result in, result from, contribute to, account for, be aware of, be responsible for, be capable of, in terms of, in addition to, on behalf of."],"f":["depend on · consist of · result in (sonuç) / result from (sebep) · contribute to · be exposed to"],"e":[["The success of the project depends on funding.","Projenin başarısı finansmana bağlıdır."]],"q":[["The committee consists ___ seven experts.","of",["in","from","on"],"consist of = -den oluşmak."],["Air pollution can contribute ___ respiratory diseases.","to",["in","for","on"],"contribute to = katkıda bulunmak / yol açmak."],["The accident resulted ___ the driver's carelessness.","from",["in","to","of"],"result from = -den kaynaklanmak (sebep)."],["Poor diet may result ___ serious health problems.","in",["from","of","to"],"result in = ile sonuçlanmak (sonuç)."],["Many developing countries rely heavily ___ agriculture.","on",["in","of","to"],"rely on = -e dayanmak, güvenmek."],["Workers who are exposed ___ chemicals must wear protective clothing.","to",["with","at","from"],"be exposed to = -e maruz kalmak."],["She spoke ___ behalf of the patients' association.","on",["in","at","for"],"\"on behalf of\" = adına."],["The report is written ___ terms of cost, not quality.","in",["on","at","for"],"\"in terms of\" = açısından."],["The findings are consistent ___ earlier studies.","with",["to","of","on"],"\"consistent with\"."],["She succeeded ___ finishing the report on time.","in",["at","on","for"],"\"succeed in + V-ing\"."]]},{"id":"comparison-yds","lv":"YDS","en":"Advanced comparison structures","tr":"İleri karşılaştırma yapıları (YDS)","p":["the + comparative ..., the + comparative (ne kadar ... o kadar). as + sıfat + as (kadar). twice/three times as ... as (iki/üç kat). not as/so ... as. far/much/considerably + comparative (çok daha)."],"f":["The more you read, the more you learn. · twice as large as · much more efficient than"],"e":[["The earlier you start, the better your results will be.","Ne kadar erken başlarsan sonuçların o kadar iyi olur."]],"q":[["The more you practise, the ___ you become.","more confident",["most confident","confident","confidently"],"\"The more ..., the more ...\" kalıbı."],["This new engine is ___ more efficient than the old one.","much",["very","so","too"],"Karşılaştırmayı güçlendirme: much more."],["The population of the city is twice as large ___ it was in 1990.","as",["than","so","like"],"\"twice as ... as\" kalıbı."],["The problem is not ___ serious as the media suggests.","as",["more","so much","such"],"\"not as ... as\"."],["___ the population grows, the greater the demand for water becomes.","The more",["More","As more","The most"],"\"The more ..., the greater ...\" kalıbı."],["This method is far ___ than the previous one.","more reliable",["reliable","most reliable","reliably"],"\"far + comparative\"."],["The new lab is three times as large ___ the old one.","as",["than","so","that"],"\"three times as ... as\"."],["The more you practise, ___ you become.","the better",["better","the best","more better"],"the more..., the better..."],["This method is ___ as reliable as the old one.","twice",["two times more","double than","as twice"],"\"twice as + adj + as\"."]]},{"id":"gerund-yds","lv":"YDS","en":"Gerunds and infinitives in academic contexts","tr":"Gerund ve infinitive: akademik kullanımlar (YDS)","p":["-ing alanlar: avoid, consider, involve, risk, deny, postpone, be worth, it's no use, look forward to, object to, be committed to. (Son üçünde \"to\" bir edattır!)","to + V1 alanlar: aim, manage, fail, tend, seem, attempt, be likely to, in order to. Anlam değiştirenler: stop doing (bırakmak) / stop to do (yapmak için durmak); remember doing / remember to do."],"f":["look forward to doing · be committed to improving · tend to do · fail to do"],"e":[["The government is committed to reducing poverty.","Hükümet yoksulluğu azaltmaya kararlıdır."]],"q":[["Scientists have failed ___ a cure for the disease so far.","to find",["finding","find","to finding"],"\"fail\" sonrası to + V1."],["The project involves ___ data from thousands of patients.","collecting",["to collect","collect","collected"],"\"involve\" sonrası V-ing."],["We look forward to ___ your proposal.","receiving",["receive","received","be receiving"],"\"look forward to\" — buradaki \"to\" edat, V-ing gelir."],["People tend ___ more when they are stressed.","to eat",["eating","eat","to eating"],"\"tend\" sonrası to + V1."],["It is worth ___ that the study had a small sample size.","noting",["to note","note","noted"],"\"be worth\" sonrası V-ing."],["He stopped ___ a cigarette, then continued walking.","to smoke",["smoking","smoke","smoked"],"Sigara içmek için durdu (amaç): stop to do."],["The board objected to ___ the factory without a vote.","closing",["close","to close","closed"],"\"object to\" — to edattır, V-ing gelir."],["Remember ___ the windows before you leave.","to lock",["locking","lock","locked"],"Yapılacak işi hatırla: remember to do."],["The committee objected to ___ the deadline.","postponing",["postpone","postponed","to postpone"],"\"object to + V-ing\"."],["It is worth ___ the appendix carefully.","reading",["to read","read","to reading"],"\"worth + V-ing\"."]]}]</script>

<script id="exam" type="application/json">[{"id":"c1","type":"cloze","lv":"B2","topic":"Sağlık","p":"Regular physical activity is one of the most effective ways to protect long-term health. Studies show that adults who exercise for at least 150 minutes a week are significantly less likely (1)___ heart disease and type 2 diabetes. Exercise also benefits mental health, (2)___ it reduces stress hormones and stimulates the production of chemicals that improve mood. (3)___ these well-known advantages, a large proportion of the population remains inactive. Experts believe this is partly (4)___ modern jobs, which require people to sit for long hours. They therefore recommend (5)___ short breaks to stand up and move around during the working day.","qs":[{"s":"(1)","a":"to develop","x":["developing","develop","to developing","developed"],"w":"\"be likely to + V1\" kalıbı: less likely to develop.","t":"fiilyapi"},{"s":"(2)","a":"as","x":["although","unless","whereas","so that"],"w":"İkinci kısım ilk kısmın sebebini veriyor: \"as\" (çünkü).","t":"kelime"},{"s":"(3)","a":"Despite","x":["Because of","Although","Instead of","In addition to"],"w":"Arkasından isim öbeği geliyor ve zıtlık var: Despite.","t":"bag"},{"s":"(4)","a":"due to","x":["in spite of","in order to","as well as","according to"],"w":"Sebep bildiren edat öbeği: due to modern jobs.","t":"bag"},{"s":"(5)","a":"taking","x":["to take","take","to taking","taken"],"w":"\"recommend\" fiilinden sonra -ing gelir: recommend taking.","t":"fiilyapi"}]},{"id":"c2","type":"cloze","lv":"C1","topic":"Çevre","p":"Deforestation is a major contributor to climate change. Trees absorb carbon dioxide from the atmosphere and store it in their wood, leaves and roots; (1)___, when forests are cleared or burned, much of this stored carbon is released back into the air. The Amazon rainforest, (2)___ is often described as the lungs of the planet, has lost around a fifth of its area in the last fifty years. Scientists warn that if deforestati ,"t":"edat"}]},{"id":"c15","type":"cloze","lv":"B2","topic":"Teknoloji","p":"Digital maps have made it ordinary to find a street in a city one has never visited. The same tools, (1)___, can also weaken the memory of routes. Studies of drivers who always follow a screen show that they later (2)___ fewer landmarks than those who used a paper map. This does not mean that digital maps should be abandoned; they save time and help people (3)___ reduced mobility. It does mean that schools might still teach basic map reading, (4)___ that a dead battery or a missing signal will not leave a student helpless. Technology works best (5)___ it adds to a skill rather than silently replacing it.","qs":[{"s":"(1)","a":"however","x":["therefore","likewise","otherwise","meanwhile"],"w":"Kolaylık vs bellek zayıflaması: however.","t":"bag"},{"s":"(2)","a":"recall","x":["recalls","recalling","to recall","recalled"],"w":"\"they later recall\" (show that + present).","t":"kelime"},{"s":"(3)","a":"with","x":["of","at","by","from"],"w":"\"people with reduced mobility\".","t":"edat"},{"s":"(4)","a":"so","x":["because","despite","unless","although"],"w":"Amaç sonucu: so that...","t":"bag"},{"s":"(5)","a":"when","x":["during","despite","unless","until"],"w":"\"works best when it adds...\"","t":"kelime"}]},{"id":"s26","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"Unless governments invest in public transport, ___.","a":"traffic in large cities is likely to get worse","x":["traffic in large cities is likely getting worse","traffic in large cities would have got worse","traffic in large cities must have got worse","traffic in large cities has been getting worse yesterday"],"w":"Unless + present → ana cümle present/future: is likely to.","t":"kosul"}]},{"id":"s27","type":"sentcomp","lv":"C1","topic":"","p":"","qs":[{"s":"Not until the results were published ___.","a":"did the public realise how serious the shortage was","x":["the public realised how serious the shortage was","the public critic has praised the author's new book.","The book has not been reviewed by anyone.","Readers have ignored the book completely.","The author refused to publish mixed opinions."],"w":"mixed reviews = olumlu ve olumsuz eleştiriler birlikte."}]},{"id":"m18","type":"restate","lv":"B2","topic":"","p":"","qs":[{"s":"He took no notice of the warning signs.","a":"He ignored the warning signs.","x":["He wrote the warning signs himself.","He paid close attention to the warning signs.","The warning signs were removed before he arrived.","He noticed every sign except the warnings."],"w":"take no notice of = ignore."}]},{"id":"m19","type":"restate","lv":"C1","topic":"","p":"","qs":[{"s":"The two explanations are not mutually exclusive.","a":"It is possible that both explanations are correct at the same time.","x":["Only one of the explanations can ever be true.","Both explanations have already been disproved.","The explanations contradict every known fact.","Neither explanation can be discussed in public."],"w":"not mutually exclusive = ikisi birden doğru olabilir."}]},{"id":"m20","type":"restate","lv":"B2","topic":"","p":"","qs":[{"s":"Demand for the product has fallen off in recent months.","a":"Fewer people have wanted the product recently.","x":["Demand has risen sharply in recent months.","The product has just been launched.","Stores cannot keep the product in stock.","Recent months have had no effect on sales."],"w":"fall off = azalmak; fewer people have wanted aynı düşünce."}]},{"id":"p11","type":"parcomp","lv":"B2","topic":"Sağlık","p":"Handwashing with soap is one of the cheapest ways to reduce infections. ___ In places where this simple habit became common, rates of diarrhoea and some respiratory diseases fell sharply. The challenge is not the science but the water, soap and time that not every household has.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"It removes microbes from the skin before they can enter the mouth or eyes.","x":["Soap was invented only last year.","Respiratory diseases cannot be affected by hygiene.","Hospitals never ask staff to wash their hands.","Microbes disappear as soon as water is polluted."],"w":"Sonraki cümle hastalık oranlarının düşmesini anlatıyor; boşluk mekanizmayı vermeli."}]},{"id":"p12","type":"parcomp","lv":"C1","topic":"Sosyal bilimler","p":"Literacy statistics sometimes hide as much as they reveal. A person counted as literate may be able to sign a form but not to follow a written medical instruction. ___ For that reason, some researchers now test whether people can use a short text to make a practical decision, rather than asking only if they can read letters.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"Such a narrow definition overstates how ready a population is for modern public services.","x":["Signing a form is the most advanced skill in any language.","Medical instructions are always given only in pictures.","Researchers have stopped measuring literacy altogether.","Practical decisions never depend on written language."],"w":"\"For that reason\" pratik testlere geçişi açıklıyor; boşluk dar tanımın hizmetlere hazırlığı abarttığını söylemeli."}]},{"id":"p13","type":"parcomp","lv":"B2","topic":"Fen","p":"A seed bank stores samples of crop varieties at very low temperatures. If a disease or a drought destroys plants in the field, breeders can return to the stored seeds. ___ The system is a form of insurance: it does not prevent disaster, but it keeps the genetic options needed for recovery.","qs":[{"s":"Boşluğa gelebilecek cümle hangisidir?","a":"Those options include traits such as drought tolerance that might otherwise disappear.","x":["Seed banks are used only to decorate museums.","Drought cannot destroy any crop once it is planted.","Breeders never work with stored seeds.","Low temperatures kill every useful trait immediately."],"w":"\"genetic options\" bir önceki cümlede açılmalı."}]},{"id":"p14","type":"parcomp","lv":"C1","topic":"Hukuk","p":"Plea bargai
