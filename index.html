<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelime Kampı</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Layout: a study desk — sticky stat bar, then one working column; the game screen replaces the dashboard. Highlighter-pen marks the word being learned. */
:root {
  --paper: #F4F4F4;
  --surface: #FFFFFF;
  --surface-2: #ECECEC;
  --ink: #0A0A0A;
  --muted: #5E5E5E;
  --line: #DADADA;
  --accent: #2547D0;
  --accent-ink: #FFFFFF;
  --hl: #FFE14D;
  --hl-band: #FFE14D;
  --hl-ink: #2E2700;
  --good: #17845A;
  --good-soft: #DDF3E8;
  --bad: #C93C30;
  --bad-soft: #FBE3E0;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.06);
  --f-display: Georgia, "Times New Roman", ui-serif, serif;
  --f-body: "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #000000; --surface: #121212; --surface-2: #1E1E1E; --ink: #EDEDED; --muted: #A0A0A0; --line: #2C2C2C;
    --accent: #8FA6FF; --accent-ink: #000000; --hl: #F2D43A; --hl-band: rgba(242,212,58,.30); --hl-ink: #1E1A00;
    --good: #4FC98F; --good-soft: rgba(79,201,143,.16); --bad: #FF8173; --bad-soft: rgba(255,129,115,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="contrast"] {
  --paper: #000000; --surface: #000000; --surface-2: #1A1A00; --ink: #FFFFFF; --muted: #FFF176; --line: #FFE14D;
  --accent: #FFE14D; --accent-ink: #000000; --hl: #FFE14D; --hl-band: rgba(255,225,77,.34); --hl-ink: #000000;
  --good: #69F0AE; --good-soft: #003300; --bad: #FF8A80; --bad-soft: #3B0000;
  --shadow: none;
  color-scheme: dark;
}
:root[data-theme="dark"] {
  --paper: #000000; --surface: #121212; --surface-2: #1E1E1E; --ink: #EDEDED; --muted: #A0A0A0; --line: #2C2C2C;
  --accent: #8FA6FF; --accent-ink: #000000; --hl: #F2D43A; --hl-band: rgba(242,212,58,.30); --hl-ink: #1E1A00;
  --good: #4FC98F; --good-soft: rgba(79,201,143,.16); --bad: #FF8173; --bad-soft: rgba(255,129,115,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; background: none; border: 0; padding: 0; }
.brand b { font-family: var(--f-display); font-size: 21px; font-weight: 400; letter-spacing: -.01em; }
.brand b span { background-image: linear-gradient(var(--hl-band), var(--hl-band)); background-repeat: no-repeat; background-size: 100% 37%; background-position: 0 90%; padding: 0 2px; animation: hlDraw .7s .2s cubic-bezier(.6,.1,.2,1) both; }
.brand small { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stat { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 8px; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.stat svg { width: 18px; height: 18px; flex: none; }
.stat .lbl { color: var(--muted); font-weight: 600; font-size: 12px; }
.ring { --p: 0; width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(var(--good) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-items: center; flex: none; }
.ring::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); }
.tabs { display: flex; gap: 4px; min-width: 0; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 6px 12px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.tab[aria-current="true"] { background: var(--ink); color: var(--paper); }
@media (max-width: 440px) { .tabs { gap: 2px; } .tab { padding: 6px 9px; font-size: 14px; } }

main { padding-block: 22px 60px; }
.view { display: grid; gap: 22px; }
.eyebrow { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* hero */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
@media (max-width: 720px) { .hero { grid-template-columns: 1fr; } }
.greet { padding: 22px; display: grid; gap: 14px; align-content: start; }
.greet h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 4.4vw, 36px); line-height: 1.1; letter-spacing: -.015em; }
.greet p { margin: 0; color: var(--muted); max-width: 52ch; }
.rank { display: flex; align-items: center; gap: 12px; }
.rank .bar-x { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.rank .bar-x i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s; }
.rank small { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.rank b { font-size: 13.5px; }
.wotd { padding: 20px 22px; display: grid; gap: 8px; align-content: start; position: relative; }
.wotd .w { font-family: var(--f-display); font-size: 30px; line-height: 1.15; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wotd .tr { font-weight: 600; }
.wotd .syn { color: var(--muted); font-size: 13.5px; }
.hlw { background-image: linear-gradient(var(--hl-band), var(--hl-band)); background-repeat: no-repeat; background-size: 100% 38%; background-position: 0 92%; padding: 0 3px; animation: hlDraw .6s .15s cubic-bezier(.6,.1,.2,1) both; }

.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.iconbtn:hover { border-color: var(--accent); }
.iconbtn svg { width: 17px; height: 17px; }

/* level picker */
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
@media (max-width: 720px) { .levels { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 400px) { .levels { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.lvl { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 11px 9px; display: grid; gap: 6px; transition: border-color .15s, transform .15s; min-width: 0; }
.lvl:hover { transform: translateY(-1px); }
.lvl[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.lvl .code { font-family: var(--f-mono); font-weight: 600; font-size: 15px; }
.lvl .name { font-size: 11.5px; color: var(--muted); font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.prog i { display: block; height: 100%; }
.prog .m { background: var(--good); }
.prog .l { background: var(--hl); }
.lvl .num { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* modes */
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-h h2 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13.5px; }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 440px) { .modes { grid-template-columns: 1fr; } }
.mode { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 6px; align-content: start; position: relative; transition: border-color .15s, transform .15s; min-width: 0; }
.mode:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.mode:disabled { opacity: .5; cursor: not-allowed; }
.mode .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); margin-bottom: 4px; }
.mode .ic svg { width: 21px; height: 21px; }
.mode h3 { font-size: 16px; font-weight: 800; }
.mode p { margin: 0; font-size: 13px; color: var(--muted); }
.mode .badge { position: absolute; top: 14px; right: 14px; font-family: var(--f-mono); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.mode .badge.hot { background: var(--hl); color: var(--hl-ink); }
.mode.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mode.primary p { color: color-mix(in srgb, var(--paper) 75%, transparent); }
.mode.primary .ic { background: color-mix(in srgb, var(--paper) 14%, transparent); }

.tips { padding: 18px 20px; display: grid; gap: 10px; }
.tips ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--muted); font-size: 13.5px; }
.tips b { color: var(--ink); }

/* game */
.game { max-width: 640px; margin: 0 auto; width: 100%; display: grid; gap: 16px; }
.ghead { display: flex; align-items: center; gap: 12px; }
.gprog { flex: 1; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.gprog i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .35s; }
.combo { font-family: var(--f-mono); font-weight: 600; font-size: 13px; color: var(--muted); min-width: 64px; text-align: right; }
.combo.on { color: var(--accent); }
.timer { font-family: var(--f-mono); font-weight: 600; font-size: 15px; min-width: 44px; text-align: right; }
.qcard { padding: 26px 22px 22px; display: grid; gap: 18px; text-align: center; }
.qtype { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.qword { font-family: var(--f-display); font-size: clamp(30px, 7vw, 44px); line-height: 1.12; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; word-break: break-word; }
.qtr { font-size: clamp(20px, 4.6vw, 26px); font-weight: 700; line-height: 1.3; }
.qmeta { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.pill.lv { font-family: var(--f-mono); }
.pill.yds { background: var(--hl); color: var(--hl-ink); }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15.5px; transition: border-color .12s, background .12s; min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt kbd { font-family: var(--f-mono); font-size: 12px; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); flex: none; }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.typebox { display: grid; gap: 10px; }
.typebox input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 19px; font-weight: 600; text-align: center; }
.typebox input:focus { border-color: var(--accent); outline: none; }
.hintline { font-family: var(--f-mono); letter-spacing: .25em; color: var(--muted); font-size: 15px; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 800; background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.05); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 8px 12px; font-size: 13.5px; border-radius: 10px; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.feedback { border-radius: var(--r); padding: 16px 18px; display: grid; gap: 8px; text-align: left; animation: rise .25s ease; }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback .fh { font-weight: 800; display: flex; align-items: center; gap: 8px; }
.feedback.ok .fh { color: var(--good); }
.feedback.no .fh { color: var(--bad); }
.feedback .fw { font-family: var(--f-display); font-size: 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.feedback .fs { font-size: 13.5px; color: var(--muted); }
.feedback.unsure { background: color-mix(in srgb, var(--hl) 22%, var(--surface)); }
.feedback.unsure .fh { color: var(--ink); }
.unsure-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.tick { display: inline-flex; align-items: center; gap: 9px; border: 1.5px dashed var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14px; color: var(--muted); }
.tick:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
.tick .box { width: 18px; height: 18px; border-radius: 5px; border: 2px solid currentColor; display: grid; place-items: center; flex: none; }
.tick[aria-pressed="true"] { border-style: solid; border-color: var(--ink); color: var(--ink); background: color-mix(in srgb, var(--hl) 30%, var(--surface)); }
.tick[aria-pressed="true"] .box { background: var(--ink); border-color: var(--ink); }
.tick[aria-pressed="true"] .box::after { content: ""; width: 5px; height: 9px; border: solid var(--paper); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.tick kbd { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); }
.tick:disabled { opacity: .55; cursor: default; }
.unsure-note { flex-basis: 100%; font-size: 12.5px; color: var(--muted); }
.qcard.repeat { border-top: 4px solid var(--hl); }
.mark.un { background: var(--hl); color: var(--hl-ink); }
/* sentence questions + grammar */
.qsent { font-family: var(--f-display); font-size: clamp(19px, 4.2vw, 24px); line-height: 1.5; text-align: left; overflow-wrap: anywhere; }
.qsent .gap, .qstem .gap, .passage .gap { display: inline-block; min-width: 5.5em; border-bottom: 3px solid var(--ink); margin: 0 4px; background: var(--hl-band); border-radius: 4px 4px 0 0; height: 1.05em; vertical-align: -0.12em; }
.fsent { font-family: var(--f-display); font-size: 18px; line-height: 1.45; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; overflow-wrap: anywhere; }
b.fill { font-family: var(--f-body); font-weight: 800; background: var(--hl-band); padding: 0 4px; border-radius: 4px; }
.sentw { font-weight: 400; font-family: var(--f-display); }
.ritem[data-open] { cursor: pointer; }
.topics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .topics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .topics { grid-template-columns: 1fr; } }
.topic { padding: 14px 16px; display: grid; gap: 7px; align-content: start; min-width: 0; }
.topic .tt { display: flex; gap: 6px; flex-wrap: wrap; }
.topic h3 { font-size: 15.5px; font-weight: 800; line-height: 1.3; }
.topic .en { margin: 0; color: var(--muted); font-size: 12.5px; }
.topic .num { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.topicsheet { gap: 12px; }
.topicsheet .ttl { font-family: var(--f-display); font-weight: 400; font-size: 27px; line-height: 1.15; }
.topicsheet p { margin: 0; max-width: 62ch; }
.forms { display: grid; gap: 6px; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.forms code { font-family: var(--f-mono); font-size: 13px; white-space: normal; overflow-wrap: anywhere; }
.exs { display: grid; gap: 8px; }
.exs .ex { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-left: 3px solid var(--hl); padding-left: 10px; }
.exs .ex b { display: block; font-weight: 700; }
.exs .ex i { display: block; font-style: normal; color: var(--muted); font-size: 13.5px; }
/* YDS exam questions */
.passage { text-align: left; background: var(--surface-2); border-radius: 12px; padding: 14px 16px; max-height: 46vh; overflow: auto; font-size: 15px; line-height: 1.65; }
.passage p { margin: 0 0 8px; } .passage p:last-child { margin: 0; }
.pgap { font-weight: 800; padding: 0 5px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line); }
.pgap.cur { background: var(--hl); color: var(--hl-ink); border-color: var(--hl); }
.qstem { text-align: left; font-weight: 700; font-size: 16.5px; line-height: 1.5; overflow-wrap: anywhere; }
.dikte { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
.btn.big { font-size: 18px; padding: 16px 26px; display: inline-flex; align-items: center; gap: 8px; }
.btn.big svg { width: 20px; height: 20px; }
.opt.sel { border-color: var(--ink); background: color-mix(in srgb, var(--hl) 28%, var(--surface)); }
.mprog { flex: 1; font-size: 14px; color: var(--muted); } .mprog b { color: var(--ink); }
.timer.low { color: var(--bad); }
.mapcard { padding: 14px 16px; display: grid; gap: 12px; }
.mmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
.mq { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 0; font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; }
.mq.done { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mq.cur { outline: 2.5px solid var(--accent); outline-offset: 1px; }
.mq.flag { box-shadow: inset 0 -4px 0 var(--hl); }
.bigscore { text-align: center; font-family: var(--f-mono); font-size: 64px; font-weight: 600; line-height: 1; display: grid; gap: 6px; }
.bigscore small { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.secbars { display: grid; gap: 8px; }
.sb { display: grid; grid-template-columns: minmax(0, 11em) 1fr 3.2em; gap: 10px; align-items: center; font-size: 13.5px; }
.sbn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbbar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.sbbar i { display: block; height: 100%; border-radius: 99px; transform-origin: left; animation: grow .9s .2s cubic-bezier(.2,.7,.2,1) both; }
.sbbar i.g { background: var(--good); } .sbbar i.m { background: var(--hl); } .sbbar i.b { background: var(--bad); }
.sbv { font-family: var(--f-mono); text-align: right; }
.mockcard { padding: 20px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
@media (max-width: 720px) { .mockcard { grid-template-columns: 1fr; } }
.mockcard h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 4px 0 8px; }
.mockcard p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.mc-r.empty { display: grid; place-items: center; text-align: center; background: var(--surface-2); border-radius: 12px; padding: 16px; }
.mc-r.empty p { margin: 0; }
.mchart { height: 150px; }
/* plan, own words, weekly summary, badges */
.plan { padding: 18px 20px; display: grid; gap: 12px; }
.plan-h { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
.plan-h h2 { font-family: var(--f-display); font-weight: 400; font-size: 23px; margin-top: 4px; }
.datein { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; }

.trapw p { margin: 0; }
.trapall summary { cursor: pointer; font-weight: 700; font-size: 13.5px; margin-bottom: 8px; }
.trapline { margin: 0; font-size: 14px; text-align: center; }
/* my progress */
.kpis.mekpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 600px) { .kpis.mekpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mekpis .kpi { background: var(--surface); border: 1px solid var(--line); }
.chartcard { padding: 16px 18px 12px; display: grid; gap: 12px; }
.chart { position: relative; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; height: 170px; padding-top: 18px; }

.chart .col { position: relative; display: grid; grid-template-rows: 1fr 22px; min-width: 0; border-radius: 6px; outline-offset: 1px; }

.chart .barwrap { position: relative; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--line); }
.chart .barv { width: min(100%, 26px); background: var(--accent); border-radius: 4px 4px 0 0; }
.chart .vlab { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; color: var(--ink); transform: translateY(-2px); }
.chart .xl { font-size: 10.5px; color: var(--muted); text-align: center; align-self: end; white-space: nowrap; overflow: hidden; }

.chart .col[data-tip]:hover::after, .chart .col[data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; bottom: calc(100% - 10px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 700; padding: 5px 8px; border-radius: 8px; white-space: nowrap; z-index: 3; pointer-events: none; }
.chart .col:first-child[data-tip]:hover::after, .chart .col:first-child[data-tip]:focus-visible::after { left: 0; transform: none; }
.chart .col:last-child[data-tip]:hover::after, .chart .col:last-child[data-tip]:focus-visible::after { left: auto; right: 0; transform: none; }
.merow, .hrow { grid-template-columns: 10px minmax(0, 1fr) minmax(0, 1.5fr) auto; }
.hrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) auto; cursor: default; }
.hrow:hover { background: var(--surface); }
.counts { display: grid; justify-items: end; font-family: var(--f-mono); font-size: 12.5px; gap: 1px; white-space: nowrap; }

.c-ok { color: var(--good); } .c-no { color: var(--bad); } .c-un { color: var(--muted); }

.emptyp { padding: 20px; margin: 0; color: var(--muted); }
.savep { margin: 0; font-size: 13.5px; color: var(--muted); }
.filebtn { position: relative; overflow: hidden; display: inline-flex; align-items: center; cursor: pointer; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.filebtn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* flash intro */
.flash { padding: 30px 22px; display: grid; gap: 14px; text-align: center; }
.flash .big { font-family: var(--f-display); font-size: clamp(34px, 8vw, 50px); line-height: 1.1; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }

/* match */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.mt { padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; text-align: center; min-height: 52px; overflow-wrap: anywhere; transition: all .15s; }

/* results */
.result { padding: 26px 22px; display: grid; gap: 18px; }

.kpi b { display: block; font-family: var(--f-mono); font-size: 24px; font-variant-numeric: tabular-nums; }

.rlist { display: grid; gap: 6px; max-height: 340px; overflow: auto; padding-right: 4px; }

.mark.ok { background: var(--good); }
.mark.no { background: var(--bad); }

/* dictionary */
.dtools { display: grid; gap: 10px; }

.dcount { font-size: 13px; color: var(--muted); }

.drow .t { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.st { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid var(--line); }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: grid; place-items: end center; padding: 16px; }
@media (min-width: 640px) { .scrim { place-items: center; } }
.sheet { width: min(560px, 100%); max-height: calc(100% - 20px); overflow: auto; padding: 22px; display: grid; gap: 14px; animation: rise .2s ease; }
.sheet .big { font-family: var(--f-display); font-size: 34px; line-height: 1.1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; }

.ai p { margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 60; box-shadow: var(--shadow); animation: rise .2s ease; max-width: calc(100% - 32px); text-align: center; }
