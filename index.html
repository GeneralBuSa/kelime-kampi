iyor.","k":"anafikir"},{"s":"In common-law systems, later courts are expected to ___.","a":"follow written decisions of earlier judges","x":["ignore all previous cases","wait for a new code before deciding anything","avoid oral argument in trials","refuse to interpret statutes"],"w":"Precedent'in anlamı budur.","k":"ayrinti"},{"s":"It can be inferred that a dispute over an international contract may arise because ___.","a":"parties may not share the same idea of what counts as a binding rule","x":["judges in every country use identical procedures","civil-law courts never publish judgments","common law has disappeared from commercial life","legislatures no longer pass statutes"],"w":"Son cümle farklı geleneklerden tarafların \"bağlayıcı kural\" varsayımlarının ayrışabileceğini söylüyor.","k":"cikarim"},{"s":"The word \"precedents\" is closest in meaning to ___.","a":"earlier decisions used as a guide for later ones","x":["unofficial letters between lawyers","criminal punishments for judges","translations of foreign codes","taxes paid by the losing party"],"w":"Precedent = emsal karar.","k":"kelime"},{"s":"Which of the following is NOT true about civil-law systems according to the passage?","a":"Their courts never publish reasoned judgments.","x":["Codes passed by legislatures are their main source of rules.","Judicial opinions carry less formal weight in them.","Court judgments in them can influence later cases.","They do not exist in a pure form."],"w":"Metin, kıta Avrupası hukukunda mahkemelerin gerekçeli karar yayımladığını söylüyor; \"hiç yayımlamaz\" ifadesi yanlış.","k":"degil"}]},{"id":"r15","type":"reading","lv":"B2","topic":"Eğitim","p":"Many schools have introduced \"flipped\" classrooms, in which students watch short video lessons at home and spend class time solving problems with the teacher. Supporters claim that this model lets teachers give more individual help and encourages students to take responsibility for the first encounter with new material. Sceptics reply that the approach assumes every household has a quiet room and a reliable internet connection, which is not true for all families. Research so far is mixed: some studies report modest gains in mathematics, while others find little difference once prior achievement is taken into account. A cautious conclusion is that the method can help when schools also provide devices and study spaces, but it is not a cheap substitute for well-trained teachers.","qs":[{"s":"What is the author's overall view of flipped classrooms?","a":"They can be useful if schools reduce inequalities in access, but they do not replace good teachers","x":["They should replace all traditional lessons immediately","They work only in mathematics and never in other subjects","They have been proven to harm every student who tries them","They require no internet connection at all"],"w":"Son cümle temkinli ama şartlı bir destek: erişim sağlanırsa yardımcı olabilir, öğretmenin yerini tutmaz.","k":"tutum"},{"s":"Sceptics of the flipped classroom worry that ___.","a":"not every student has a quiet place and stable internet at home","x":["teachers refuse to solve any problems in class","video lessons are longer than ordinary school days","mathematics cannot be taught with numbers","students never watch videos when they are told to"],"w":"Şüphecilerin itirazı evdeki sessiz oda ve internet varsayımına.","k":"ayrinti"},{"s":"According to the passage, research on the method ___.","a":"does not yet show a single, clear result","x":["proves that all students improve by the same amount","has been limited to history lessons","was conducted only before the internet existed","has been rejected by every university"],"w":"\"Research so far is mixed\" ifadesi bunu söylüyor.","k":"ayrinti"},{"s":"The word \"modest\" in the passage is closest in meaning to ___.","a":"fairly small","x":["extremely large","completely false","accidental","expensive"],"w":"\"modest gains\" = sınırlı / mütevazı kazançlar.","k":"kelime"},{"s":"Which of the following is the best title for the passage?","a":"Flipped Classrooms: Promise and Limits","x":["Why Homework Should Be Banned","The Failure of Mathematics Teaching","How to Record Video Lessons","Free Internet for Every Family"],"w":"Metin yöntemin hem faydalarını hem sınırlarını tartışıyor ve temkinli bir sonuca varıyor.","k":"baslik"}]},{"id":"r16","type":"reading","lv":"C1","topic":"Psikoloji","p":"Confirmation bias is the tendency to search for, interpret and remember information in a way that supports what we already believe. In laboratory tasks, people notice evidence that fits their hypothesis more quickly than evidence that contradicts it, and they later recall the supporting details more accurately. The bias is not a sign of low intelligence; highly educated participants show it as well, sometimes even more strongly when the topic is tied to their professional identity. Social media can amplify the problem by feeding users a stream of agreeable posts. Psychologists do not claim that the bias can be eliminated, but they do recommend simple habits: actively looking for disconfirming cases, writing down the opposite explanation, and discussing findings with people who disagree. Such practices will not make anyone perfectly objective, yet they reduce the most obvious errors in judgment.","qs":[{"s":"The main purpose of the passage is to ___.","a":"explain confirmation bias and suggest limited ways of reducing its effects","x":["prove that only uneducated people make biased judgments","argue that social media should be banned","show that memory cannot store any details","claim that professional identity prevents all bias"],"w":"Tanım, laboratuvar bulgusu, eğitim düzeyinin korumaması ve azaltıcı alışkanlıklar.","k":"amac"},{"s":"Highly educated people ___.","a":"can display the bias, especially on issues linked to their professional identity","x":["are completely free of confirmation bias","never use social media","remember contradictory evidence better than supporting evidence","refuse to discuss findings with others"],"w":"Metin eğitimli katılımcıların da, meslek kimliği devreye girince bazen daha güçlü yanlılık gösterdiğini söylüyor.","k":"ayrinti"},{"s":"It can be inferred that the author thinks perfect objectivity is ___.","a":"unrealistic, though some habits can still improve judgment","x":["easily achieved by deleting social media accounts","already present in every laboratory","unnecessary for scientific work","guaranteed by high intelligence"],"w":"\"will not make anyone perfectly objective, yet they reduce...\" cümlesi.","k":"cikarim"},{"s":"The word \"disconfirming\" is closest in meaning to ___.","a":"showing that a belief may be wrong","x":["repeating a popular opinion","hiding inconvenient facts","translating a technical term","measuring intelligence"],"w":"Disconfirming evidence = hipotezi çürüten kanıt.","k":"kelime"},{"s":"The author's attitude towards the recommended habits is best described as ___.","a":"realistic: they help, but they cannot make anyone fully objective","x":["enthusiastic: they eliminate the bias completely","dismissive: they are a waste of time","critical: they make errors in judgment worse","indifferent: it does not matter whether people use them"],"w":"Son cümle tutumu veriyor: bu alışkanlıklar kimseyi kusursuz nesnel yapmaz ama en belirgin hataları azaltır.","k":"tutum"}]},{"id":"r17","type":"reading","lv":"B2","topic":"Teknoloji","p":"Open-source software is released with a licence that allows anyone to inspect, modify and share the code. Famous examples include the Linux operating system and the Firefox web browser. Companies sometimes fear that giving away code will destroy their business, yet many now earn money by selling support, hosting and extra features rather than the code itself. Volunteers and paid engineers work on the same projects, which can speed up the discovery of security flaws because thousands of eyes can read the source. The model is not automatically safer, however: if a project has few maintainers, a serious bug may sit unnoticed for years. The lesson is that openness helps when a community is active enough to use it.","qs":[{"s":"The passage mainly points out that ___.","a":"open-source licensing can work commercially and technically if a project is actively maintained","x":["Linux cannot be modified by anyone","companies never make money from open-source software","security flaws disappear as soon as code is published","volunteers are not allowed to work with paid engineers"],"w":"Hem ticari model hem de güvenlik, aktif topluluk şartına bağlanıyor.","k":"anafikir"},{"s":"According to the passage, some companies profit from open source by ___.","a":"charging for support, hosting and additional features","x":["hiding the source code from all users","refusing to fix any security flaws","selling the same licence as a secret patent","preventing anyone from sharing the code"],"w":"Destek, barındırma ve ek özellik satışı belirtiliyor.","k":"ayrinti"},{"s":"A project with few maintainers may be risky because ___.","a":"a serious bug might remain unnoticed for a long time","x":["thousands of people read every line every day","licences forbid any inspection of the code","Firefox cannot run on Linux","volunteers always introduce more bugs than they fix"],"w":"Az bakımcı varsa ciddi bir hata yıllarca fark edilmeyebilir.","k":"ayrinti"},{"s":"The word \"inspect\" is closest in meaning to ___.","a":"examine carefully","x":["delete permanently","sell at a higher price","translate into another language","compress into a smaller file"],"w":"Inspect = incelemek.","k":"kelime"},{"s":"Which of the following is the best title for the passage?","a":"Open Code: Useful When the Community Is Active","x":["Why Firefox Is the Best Browser","The End of Software Companies","How to Find Security Flaws Alone","Linux for Beginners"],"w":"Metnin vardığı ders son cümlede: açıklık ancak aktif bir topluluk varsa işe yarar.","k":"baslik"}]},{"id":"r18","type":"reading","lv":"C1","topic":"Ekonomi","p":"Central banks influence the economy mainly by changing interest rates. When they raise rates, borrowing becomes more expensive, households postpone large purchases, and firms delay investment; inflation usually slows, but unemployment may rise. When they cut rates, the opposite tends to happen. This tool is blunt. The same rate applies to a factory that needs a loan to buy machines and to a household that wants a cheaper mortgage, so the pain or the stimulus is not evenly spread. In recent years, some banks have also bought government bonds to push long-term rates down when short-term rates were already near zero. Economists still debate how large and how lasting those purchases were. What is less controversial is that central banks cannot, by themselves, fix problems such as weak education systems or ageing populations, even though markets often treat every speech by a bank governor as if it could.","qs":[{"s":"What is the author's main point?","a":"Interest-rate policy is powerful but uneven, and it cannot solve every structural problem","x":["Central banks should never change interest rates","Unemployment falls whenever rates rise","Bond purchases have been proven to last forever","Education systems are controlled by central banks"],"w":"Araç etkili ama kaba; yapısal sorunları tek başına çözemez.","k":"anafikir"},{"s":"Raising interest rates is said to ___.","a":"make borrowing costlier and often slow inflation","x":["make mortgages cheaper for every household","guarantee that firms will invest more","eliminate unemployment within a month","apply only to government bonds"],"w":"Faiz artınca borçlanma pahalılaşır ve enflasyon genelde yavaşlar.","k":"ayrinti"},{"s":"The author implies that markets sometimes ___.","a":"overestimate what a central-bank speech can achieve","x":["ignore bank governors completely","set education policy instead of schools","refuse to buy any government bonds","treat unemployment as unrelated to rates"],"w":"Piyasaların her konuşmayı her sorunu çözecekmiş gibi görmesi eleştiriliyor.","k":"cikarim"},{"s":"The word \"blunt\" here means that the tool is ___.","a":"not precise in its effects on different groups","x":["illegal in most countries","too weak to change anything","used only in wartime","identical to a tax on imports"],"w":"Aynı faiz hem fabrikayı hem ev kredisini etkiler; yani keskin/hedefe özel değildir.","k":"kelime"},{"s":"The author mentions a factory and a household in order to ___.","a":"show that interest rate changes affect different borrowers unevenly","x":["explain how factories buy machines","argue that households should avoid mortgages","prove that interest rates have no effect","describe how government bonds are purchased"],"w":"İki örnek, aynı faizin farklı borçluları farklı etkilediğini, yani aracın \"kaba\" olduğunu göstermek için veriliyor.","k":"amac"}]},{"id":"r19","type":"reading","lv":"B2","topic":"Tarih","p":"Until the nineteenth century, most people who crossed oceans did so on sailing ships that depended on the wind. The journey from Europe to North America could take six weeks or more, and storms made the timetable unpredictable. Steamships changed this pattern. By the 1870s, regular transatlantic services could complete the crossing in about ten days, and schedules became reliable enough for mail and business contracts to depend on them. Cheaper tickets also allowed millions of migrants to travel who could not have afforded the older, slower passage. Historians therefore treat the steamship not merely as a technical curiosity but as a force that reshaped labour markets on both sides of the Atlantic.","qs":[{"s":"The passage is mainly about ___.","a":"how steamships shortened ocean travel and affected migration and trade","x":["why sailing ships were more comfortable than steamships","the invention of the compass in medieval Europe","how storms have disappeared from the Atlantic","why mail is no longer sent by sea"],"w":"Süre, tarifelerin güvenilirliği ve göç/işgücü etkisi.","k":"anafikir"},{"s":"Compared with sailing ships, steamships in the 1870s ___.","a":"made the crossing faster and more predictable","x":["took six weeks even in good weather","could not carry mail","were used only for short river trips","reduced the number of people who could afford tickets"],"w":"Yaklaşık on gün ve güvenilir tarifeler.","k":"ayrinti"},{"s":"It can be inferred that labour markets changed because ___.","a":"more people could move between continents at a price they could pay","x":["storms stopped workers from ever leaving home","business contracts forbade migration","sailing ships suddenly became faster than steam","tickets became too expensive for ordinary workers"],"w":"Daha ucuz biletler milyonlarca göçmene yol açtı.","k":"cikarim"},{"s":"The word \"reliable\" is closest in meaning to ___.","a":"dependable","x":["decorative","dangerous","secret","optional"],"w":"Reliable = güvenilir, bel bağlanabilir.","k":"kelime"},{"s":"Which of the following is the best title for the passage?","a":"How Steam Shrank the Atlantic","x":["Storms at Sea in the Age of Sail","A History of the Postal Service","The Daily Life of Sailors in the 1870s","Shipbuilding in Northern Europe"],"w":"Metnin ana fikri buharlı gemilerin Atlantik yolculuğunu kısaltıp göç ve iş hayatını değiştirmesi. Fırtınalar ve posta yalnızca ayrıntı.","k":"baslik"}]},{"id":"r20","type":"reading","lv":"C1","topic":"Çevre","p":"Biodiversity is often described as a luxury that poor countries cannot afford, as if protecting species were a hobby for wealthy tourists. Ecologists reject this view. Diverse ecosystems provide services that economies already use, usually without paying a market price: wetlands filter water, insects pollinate crops, and forests reduce the force of floods. When a single crop is planted over a huge area, a pest or a drought can destroy the harvest; a mix of species makes such collapse less likely. None of this implies that conservation is free. Land set aside for wildlife cannot be used for housing or mines, so governments must weigh competing needs. The honest argument is not that biodiversity costs nothing, but that treating it as worthless is an accounting error that later generations will have to correct at a higher price.","qs":[{"s":"The author's main argument is that ___.","a":"biodiversity has economic value that is often ignored in ordinary accounting","x":["only wealthy tourists care about wild species","conservation never competes with housing or mining","planting a single crop is the safest way to avoid drought","wetlands have no practical use for people"],"w":"Ekosistem hizmetleri ve \"ücretsiz gibi görünse de değersiz saymanın hata olduğu\" tezi.","k":"anafikir"},{"s":"A landscape planted with only one crop is described as risky because ___.","a":"a pest or drought can wipe out most of the harvest","x":["insects refuse to visit any farm","forests immediately replace the crop","wetlands become more expensive","tourists stop visiting the country"],"w":"Monokültürde zararlı veya kuraklık hasadı yok edebilir.","k":"ayrinti"},{"s":"The author admits that conservation ___.","a":"involves real trade-offs with other uses of land","x":["is always cheaper than mining","requires no government decisions","can be postponed until species disappear","has a market price in every village"],"w":"\"None of this implies that conservation is free\" ve rakip ihtiyaçlar.","k":"cikarim"},{"s":"The phrase \"accounting error\" suggests that ___.","a":"current calculations leave out a cost that will appear later","x":["banks have misprinted banknotes","tourists pay too much for hotels","insects have started charging farmers","governments no longer collect taxes"],"w":"Değeri sıfır yazmak, faturayı sonraki kuşaklara bırakmaktır.","k":"kelime"},{"s":"Which of the following is NOT given in the passage as a service provided by ecosystems?","a":"attracting tourists to coral reefs","x":["filtering water","pollinating crops","reducing the force of floods","making harvests less likely to collapse"],"w":"Sulak alanlar suyu süzer, böcekler tozlaşma sağlar, ormanlar sel gücünü azaltır, tür çeşitliliği hasadı korur; turist çekmek metinde bir hizmet olarak geçmiyor.","k":"degil"}]},{"id":"r21","type":"reading","lv":"B2","topic":"Sağlık","p":"Short-sightedness, or myopia, has become far more common among children in recent decades, particularly in large East Asian cities, where in some schools more than eighty percent of teenagers now need glasses. Genes play a part, but they cannot explain such a rapid rise. Researchers increasingly point to two habits of modern childhood: long hours of close work, such as reading and using screens, and too little time outdoors. Daylight appears to be especially important, because bright light seems to slow the growth of the eyeball that causes distant objects to look blurred. In trials where schools added an extra hour of outdoor activity, fewer children developed myopia over the following years. Experts therefore recommend regular breaks from close work and at least two hours outside each day. Such advice is cheap, but it competes with crowded timetables and homework.","qs":[{"s":"The passage is mainly concerned with ___.","a":"the causes of rising myopia in children and ways to reduce it","x":["the history of wearing glasses in East Asia","the genetic causes of all eye diseases","how screens and tablets are manufactured","why homework improves children's eyesight"],"w":"Parça çocuklarda miyopinin neden arttığını ve nasıl azaltılabileceğini anlatıyor; diğer şıklar ya ayrıntı ya da metinle çelişiyor.","k":"anafikir"},{"s":"According to the passage, genes ___.","a":"cannot by themselves explain the rapid increase in myopia","x":["are the main cause of the recent rise in myopia","have no connection with eyesight","protect East Asian children from myopia","change when children spend time outdoors"],"w":"\"Genes play a part, but they cannot explain such a rapid rise\" cümlesi: genlerin payı var ama hızlı artışı tek başına açıklayamaz.","k":"ayrinti"},{"s":"It can be inferred from the school trials mentioned in the passage that ___.","a":"spending more time outdoors can help prevent myopia","x":["screens have no effect on children's eyes","glasses cure myopia permanently","indoor lighting is brighter than daylight","older children cannot develop myopia"],"w":"Okullara bir saat açık hava eklenince daha az çocukta miyopi gelişmiş; demek ki dışarıda geçen zaman koruyucu olabilir.","k":"cikarim"},{"s":"The word \"blurred\" in the passage is closest in meaning to ___.","a":"unclear","x":["bright","colourful","distant","small"],"w":"\"blurred\" = bulanık, net olmayan. \"distant\" aynı cümlede geçiyor ama nesnelerin uzak olduğunu anlatıyor, görünüşlerini değil.","k":"kelime"},{"s":"The author's view of the experts' advice is that it ___.","a":"is cheap but hard to fit into children's busy schedules","x":["is too expensive for most schools","has been shown to harm children's eyes","is already followed by most families","applies only to adults"],"w":"\"Such advice is cheap, but it competes with crowded timetables and homework\" cümlesi: ucuz ama yoğun programlarla rekabet ediyor.","k":"tutum"}]},{"id":"r22","type":"reading","lv":"C1","topic":"Fen","p":"Most of the matter in the universe does not emit or absorb light in a way that telescopes can record. Astronomers call this unseen component dark matter. The idea did not begin as a fashion: galaxies rotate so fast that the stars on their edges should fly apart if only the visible mass were holding them together. Extra unseen mass would supply the missing gravity. Alternative theories try to change the laws of gravity instead of adding matter, but they have so far had difficulty explaining a wide range of observations at once, from galaxy clusters to the pattern of the early universe. Dark matter has not been detected in a laboratory, which leaves room for doubt. Still, it remains the simplest account of several independent facts, which is why most cosmologists treat it as a working hypothesis rather than as a myth.","qs":[{"s":"What is the main idea of the passage?","a":"Dark matter is an unseen mass that currently explains several astronomical facts better than rival theories","x":["Telescopes have already photographed dark matter directly","Galaxies rotate slowly because they contain little mass","Laboratory experiments have confirmed every detail of dark matter","Cosmologists have abandoned the idea as a myth"],"w":"Gözlemlerden doğan hipotez, laboratuvarda henüz görülmemiş olsa da en yalın açıklama.","k":"anafikir"},{"s":"Galaxies pose a problem for visible mass alone because ___.","a":"they rotate too quickly for the stars at the edge to remain bound","x":["they emit too much light for telescopes to record","they contain no stars at all","they violate every law of gravity on Earth","they were formed only last year"],"w":"Kenardaki yıldızların savrulmaması için ekstra kütle gerekir.","k":"ayrinti"},{"s":"The author regards dark matter as ___.","a":"a useful working idea that is still open to laboratory tests","x":["a story that scientists tell children","a theory that has failed all astronomical tests","identical to a change in the laws of gravity","a substance already sold in pharmacies"],"w":"\"working hypothesis rather than as a myth\".","k":"ayrinti"},{"s":"The word \"independent\" here suggests that the facts ___.","a":"come from more than one kind of observation","x":["contradict one another completely","were invented by a single laboratory","cannot be checked by anyone","apply only to the Earth"],"w":"Farklı gözlem türlerinin aynı yöne işaret etmesi.","k":"kelime"},{"s":"Which of the following is NOT stated in the passage?","a":"Dark matter has been detected in several laboratory experiments.","x":["Galaxies rotate faster than visible mass alone would allow.","Alternative theories try to change the laws of gravity.","Dark matter does not emit light in a way telescopes can record.","Most cosmologists treat dark matter as a working hypothesis."],"w":"Metin karanlık maddenin laboratuvarda tespit edilmediğini söylüyor; bu şık metinle çelişiyor.","k":"degil"}]},{"id":"r23","type":"reading","lv":"B2","topic":"Sosyal bilimler","p":"A national census is more than a headcount. Governments use it to decide where to build schools, how to draw electoral districts and how to distribute funds. Because the results affect political power, every census faces disputes about who is counted and how questions are asked. Some groups are harder to reach: people without a fixed address, recent migrants, or households that distrust official forms. If they are missed, the map of need becomes distorted and services go to the wrong places. Modern censuses therefore combine traditional door-to-door visits with administrative records and online forms. The aim is not perfect knowledge of every person, which is impossible, but a picture that is fair enough to guide public decisions.","qs":[{"s":"The passage mainly explains ___.","a":"why an accurate census matters for public decisions and why some people are easily missed","x":["how to win an election without any population data","why schools should never be built in cities","how online forms have made distrust disappear","why migrants must not be included in any count"],"w":"Sayımın siyasi/idari işlevi ve eksik sayılan gruplar.","k":"anafikir"},{"s":"People without a fixed address are mentioned as ___.","a":"a group that censuses may fail to count","x":["the only group that always returns forms","officials who design electoral districts","the main source of government funds","teachers who refuse to work in new schools"],"w":"Sabit adresi olmayanlar ulaşılması zor gruplar arasında.","k":"ayrinti"},{"s":"The author suggests that a census should be judged by ___.","a":"whether it is fair enough to guide policy, not by impossible perfection","x":["whether it names every citizen in a newspaper","whether it avoids all administrative records","whether it increases distrust of official forms","whether it refuses to use online tools"],"w":"Son cümle \"fair enough\" ölçütünü koyuyor.","k":"cikarim"},{"s":"The word \"distorted\" is closest in meaning to ___.","a":"twisted so that it no longer reflects reality","x":["printed in colour","stored in a museum","translated into law immediately","kept secret from the government"],"w":"Distorted = çarpıtılmış.","k":"kelime"},{"s":"The author mentions schools and electoral districts in order to ___.","a":"show how census results are used in public decisions","x":["argue that schools should be built in rural areas","explain how votes are counted","criticise door-to-door visits","describe the history of elections"],"w":"Okullar ve seçim bölgeleri, nüfus sayımının neden bir \"kafa sayımından\" fazlası olduğunu göstermek için örnek veriliyor.","k":"amac"}]},{"id":"r24","type":"reading","lv":"C1","topic":"Arkeoloji","p":"Archaeology once concentrated on palaces, tombs and the objects of elites, partly because those remains survive more visibly and attract funding. In recent decades the field has widened. Soil samples, animal bones and the layout of ordinary houses now tell researchers how most people ate, worked and died. This shift does not make royal inscriptions useless; it places them in a broader economy of labour and food. Climate data from tree rings and ice cores can even show whether a harvest failed in the years before a city was abandoned. The result is a less romantic but more accurate past, in which collapse is rarely the work of a single battle and more often the slow outcome of drought, trade disruption and social tension arriving together.","qs":[{"s":"The passage is mainly concerned with ___.","a":"how archaeology has moved beyond elite monuments to everyday and environmental evidence","x":["why palaces should no longer be excavated","how ice cores have replaced all written inscriptions","why battles are the only cause of urban collapse","how funding has disappeared from the field"],"w":"Elit kalıntılardan gündelik yaşam ve iklim verisine genişleme.","k":"anafikir"},{"s":"Royal inscriptions are described as ___.","a":"still useful when read together with evidence about labour and food","x":["completely useless to modern researchers","the only reliable source for climate history","more romantic than accurate by definition","destroyed by tree rings"],"w":"\"does not make royal inscriptions useless; it places them in a broader economy\".","k":"ayrinti"},{"s":"The author implies that the abandonment of a city ___.","a":"often has several slow causes rather than one dramatic battle","x":["can be explained only by a single invasion","never coincides with a failed harvest","is always romanticised correctly in old books","cannot be studied with soil samples"],"w":"Çöküş nadiren tek savaş, çoğu zaman kuraklık, ticaret ve gerilimin birlikte yavaş sonucu.","k":"cikarim"},{"s":"The word \"widened\" is closest in meaning to ___.","a":"become broader in scope","x":["become narrower in funding","become more secret","become limited to tombs","become faster to complete"],"w":"\"widened\" = kapsamı genişlemek; alan daralmamış, gizli de olmamış.","k":"kelime"},{"s":"Which of the following is the best title for the passage?","a":"From Palaces to Kitchens: A Wider View of the Past","x":["The Treasures of Royal Tombs","How Single Battles Destroyed Ancient Cities","How to Read Tree Rings","Funding Problems in Modern Museums"],"w":"Metin arkeolojinin saraylardan sıradan insanların hayatına genişlemesini anlatıyor. \"Tek bir savaş\" seçeneği metinle çelişiyor.","k":"baslik"}]},{"id":"r25","type":"reading","lv":"B2","topic":"Hukuk","p":"Copyright law tries to balance two aims: giving creators a period in which they can earn money from their work, and allowing the rest of society to use ideas once that period ends. Works that have entered the public domain can be copied, translated and taught without asking permission. This is why older novels can appear in cheap school editions. The length of protection has grown over time, which some economists see as a gift to large publishers rather than to living authors. Others reply that longer terms encourage investment in restoring old films and recordings. Whatever the right number of years may be, the public domain is not a legal accident; it is the part of culture that the law deliberately returns to everyone.","qs":[{"s":"The main idea of the passage is that ___.","a":"copyright is meant both to reward creators for a time and to return works to public use afterwards","x":["school editions of old novels are illegal","the public domain exists only by mistake","living authors never benefit from copyright","films cannot be restored without secret contracts"],"w":"İki amaç ve kamu malının bilinçli bir hukuk alanı olduğu.","k":"anafikir"},{"s":"Works in the public domain ___.","a":"may be copied and taught without permission","x":["can be used only by the original publisher","disappear from all school libraries","must be restored before anyone reads them","remain under copyright forever"],"w":"Kamu malı eserler izin almadan kopyalanıp öğretilebilir.","k":"ayrinti"},{"s":"Some economists criticise longer copyright terms because ___.","a":"they may help large publishers more than living writers","x":["they make school books more expensive only for films","they abolish the public domain immediately","they prevent any investment in old recordings","they last only a few days"],"w":"\"a gift to large publishers rather than to living authors\".","k":"ayrinti"},{"s":"The word \"deliberately\" is closest in meaning to ___.","a":"on purpose","x":["by accident","in secret","too quickly","without any law"],"w":"Deliberately = kasten, bilinçli olarak.","k":"kelime"},{"s":"The author's view of the public domain is that it ___.","a":"is an intentional and valuable part of copyright law","x":["is an accident that the law should correct","harms living authors more than publishers","should be abolished to protect creators","applies only to old films and recordings"],"w":"Son cümle: kamu malı \"yasal bir kaza değil\", hukukun kültürü bilerek herkese geri verdiği kısım.","k":"tutum"}]},{"id":"s1","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"Although the new treatment has shown promising results in laboratory studies, ___.","a":"it has not yet been tested on human patients","x":["scientists are therefore confident that it is safe","it is the most widely used treatment today","the laboratory studies were very successful","doctors have been prescribing it for years"],"w":"\"Although\" zıtlık kurar: laboratuvarda umut verici ama henüz insanlarda denenmedi.","t":"bag"}]},{"id":"s2","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"By the time the firefighters arrived at the scene, ___.","a":"the fire had already destroyed most of the building","x":["the fire will have destroyed most of the building","the fire destroys most of the building","the fire has destroyed most of the building","the fire would destroy most of the building"],"w":"\"By the time + past simple\" → ana cümle past perfect.","t":"zaman"}]},{"id":"s3","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"___, the company decided to close two of its factories.","a":"Faced with a sharp decline in sales","x":["Because its products had become extremely popular","As long as its products remained popular","Unless the government had lowered taxes","So that it could employ more workers"],"w":"Fabrika kapatmanın mantıklı sebebi satışlardaki düşüş; participle yapı (Faced with = ... ile karşılaşınca).","t":"anlam"}]},{"id":"s4","type":"sentcomp","lv":"C1","topic":"","p":"","qs":[{"s":"Had the government invested in flood defences earlier, ___.","a":"the damage caused by the storm would have been far less severe","x":["the damage caused by the storm will be far less severe","the storm would cause less damage next year","the storm has caused serious damage","the damage is expected to be severe"],"w":"Devrik 3. tip koşul (Had ... V3) → would have + V3.","t":"kosul"}]},{"id":"s5","type":"sentcomp","lv":"B1","topic":"","p":"","qs":[{"s":"Many people prefer to shop online ___.","a":"because it saves them time and effort","x":["although it saves them time and effort","so that shops are always crowded","unless they have access to the internet","even if they enjoy visiting shops more"],"w":"Mantıklı sebep: zaman ve emek tasarrufu (because).","t":"bag"}]},{"id":"s6","type":"sentcomp","lv":"C1","topic":"","p":"","qs":[{"s":"Not only does regular reading improve vocabulary, ___.","a":"but it also enhances concentration and empathy","x":["and it also is reducing concentration","so it rarely helps students","but also people never read","whereas it improves vocabulary"],"w":"\"Not only ... but (it) also ...\" kalıbı ve anlam uyumu.","t":"anlam"}]},{"id":"s7","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"The scientists repeated the experiment several times ___.","a":"in order to make sure that the results were reliable","x":["even though they wanted reliable results","unless the results were reliable","so reliable that the results were repeated","although the results were reliable"],"w":"Amaç bildiriyor: sonuçların güvenilir olduğundan emin olmak için.","t":"bag"}]},{"id":"s8","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"___ that she was offered the job immediately.","a":"Her interview performance was so impressive","x":["Her interview performance was such impressive","Her interview performance was too impressive","Although her interview performance was weak","Her interview performance was impressive enough"],"w":"\"so + sıfat + that\" kalıbı.","t":"anlam"}]},{"id":"s9","type":"sentcomp","lv":"C1","topic":"","p":"","qs":[{"s":"Unless urgent action is taken to reduce emissions, ___.","a":"global temperatures are likely to continue rising","x":["global temperatures have already fallen","global temperatures would have risen","global temperatures stopped rising last year","emissions have been reduced successfully"],"w":"\"Unless\" 1. tip koşul gibi çalışır; gelecek tahmini gerekir.","t":"kosul"}]},{"id":"s10","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"While some experts believe that working from home increases productivity, ___.","a":"others argue that it reduces teamwork and creativity","x":["they also believe it increases productivity","working from home is very common","it was introduced during the pandemic","many companies have offices in the city"],"w":"\"While\" burada zıtlık/karşılaştırma bildiriyor: some ... others.","t":"bag"}]},{"id":"s11","type":"sentcomp","lv":"B1","topic":"","p":"","qs":[{"s":"If you had told me about the problem earlier, ___.","a":"I could have helped you","x":["I can help you","I will help you","I could help you yesterday","I have helped you"],"w":"3. tip koşul: could have + V3.","t":"kosul"}]},{"id":"s12","type":"sentcomp","lv":"C1","topic":"","p":"","qs":[{"s":"The museum, ___, attracts millions of visitors every year.","a":"which houses some of the world's most famous paintings","x":["that houses some of the world's most famous paintings","where houses some of the world's most famous paintings","whose houses some of the world's most famous paintings","houses some of the world's most famous paintings"],"w":"Virgüllü ilgi cümlesinde \"which\" kullanılır; \"that\" kullanılamaz.","t":"ilgi"}]},{"id":"s13","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"It is essential that every student ___.","a":"submit the application before the deadline","x":["submits the application after the deadline","will submit the application before the deadline","submitted the application before the deadline","has submitted the application late"],"w":"\"It is essential that\" + yalın fiil (subjunctive): submit.","t":"anlam"}]},{"id":"s14","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"___, the researchers were unable to reach a clear conclusion.","a":"Despite years of careful investigation","x":["Thanks to years of careful investigation","As a result of their clear findings","Because the data were very clear","Since the evidence was conclusive"],"w":"Yıllar süren araştırmaya rağmen sonuca ulaşılamaması: zıtlık (Despite).","t":"bag"}]},{"id":"s15","type":"sentcomp","lv":"C1","topic":"","p":"","qs":[{"s":"No sooner had the new policy been announced ___.","a":"than it was criticised by opposition parties","x":["when it was criticised by opposition parties","then it was criticised by opposition parties","that it was criticised by opposition parties","before it was criticised by opposition parties"],"w":"\"No sooner ... than\" kalıbı.","t":"anlam"}]},{"id":"s16","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"The more time children spend outdoors, ___.","a":"the less likely they are to develop short-sightedness","x":["they are less likely to develop short-sightedness","the least likely they are developing short-sightedness","so they are less likely to develop short-sightedness","less likely they develop short-sightedness"],"w":"\"The more ..., the less ...\" kalıbı.","t":"anlam"}]},{"id":"s17","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"The bridge was closed to traffic ___.","a":"after engineers discovered cracks in its main supports","x":["although engineers found it completely safe","so that more cars could use it","unless engineers discovered any cracks","as if it had been newly built"],"w":"Köprünün kapatılmasının mantıklı sebebi: çatlakların keşfedilmesi.","t":"anlam"}]},{"id":"s18","type":"sentcomp","lv":"C1","topic":"","p":"","qs":[{"s":"___, the patient would probably not have survived.","a":"Without the quick response of the ambulance team","x":["With the quick response of the ambulance team","Because of the ambulance team's quick response","Since the ambulance arrived quickly","As the ambulance team responded so quickly"],"w":"\"Without ...\" = (olmasaydı) koşul anlamı verir; would not have survived ile uyumlu tek şık.","t":"kosul"}]},{"id":"s19","type":"sentcomp","lv":"B1","topic":"","p":"","qs":[{"s":"She has been learning to play the piano ___.","a":"since she was seven years old","x":["for she was seven years old","when she will be seven","ago she was seven years old","until she is seven years old"],"w":"Present perfect continuous + since + başlangıç noktası.","t":"zaman"}]},{"id":"s20","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"The professor explained the theory again ___.","a":"so that every student could understand it","x":["so that every student can't understand it","such that no student has understood it","in order not understanding it","so as students understood it"],"w":"Amaç: \"so that + could\".","t":"bag"}]},{"id":"s21","type":"sentcomp","lv":"C1","topic":"","p":"","qs":[{"s":"It was not until the 19th century ___.","a":"that scientists understood how diseases are transmitted","x":["when scientists understood how diseases are transmitted","which scientists understood how diseases are transmitted","scientists did understand how diseases are transmitted","since scientists understood how diseases are transmitted"],"w":"\"It was not until ... that ...\" vurgu kalıbı.","t":"anlam"}]},{"id":"s22","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"Even if the company increases salaries, ___.","a":"it may still struggle to keep its most talented staff","x":["it kept its most talented staff easily","its staff have always been satisfied","it has increased salaries last year","it would have kept its best staff"],"w":"\"Even if\" (-se bile) + 1. tip yapıya uygun gelecek/olasılık anlamı.","t":"kosul"}]},{"id":"s23","type":"sentcomp","lv":"B2","topic":"","p":"","qs":[{"s":"___ the city has invested heavily in public transport, traffic congestion remains a serious problem.","a":"Although","x":["Because","Since","As long as","Provided that"],"w":"Yatırıma rağmen sorun sürüyor: zıtlık, Although.","t":"bag"}]},{"id":"s24","type":"sentcomp","lv":"C1","topic":"","p":"","qs":[{"s":"The data suggest that the decline in bee populations ___.","a":"may be linked to the widespread use of certain pesticides","x":["being linked to certain pesticides widely","to be linked to the use of pesticides","has linking with pesticides","which is linked to pesticides"],"w":"\"suggest that\" sonrası tam bir cümle (özne + yüklem) gerekir: may be linked.","t":"anlam"}]},{"id":"s25","type":"sentcomp","lv":"B1","topic":"","p":"","qs":[{"s":"I would rather stay at home tonight ___.","a":"than go to a crowded restaurant","x":["than going to a crowded restaurant","from going to a crowded restaurant","instead going to a crowded restaurant","to go to a crowded restaurant"],"w":"\"would rather + V1 + than + V1\" kalıbı.","t":"anlam"}]},{"id":"t1","type":"en_tr","lv":"B2","topic":"","p":"","qs":[{"s":"Although renewable energy sources have become cheaper in recent years, many countries still rely heavily on fossil fuels.","a":"Yenilenebilir enerji kaynakları son yıllarda daha ucuz hale gelmiş olsa da birçok ülke hâlâ büyük ölçüde fosil yakıtlara bağımlıdır.","x":["Yenilenebilir enerji kaynakları son yıllarda ucuzladığı için birçok ülke artık fosil yakıtlara daha az bağımlıdır.","Birçok ülke fosil yakıtlara bağımlı olduğundan yenilenebilir enerji kaynakları son yıllarda pahalılaşmıştır.","Son yıllarda birçok ülke, yenilenebilir enerji kaynaklarını fosil yakıtlardan daha ucuz hale getirmiştir.","Yenilenebilir enerji kaynakları ucuzlasaydı birçok ülke fosil yakıtlara bu kadar bağımlı olmazdı."],"w":"\"Although\" = -se de / -mesine rağmen; \"still rely heavily on\" = hâlâ büyük ölçüde bağımlı. Diğer şıklar anlam ilişkisini (zıtlık) bozuyor."}]},{"id":"t2","type":"en_tr","lv":"B2","topic":"","p":"","qs":[{"s":"The researchers found that children who read regularly perform better in all school subjects, not just in language classes.","a":"Araştırmacılar, düzenli okuyan çocukların sadece dil derslerinde değil tüm okul derslerinde daha başarılı olduğunu buldu.","x":["Araştırmacılar, düzenli okuyan çocukların özellikle dil derslerinde başarılı olduğunu buldu.","Araştırmacılara göre çocuklar, dil derslerinde başarılı olmak için düzenli okumalıdır.","Araştırmacılar, tüm okul derslerinde başarılı olan çocukların düzenli kitap okumadığını buldu.","Araştırmacılar, dil dersleri dışında okumanın çocukların başarısını etkilemediğini buldu."],"w":"\"not just in language classes\" = sadece dil derslerinde değil; \"perform better in all school subjects\" = tüm derslerde daha başarılı."}]},{"id":"t3","type":"en_tr","lv":"C1","topic":"","p":"","qs":[{"s":"Had the warning signs been taken seriously, the crisis could have been prevented.","a":"Uyarı işaretleri ciddiye alınmış olsaydı kriz önlenebilirdi.","x":["Uyarı işaretleri ciddiye alındığı için kriz önlenebildi.","Kriz önlenemediği için uyarı işaretleri ciddiye alınmadı.","Uyarı işaretleri ciddiye alınırsa kriz önlenebilir.","Uyarı işaretleri ciddiye alınmasına rağmen kriz önlenemedi."],"w":"Devrik 3. tip koşul: geçmişte olmamış bir durum. \"-miş olsaydı ... -ebilirdi\"."}]},{"id":"t4","type":"en_tr","lv":"B2","topic":"","p":"","qs":[{"s":"It is estimated that nearly half of the world's population lives in areas where clean water is scarce.","a":"Dünya nüfusunun yaklaşık yarısının temiz suyun kıt olduğu bölgelerde yaşadığı tahmin edilmektedir.","x":["Dünya nüfusunun yarısından fazlası temiz suya kolayca ulaşabilmektedir.","Temiz suyun kıt olduğu bölgelerde yaşayan insanların sayısının yarıya indiği tahmin edilmektedir.","Dünya nüfusunun neredeyse yarısının temiz su kaynakları yakınında yaşadığı bilinmektedir.","Temiz su kıtlığı nedeniyle dünya nüfusunun yarısının göç ettiği tahmin edilmektedir."],"w":"\"It is estimated that\" = tahmin edilmektedir; \"nearly half\" = yaklaşık yarısı; \"scarce\" = kıt."}]},{"id":"t5","type":"en_tr","lv":"B1","topic":"","p":"","qs":[{"s":"Unless you book your tickets in advance, you may not find a seat on the train.","a":"Biletlerini önceden ayırtmazsan trende yer bulamayabilirsin.","x":["Biletlerini önceden ayırttığın için trende yer bulabilirsin.","Trende yer bulamadığın için biletlerini önceden ayırtmalısın.","Biletlerini önceden ayırtsan bile trende yer bulamayabilirsin.","Trende yer bulmak için biletlerini önceden ayırtmana gerek yok."],"w":"\"Unless\" = -mezsen; \"may not find\" = bulamayabilirsin."}]},{"id":"t6","type":"en_tr","lv":"C1","topic":"","p":"","qs":[{"s":"The extent to which social media affects mental health remains a matter of debate among scientists.","a":"Sosyal medyanın ruh sağlığını ne ölçüde etkilediği bilim insanları arasında hâlâ tartışma konusudur.","x":["Bilim insanları sosyal medyanın ruh sağlığını olumsuz etkilediği konusunda hemfikirdir.","Sosyal medyanın ruh sağlığı üzerindeki etkisi bilim insanları tarafından kanıtlanmıştır.","Bilim insanları arasındaki tartışmalar sosyal medyada ruh sağlığını etkilemektedir.","Sosyal medya kullanımı arttıkça bilim insanları ruh sağlığını daha çok tartışmaktadır."],"w":"\"The extent to which\" = ne ölçüde; \"remains a matter of debate\" = hâlâ tartışma konusudur."}]},{"id":"t7","type":"en_tr","lv":"B2","topic":"","p":"","qs":[{"s":"Not only did the new law reduce air pollution, but it also improved public health.","a":"Yeni yasa yalnızca hava kirliliğini azaltmakla kalmadı, aynı zamanda halk sağlığını da iyileştirdi.","x":["Yeni yasa hava kirliliğini azaltmadı ama halk sağlığını iyileştirdi.","Yeni yasa halk sağlığını iyileştirmek için hava kirliliğini azaltmayı amaçlıyor.","Hava kirliliği azalmadıkça yeni yasa halk sağlığını iyileştiremez.","Yeni yasa, hava kirliliğini azaltsa da halk sağlığını iyileştirmedi."],"w":"\"Not only ... but also\" = yalnızca ... değil, aynı zamanda ... de."}]},{"id":"t8","type":"en_tr","lv":"B2","topic":"","p":"","qs":[{"s":"Many people are unaware that sitting for long periods can be as harmful as smoking.","a":"Birçok insan uzun süre oturmanın sigara içmek kadar zararlı olabileceğinin farkında değil.","x":["Birçok insan uzun süre oturmanın sigara içmekten daha zararlı olduğunu bilir.","Sigara içen insanlar uzun süre oturmanın zararlarının farkındadır.","Uzun süre oturan insanlar sigara içmenin zararlarını bilmez.","Birçok insan sigara içmeyi bırakınca daha uzun süre oturmaya başlar."],"w":"\"unaware\" = farkında değil; \"as harmful as\" = kadar zararlı."}]},{"id":"t9","type":"en_tr","lv":"C1","topic":"","p":"","qs":[{"s":"The findings suggest that the disease may have spread far earlier than was previously thought.","a":"Bulgular, hastalığın daha önce düşünüldüğünden çok daha erken yayılmış olabileceğini göstermektedir.","x":["Bulgular, hastalığın daha önce düşünüldüğü kadar hızlı yayılmadığını göstermektedir.","Önceki bulgular, hastalığın çok erken bir dönemde yayılmaya başladığını kanıtlamıştır.","Bulgular, hastalığın gelecekte daha hızlı yayılacağını öne sürmektedir.","Hastalığın yayılmasının bulgulardan çok daha önce tahmin edildiği anlaşılmıştır."],"w":"\"may have spread\" = yayılmış olabilir; \"far earlier than was previously thought\" = daha önce düşünüldüğünden çok daha erken."}]},{"id":"t10","type":"en_tr","lv":"B1","topic":"","p":"","qs":[{"s":"She would have passed the exam if she had studied a little harder.","a":"Biraz daha sıkı çalışsaydı sınavı geçerdi.","x":["Biraz daha sıkı çalıştığı için sınavı geçti.","Biraz daha sıkı çalışırsa sınavı geçecek.","Sınavı geçmek için biraz daha sıkı çalışması gerekiyor.","Sıkı çalışmasına rağmen sınavı geçemedi."],"w":"3. tip koşul: geçmişte gerçekleşmemiş durum (-saydı ... -erdi)."}]},{"id":"t11","type":"tr_en","lv":"B2","topic":"","p":"","qs":[{"s":"Uzmanlar, düzenli egzersiz yapmanın stresi azaltmanın en etkili yollarından biri olduğunu belirtiyor.","a":"Experts state that exercising regularly is one of the most effective ways of reducing stress.","x":["Experts state that stress is the most effective way of avoiding regular exercise.","According to experts, people who are stressed should not exercise regularly.","Experts have found that regular exercise is less effective than reducing stress.","Experts state that reducing stress makes regular exercise more effective."],"w":"\"en etkili yollarından biri\" = one of the most effective ways; özne \"düzenli egzersiz yapmak\"."}]},{"id":"t12","type":"tr_en","lv":"B2","topic":"","p":"","qs":[{"s":"Hükümet, gelecek yıl eğitime daha fazla kaynak ayırmayı planlıyor.","a":"The government is planning to allocate more resources to education next year.","x":["The government allocated more resources to education last year.","The government is planning to reduce the resources allocated to education next year.","Education will be planned by the government with fewer resources next year.","The government has never allocated enough resources to education."],"w":"\"planlıyor\" = is planning; \"daha fazla kaynak ayırmak\" = allocate more resources; \"gelecek yıl\" = next year."}]},{"id":"t13","type":"tr_en","lv":"C1","topic":"","p":"","qs":[{"s":"Bu ilacın uzun vadeli yan etkileri henüz tam olarak bilinmemektedir.","a":"The long-term side effects of this drug are not yet fully known.","x":["This drug has no long-term side effects.","The side effects of this drug were fully known in the long term.","The long-term effects of this drug are well known by now.","This drug will not have side effects in the long term."],"w":"\"henüz tam olarak bilinmemektedir\" = are not yet fully known."}]},{"id":"t14","type":"tr_en","lv":"B1","topic":"","p":"","qs":[{"s":"Erken kalkmama rağmen otobüsü kaçırdım.","a":"Although I got up early, I missed the bus.","x":["Because I got up early, I caught the bus.","I missed the bus, so I got up early.","If I had got up early, I wouldn't have missed the bus.","I got up early in order not to miss the bus."],"w":"\"-me rağmen\" = although; \"kaçırdım\" = missed."}]},{"id":"t15","type":"t const reduceMotion = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
function countTo(el, to, ms = 600, fmt = n => n.toLocaleString("tr-TR")) {
  const from = +(el.dataset.v || 0);
  el.dataset.v = to;
  if (reduceMotion() || from === to || !ms) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(from + (to - from) * e)); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function bumpEl(el) { if (!el) return; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
function floatXP(anchor, text) {
  if (!anchor || reduceMotion()) return;
  const r = anchor.getBoundingClientRect();
  const f = document.createElement("span");
  f.className = "xpfloat"; f.textContent = text;
  f.style.left = (r.left + r.width / 2) + "px"; f.style.top = (r.top + 4) + "px";
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}
// lightweight confetti on a canvas overlay; colours come from the theme tokens
function confetti(count = 90, originY = .35) {
  if (reduceMotion()) return;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--hl", "--accent", "--good", "--bad"].map(v => cs.getPropertyValue(v).trim() || "#FFE14D");
  let c = document.getElementById("confetti");
  if (!c) { c = document.createElement("canvas"); c.id = "confetti"; c.setAttribute("aria-hidden", "true"); document.body.appendChild(c); }
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ps = Array.from({ length: count }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .25, y: innerHeight * originY, vx: (Math.random() - .5) * 13, vy: -Math.random() * 12 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6.28, vr: (Math.random() - .5) * .35, col: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  const tick = t => {
    const age = t - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - age / 2200); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (age < 2200) requestAnimationFrame(tick); else c.remove();
  };
  requestAnimationFrame(tick);
}

function choosePractice(lv, n) {
  const ws = pool(lv);
  const dueW = shuffle(ws.filter(due));
  const seen = shuffle(ws.filter(w => getP(w) && !due(w)));
  const fresh = shuffle(ws.filter(w => !getP(w)));
  // mostly due, then a mix of seen and new so practice also introduces words
  const out = [];
  for (const src of [dueW, fresh.slice(0, Math.ceil(n / 2)), seen, fresh]) for (const w of src) { if (out.length >= n) break; if (!out.includes(w)) out.push(w); }

    <div class="btnrow">${wrongs.length ? `<button class="btn" type="button" id="redo">Bu ${unit === "soru" ? "soruları" : "kelimeleri"} bir daha çalış</button>` : ""}<button class="btn ${wrongs.length ? "ghost" : ""}" type="button" id="again">Yeni tur</button><button class="btn ghost" type="button" id="home">${game.mode[0] === "g" ? "Gramer sayfası" : game.mode.startsWith("ex:") || game.mode === "redoMock" ? "Sınav sayfası" : game.mode === "weak" || game.mode === "trap" ? "İlerlemem" : "Ana sayfa"}</button></div>
  </div></section>`;
  const mode = game.mode, topic = game.topic;
  app.querySelectorAll("[data-count]").forEach(el => countTo(el, +el.dataset.count, 800));
  if (r.length && (pct >= 70 || game.record)) { const big = pct >= 90 || game.record; setTimeout(() => confetti(big ? 150 : 90), 250); }
  wireRows(app);
  document.getElementById("again").addEventListener("click", () => mode === "aicloze" ? startAiCloze() : mode === "redoMock" ? setTab("exam") : mode === "weak" ? startWeakDrill() : mode === "trap" ? startTrapDrill(topic) : startGame(mode, topic));
  document.getElementById("home").addEventListener("click", () => { const back = mode[0] === "g" ? "gram" : mode.startsWith("ex:") || mode === "redoMock" ? "exam" : mode === "weak" || mode === "trap" ? "me" : null; quitGame(); if (back) setTab(back); });
  const rd = document.getElementById("redo");
  if (rd) rd.addEventListener("click", () => {
    const words = wrongs.filter(q => !isCloze(q) && q.kind !== "sdikte" && q.w).map(q => q.w);
    const qs = shuffle(wrongs.map(repeatQ)).concat(shuffle(words).map(w => mcQ(w, "type")));
    const lv = game.lv;
    if (game) clearInterval(game.timer);
    game = newGame("redo", qs);
    game.lv = lv;
    window.scrollTo({ top: 0 });
    renderGame();
  });
}

document.addEventListener("keydown", e => {

  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA")) return;
  if (game && game.mode === "mock" && game.phase === "mock") {
    if (/^[1-5]$/.test(e.key)) { const b = app.querySelectorAll(".opt")[+e.key - 1]; if (b) b.click(); }

    return;
  }
  if (!game || game.phase !== "play" || game.mode === "match") return;
  const q = game.qs[game.i];

/* Claude writes fresh in-context questions for the words being learned at this level */
let sampleNs; // undefined = not asked yet
async function getSample() {
  if (sampleNs !== undefined) return sampleNs;
  try {
    if (!window.claude || !window.claude.use) { sampleNs = null; return null; }
    sampleNs = await Promise.race([
      window.claude.use("sample"),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000))
    ]);
  } catch (e) { sampleNs = null; }
  return sampleNs;
}
function parseModelJson(t) {
  if (!t) return null;
  const m = String(t).match(/\{[\s\S]*\}/);
  if (!m) return null;
  try { return JSON.parse(m[0]); } catch (e) { return null; }
}
async function askJsonAI(prompt) {
  const sm = await getSample();
  if (sm) {
    try { return await sm.json(prompt, { modelTier: "quick" }); } catch (e) { if (!(S.aiKey || "").trim()) throw e; }
  }
  const key = (S.aiKey || "").trim();
  if (!key) return null;
  const asJson = txt => parseModelJson(txt);
  try {
    if (key.startsWith("sk-ant-")) {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: "claude-3-5-haiku-latest", max_tokens: 1600, messages: [{ role: "user", content: prompt + "\nReturn JSON only." }] })
      });
      const j = await res.json();
      if (!res.ok) throw new Error((j && j.error && j.error.message) || "API");
      return asJson((j.content || []).map(c => c.text || "").join("\n"));
    }
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "content-type": "application/json", Authorization: "Bearer " + key },
      body: JSON.stringify({ model: "gpt-4o-mini", temperature: 0.4, response_format: { type: "json_object" }, messages: [{ role: "user", content: prompt }] })
    });
    const j = await res.json();
    if (!res.ok) throw new Error((j && j.error && j.error.message) || "API");
    return asJson(j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content);
  } catch (e) {
    toast("Yerel API anahtarı çalışmadı (tarayıcı CORS veya ağ). Claude.ai veya çevrimdışı örnek kullanılabilir.");
    return null;
  }
}
async function startAiCloze() {
  const lv = S.level;
  const learning = shuffle(pool(lv).filter(w => { const p = getP(w); return p && p[0] < MASTER; }));
  const others = shuffle(pool(lv).filter(w => !learning.includes(w)));
  const words = learning.concat(others).slice(0, 8);
  game = null;
  app.innerHTML = `<section class="game"><div class="card result"><h2>Cümleler yazılıyor…</h2><p class="sub">${esc(words.map(w => w.w).join(", "))} için sınav tarzı cümleler hazırlıyorum.</p><div class="btnrow"><button class="btn ghost" type="button" id="aiCancel">Vazgeç</button></div></div></section>`;
  let cancelled = false;
  document.getElementById("aiCancel").addEventListener("click", () => { cancelled = true; refresh(); });
  const prompt = `You write fill-in-the-blank vocabulary questions for a Turkish student preparing for the YDS / YÖKDİL English exams.
Target words (CEFR ${lv === "YDS" ? "B2-C1 academic" : lv === "ALL" ? "mixed" : lv}): ${words.map(w => `${w.w} (${posTr(w.p)}: ${firstMeaning(w.t)})`).join("; ")}.
For EACH target word write one question. Return JSON only: {"items":[{"word":"<target word exactly as given>","answer":"<the form that fills the blank>","sentence":"<sentence with exactly one ___ where the answer goes>","distractors":["...","...","..."],"tr":"<natural Turkish translation of the completed sentence>"}]}
Rules: the sentence is 10-22 words, clear context so ONLY the answer fits; distractors are the same part of speech and grammatical form as the answer but clearly wrong in meaning; never use the answer or its synonyms as distractors; register like YDS reading passages for B2+ words, everyday for A1-B1.`;
  try {
    const d = await askJsonAI(prompt);
    if (cancelled) return;
    if (!d) {
      const set = new Set(words.map(w => w.w.toLowerCase()));
      const hit = V.filter(it => set.has(it.w.w.toLowerCase()));
      const rest = shuffle(V.filter(it => inLevel(it.w, lv) && !hit.includes(it)));
      const items = hit.concat(rest).slice(0, 8);
      if (!items.length) { toast("Hazır cümle yok. Sözlükten kelime ekleyebilirsin."); return refresh(); }
      toast("Claude bu görünümde yok; hazır cümlelerden bir tur açıyorum.");
      return startGame("aicloze", items);
    }
    const set = new Map(words.map(w => [w.w.toLowerCase(), w]));
    const items = ((d && d.items) || []).map((x, n) => {
      const w = set.get(String(x.word || "").toLowerCase());
      const ds = Array.isArray(x.distractors) ? x.distractors.map(String).filter(Boolean) : [];
      if (!w || typeof x.sentence !== "string" || x.sentence.split("___").length !== 2 || !x.answer || ds.length < 3) return null;
      if (ds.slice(0, 3).some(v => v.toLowerCase() === String(x.answer).toLowerCase())) return null;
      return { id: "ai" + Date.now() + n, ai: true, w, a: String(x.answer), s: x.sentence, d: ds.slice(0, 3), tr: String(x.tr || "") };
    }).filter(Boolean);
    if (!items.length) { toast("Cümleler beklenen biçimde gelmedi. Bir kez daha dene."); return refresh(); }
    startGame("aicloze", items);
  } catch (e) {
    if (cancelled) return;
    const set = new Set(words.map(w => w.w.toLowerCase()));
    const hit = V.filter(it => set.has(it.w.w.toLowerCase()));
    const rest = shuffle(V.filter(it => inLevel(it.w, lv) && !hit.includes(it)));
    const items = hit.concat(rest).slice(0, 8);
    if (items.length) {
      toast("Claude cümleleri alınamadı; hazır cümlelerden bir tur açıyorum.");
      return startGame("aicloze", items);
    }
    toast(e && e.code === "not_granted" ? "İzin verilmediği için cümle üretilemedi." : e && e.code === "rate_limited" ? "Çok sık istek gönderildi. Biraz sonra dene." : "Cümleler üretilemedi. Bir kez daha dene.");
    refresh();
  }
}

// turns raw English text into HTML: blanks become gap markers, words become tappable when taps is on

function applyMy() {

    const k = String(e.w || "").trim().toLowerCase(); if (!k) continue;
    let w = BYKEY.get(k);
    if (!w) { w = { i: W.length, w: String(e.w).trim(), p: e.p || "n", t: e.t || "", l: "MY", y: false, s: e.s || "", ipa: "" }; W.push(w); BYKEY.set(k, w); }
    w.my = true;
  }
}
function addMy(word, tr, pos, syn) {
  const k = word.trim().toLowerCase();
  if (!k) return false;
  if ((S.my || []).some(e => String(e.w).toLowerCase() === k)) { toast("Bu kelime zaten listende."); return false; }
  const exists = BYKEY.get(k);
  S.my.push(exists ? { w: exists.w } : { w: word.trim(), p: pos, t: tr.trim(), s: (syn || "").trim() });
  applyMy(); persist(); checkBadges();
  toast(exists ? `"${exists.w}" zaten sözlükte vardı; listene eklendi.` : `"${word.trim()}" listene eklendi ve tekrar sistemine girdi.`);

}
function removeMy(w) { S.my = (S.my || []).filter(e => String(e.w).toLowerCase() !== w.w.toLowerCase()); w.my = false; persist(); toast(`"${w.w}" listenden çıkarıldı.`); }

/* ---------- daily plan, badges ---------- */
const daysToExam = () => { if (!S.examDate) return null; const t = Date.parse(S.examDate + "T09:00:00"); return isNaN(t) ? null : Math.ceil((t - Date.now()) / 86400000); };
function dailyPlan() {
  const t = today();
  const days = daysToExam();
  const dueN = pool(S.level).filter(due).length;
  const newToday = Object.values(S.prog).filter(p => p[6] === t).length;
  let newTarget = 10;
  if (days && days > 0) { const leftW = W.filter(w => (["B1", "B2", "C1", "YDS"].includes(w.l) || w.y) && !getP(w)).length; newTarget = Math.max(10, Math.min(40, Math.ceil(leftW / days))); }
  const hToday = S.hist.filter(h => h.d === t);
  const order = ["A1", "A2", "B1", "B2", "C1", "YDS"];
  const topics = G.slice().sort((a, b) => (a.lv === S.glevel ? -1 : 0) - (b.lv === S.glevel ? -1 : 0) || order.indexOf(a.lv) - order.indexOf(b.lv));
  const nextTopic = topics.find(tp => { const s = topicStats(tp); return s.learned < s.total; }) || G[0];
  const typeAcc = t2 => { let okc = 0, x = 0; EX.filter(g => g.type === t2).forEach(g => g.items.forEach(it => { const p = S.eq[it.id]; if (p) { okc += p[2]; x += p[3]; } })); return okc + x ? okc / (okc + x) : -1; };
  const types = Object.keys(EXTYPES).sort((a, b) => typeAcc(a) - typeAcc(b));
  const exType = types.find(x => typeAcc(x) === -1) || types[0];
  const lastMock = S.mocks.length ? S.mocks[S.mocks.length - 1].ts : 0;
  const tasks = [
    { label: dueN ? `Akıllı tekrar: ${dueN} kelime seni bekliyor` : "Akıllı tekrar: bugün tekrarı gelen kelime yok", done: dueN === 0, run: () => startGame("review") },
    { label: `Yeni kelime: ${Math.min(newToday, newTarget)}/${newTarget}`, done: newToday >= newTarget, run: () => startGame("learn") },
    { label: `Gramer: ${nextTopic.tr} (${nextTopic.lv})`, done: hToday.some(h => h.m[0] === "g"), run: () => startGame("gtopic", nextTopic.id) },
    { label: `YDS soru tipi: ${EXTYPES[exType].name}`, done: hToday.some(h => h.m.startsWith("ex:") || h.m === "mock"), run: () => startGame("ex:" + exType) }
  ];
  if (days !== null && days <= 60 && Date.now() - lastMock > 6 * 86400000) tasks.push({ label: "Bu hafta bir deneme sınavı çöz", done: false, run: startMock });
  return { days, tasks };
}
function planHtml() {

function trapCandidates() {

  const re = new RegExp("\\b" + key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
  const out = [], seen = new Set();
  const add = (en, tr) => { if (out.length < 2 && !seen.has(en)) { seen.add(en); out.push({ en, tr }); } };
  for (const it of V) if (it.w === w) add(plainFill(it.s, it.a), it.tr);
  for (const it of XI) if (it.a.toLowerCase() === key) add(plainFill(it.s, it.a), it.tr);
  for (const t of G) for (const e of t.e) if (re.test(e[0])) add(e[0], e[1]);
  if (out.length < 2) for (const g of EX) { if (!g.p || g.type === "cloze" || g.type === "irrelevant") continue; for (const sen of g.p.replace(/\([IV]+\)\s*/g, "").split(/(?<=[.!?])\s+/)) if (re.test(sen) && !sen.includes("___")) add(sen.replace(/^[A-Z][a-z]+: /, ""), "Okuma metninden"); }
  return { examples: out, tip: "", collocations: [], none: !out.length };
}
function openWord(w) {
  closeSheet();
  const p = getP(w);
  const st = status(w);
  const stTxt = { new: "Henüz çalışılmadı", learning: "Öğreniliyor", mastered: "Öğrenildi", hard: "Zorlanıyorsun, sık tekrar edilecek" }[st];
  const nextTxt = p ? (p[1] <= today() ? "bugün" : `${p[1] - today()} gün sonra`) : "—";
  const el = document.createElement("div");
  el.className = "scrim";
  el.innerHTML = `<div class="card sheet" role="dialog" aria-modal="true" aria-label="${esc(w.w)}">
    <button class="iconbtn close" type="button" id="xclose" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="big"><span class="hlw">${esc(w.w)}</span>${spk(w.w)}</div>
    ${w.ipa ? `<div class="ipa" lang="en">${esc(w.ipa)}</div>` : ""}
    ${metaPills(w).replace('class="qmeta"', 'class="qmeta" style="justify-content:flex-start"')}
    <div class="mean">${esc(w.t)}</div>
    <dl class="kv">
      ${w.s ? `<dt>Eş anlamlı</dt><dd>${esc(w.s)}</dd>` : ""}
      <dt>Durum</dt><dd>${esc(stTxt)}</dd>
      <dt>Doğru / yanlış</dt><dd style="font-family:var(--f-mono)">${p ? p[2] : 0} / ${p ? p[3] : 0}</dd>
      <dt>Sonraki tekrar</dt><dd>${esc(nextTxt)}</dd>
    </dl>
    <div id="aiBox"></div>
    <div class="btnrow" style="justify-content:flex-start">
      <button class="btn" type="button" id="aiBtn">Örnek cümle iste</button>
      ${st !== "mastered" ? '<button class="btn ghost" type="button" id="know">Bunu zaten biliyorum</button>' : '<button class="btn ghost" type="button" id="reset">Tekrar öğrenmek istiyorum</button>'}
      <button class="btn ghost" type="button" id="myBtn">${w.my ? "Listemden çıkar" : "Listeme ekle"}</button>
    </div></div>`;
  document.getElementById("layer").appendChild(el);
  trapFocus(el);
  el.addEventListener("click", e => { if (e.target === el) closeSheet(); });
  document.getElementById("xclose").addEventListener("click", closeSheet);
  document.getElementById("xclose").focus({ preventScroll: true });
  const k = document.getElementById("know");
  if (k) k.addEventListener("click", () => { const q = getP(w) ? getP(w).slice() : [0, 0, 0, 0]; q[0] = 5; q[1] = today() + INTERVALS[5]; q[2]++; S.prog[w.w.toLowerCase()] = q; persist(); toast(`"${w.w}" öğrenildi olarak işaretlendi. ${INTERVALS[5]} gün sonra bir kez soracağım.`); closeSheet(); refresh(); });
  const r = document.getElementById("reset");
  if (r) r.addEventListener("click", () => { const q = getP(w).slice(); q[0] = 0; q[1] = today(); S.prog[w.w.toLowerCase()] = q; persist(); toast(`"${w.w}" tekrar listesine eklendi.`); closeSheet(); refresh(); });
  document.getElementById("myBtn").addEventListener("click", () => { if (w.my) removeMy(w); else addMy(w.w, w.t, w.p, w.s); closeSheet(); refresh(); });
  const box = document.getElementById("aiBox");
  if (aiCache.has(w.w)) showAi(box, aiCache.get(w.w));
  else showAi(box, localExamples(w));
  document.getElementById("aiBtn").addEventListener("click", () => askClaude(w, box));
}
function showAi(box, d) {
  box.innerHTML = `<div class="ai">${d.none ? "<p>Bu kelime için hazır bir örnek cümle yok. \"Örnek cümle iste\" düğmesi claude.ai üzerinde ya da İlerlemem'e kaydettiğin API anahtarıyla yeni cümle yazar.</p>" : ""}${(d.examples || []).map(x => `<p class="ex">${esc(x.en)}<i>${esc(x.tr)}</i></p>`).join("")}
    ${d.tip ? `<p><b>Hafıza ipucu:</b> ${esc(d.tip)}</p>` : ""}${d.collocations && d.collocations.length ? `<p><b>Sık kullanılan kalıplar:</b> ${esc(d.collocations.join(", "))}</p>` : ""}</div>`;
}
async function askClaude(w, box) {
  const btn = document.getElementById("aiBtn");
  const prompt = `You help a Turkish student preparing for the YDS / YÖKDİL English exams.
Word: "${w.w}" (${posTr(w.p)}), Turkish meaning: "${w.t}"${w.s ? `, synonyms: ${w.s}` : ""}. CEFR level: ${w.l}.
Return JSON only: {"examples":[{"en":"...","tr":"..."},{"en":"...","tr":"..."}],"tip":"...","collocations":["...","..."]}
- examples: two sentences in an academic, exam-like register (like YDS reading passages), 12-25 words each, using the word in the given meaning; "tr" is a natural Turkish translation.
- tip: one short memory tip in Turkish (an association, word root, or contrast with a confusable word).
- collocations: 2-4 common collocations or patterns with this word in English.`;
  btn.disabled = true; btn.textContent = "Yazılıyor…";
  try {
    const d = await askJsonAI(prompt);
    if (!d || !d.examples) {
      showAi(box, localExamples(w));
      box.insertAdjacentHTML("beforeend", `<p class="ex-local">Yeni cümle claude.ai üzerinde ya da kayıtlı API anahtarıyla üretilir; yukarıdakiler projedeki hazır cümlelerden.</p>`);
      btn.remove();
      return;
    }
    aiCache.set(w.w, d);
    showAi(box, d);
    btn.remove();
  } catch (e) {
    btn.disabled = false; btn.textContent = "Örnek cümle iste";
    const msg = e && e.code === "not_granted" ? "İzin verilmediği için örnek cümle alınamadı." : e && e.code === "rate_limited" ? "Çok sık istek gönderildi. Biraz sonra tekrar dene." : "Örnek cümle alınamadı. Bir kez daha dene.";
    if (e && e.code === "not_granted") btn.remove();
    box.innerHTML = `<div class="ai"><p>${esc(msg)}</p></div>`;
  }
}

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") maybeNotifyDue(); });
refresh();
})();
